<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory tracker</title>
<style>
/* Live tracker (variant A). Offline: the page reloads tracker-data.js every 3 s; tracker.py writes it. */
:root{--ink:#2e2d38;--muted:#8b879a;--line:#ebe8f1;--soft:#f7f6fb;--accent:#6c7fd8;--accent-ink:#3a49a8;
  --accent-soft:#eef0fc;--ok:#3f9d72;--ok-soft:#ecf8f1;--ok-line:#c4e7d4;--warn:#a86b12;--warn-soft:#fdf5e6;--warn-line:#f0dcb4;
  --bad:#b4534b;--bad-soft:#fbefee;--bad-line:#efcdc9}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
[hidden]{display:none!important}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;background:var(--soft);color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.app{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px;padding:8px 12px 10px}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px 12px}
.brand{display:flex;align-items:center;gap:8px}.brand b{font-size:16px;font-weight:500}
.live{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok)}
.live i{width:7px;height:7px;border-radius:50%;background:#5cc995;animation:blink 1.6s infinite}
.live.idle{color:var(--muted)}.live.idle i{background:#cfcbd8;animation:none}
@keyframes blink{50%{opacity:.3}}
.stage{color:#5d5a6b}.stage b{font-weight:500;color:var(--ink)}
.prog{display:flex;align-items:center;gap:6px;color:var(--muted)}
.pbar{width:90px;height:6px;border-radius:999px;background:#efedf4;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b9c3f1,#8fd1b0);border-radius:999px;transition:width .8s}
.gates{display:flex;gap:4px;flex-wrap:wrap}
.gate{border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);font-size:12px;background:#fff;transition:all .6s}
.gate.approved{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.gate.next{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.gate.pop{animation:pop .8s}@keyframes pop{40%{transform:scale(1.15)}}
.sp{flex:1}
.upd{color:var(--muted);font-size:12px}

.pipe{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.pst{position:relative;border:1px solid var(--line);border-radius:10px;padding:4px 7px;background:#fff;overflow:hidden;min-width:0}
.pst b{display:block;font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pst span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pst.done{border-color:var(--ok-line);background:var(--ok-soft)}.pst.done b{color:var(--ok)}
.pst.skip{opacity:.5;border-style:dashed}
.pst.cur{border-color:#c9d0f3;background:var(--accent-soft)}.pst.cur b{color:var(--accent-ink)}
.pst.cur::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
  transform:translateX(-100%);animation:sweep 2.2s infinite}
@keyframes sweep{to{transform:translateX(100%)}}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(250px,.8fr);grid-template-rows:minmax(0,1fr) auto;gap:8px;min-height:0}
/* the constellation spans two columns; when you have something to answer it shrinks and your questions take the middle */
#visP{grid-column:1/3;grid-row:1}
#workPanel{grid-column:1/3;grid-row:2}
#inbox{grid-column:2;grid-row:1/3}
#colR{grid-column:3;grid-row:1/3;grid-template-rows:auto auto minmax(0,1fr)}
.grid.asking #visP,.grid.asking #workPanel{grid-column:1}
.col{display:grid;gap:8px;min-height:0;grid-template-rows:auto minmax(0,1fr)}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 11px;min-height:0;display:flex;flex-direction:column}
.panel h2{margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;flex:none}
.panel h2 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:0 7px}
.scroll{overflow:hidden;min-height:0;flex:1}
#feed{overflow:auto}
#workPanel{min-height:170px}
#now{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 14px;align-content:start}
#now .idle{grid-column:1/-1}
.vis{position:relative}
.vis svg{display:block;width:100%;flex:1 1 0;min-height:0}
.note{border-color:#c9d0f3;background:var(--accent-soft);color:var(--accent-ink)}
.note.wait{background:var(--warn-soft);border-color:var(--warn-line);color:#6e4a0c}
.note b{font-weight:500}

.wk{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 9px;align-items:center;padding:5px 0;border-top:1px solid #f3f1f6}
.wk.new{animation:slideIn .5s ease-out}
.wk:first-child{border-top:0}
.ava{position:relative;width:30px;height:30px;grid-row:span 2}
.ava .core{position:absolute;inset:4px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:10px}
.ava svg{position:absolute;inset:0;animation:spin 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wk .who{font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .who small{font-weight:400;color:var(--muted);margin-left:4px}
.wk .tm{color:var(--muted);font-size:12px;grid-row:span 2;align-self:center}
.thought{grid-column:2;color:#4b58a8;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.typer::after{content:"▍";animation:blink 1s infinite;margin-left:1px;color:var(--accent)}
.idle{color:var(--muted);padding:6px 0}

.tb{display:grid;grid-template-columns:112px minmax(0,1fr);gap:6px;align-items:start;padding:3px 0;border-top:1px solid #f3f1f6}
.tb:first-child{border-top:0}
.tb .tn{display:flex;align-items:center;gap:6px;font-weight:500;padding-top:2px}
.tb .tn i{width:8px;height:8px;border-radius:50%;flex:none}
.pills{display:flex;flex-wrap:wrap;gap:3px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:0 7px 0 5px;font-size:11.5px;line-height:18px;color:#8b879a;background:#fff;transition:all .6s}
.pill i{width:6px;height:6px;border-radius:50%;background:#dcd8e4}
.pill b{font-weight:400;font-size:10.5px;opacity:.75}
.pill.working{color:var(--accent-ink);border-color:#c9d0f3;background:var(--accent-soft)}
.pill.working i{background:var(--accent);animation:blink 1.1s infinite}
.pill.done{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.pill.done i{background:#5cc995}
.pill.failed{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.pill.failed i{background:var(--bad)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kpi{border:1px solid #f0eef5;border-radius:10px;padding:5px 7px;transition:background .8s,border-color .8s}
.kpi .v{font-size:17px;font-weight:500}
.kpi .l{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.bump{animation:bump 1s}@keyframes bump{30%{border-color:#c9d0f3;background:var(--accent-soft)}}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px;padding:4px 0;border-top:1px solid #f3f1f6}
.feed li.new{animation:slideIn .5s ease-out}
.feed li:first-child{border-top:0}
.feed time{color:var(--muted)}
.feed li.done span::before{content:"✓ ";color:var(--ok)}
.feed li.g span{color:var(--ok)}
.feed li.bad span{color:var(--bad)}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.star{animation:tw 4s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.an circle.body{transition:fill .8s,stroke .8s}
.an text{fill:#8f8aa3;font-size:12.5px;transition:fill .8s}
.an text .l2{font-size:10.5px;opacity:.85}
.an.done text,.an.working text,.an.failed text{fill:#3a3946}
.an .orbit{transform-box:fill-box;transform-origin:center;opacity:0}
.an.working .orbit{opacity:1;animation:spin 3.4s linear infinite}
.edge{stroke:#efecf5;stroke-width:1.3;fill:none;transition:stroke 1s}
.edge.lit{stroke:#cfc4f3}
.cluster{fill:rgba(246,243,253,.75);stroke:#ddd6f0;stroke-dasharray:2 5}
.cl-name{fill:#9d98b0;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;transition:fill .6s}
.cl-name.active{fill:#7a63d6}
.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#fff;border:1px solid var(--ok-line);
  border-radius:999px;padding:4px 12px;white-space:nowrap;animation:toast 3.4s forwards;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast b{color:var(--ok);font-weight:500}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.empty{display:grid;place-items:center;height:100vh;color:var(--muted)}

/* your input: choices and questions answered in the tracker */
.inbox{background:#fff;border:1px solid var(--warn-line);border-radius:14px;padding:9px 11px;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:auto;scrollbar-width:none}
.inbox::-webkit-scrollbar{display:none}
.inbox>h2{margin:0;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);display:flex;justify-content:space-between;align-items:center}
.inbox>h2 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:0 7px}
.ask{border:1px solid #f3ead8;border-radius:12px;padding:8px 10px;background:#fffdf8}
.ask.sent{border-color:var(--ok-line);background:var(--ok-soft)}
.ask h3{margin:0;font-size:13px;font-weight:500;display:flex;gap:6px;align-items:baseline}
.ask h3 small{color:var(--muted);font-weight:400}
.ask p{margin:3px 0 0;color:#5d5a6b}
.links{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.links a{display:inline-flex;align-items:center;gap:4px;border:1px solid #c9d0f3;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 9px;font-size:12px;text-decoration:none}
.links a::after{content:"↗";font-size:11px}
.links a:focus-visible,.opt:focus-visible,.btn:focus-visible,.qa textarea:focus-visible,.other:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:7px}
.opt{text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt:focus{outline:none}
.opt b{font-weight:500}
.opt span{color:var(--muted);font-size:12px}
.opt .rec{align-self:flex-start;font-size:10.5px;color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok-line);border-radius:999px;padding:0 6px}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.qa{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:3px 8px;align-items:start;padding:5px 0;border-top:1px solid #f3eee4}
.qa:first-child{border-top:0}
.qa .qid{font-weight:500;color:var(--warn)}
.qa .rec{color:var(--ok);font-size:12px}
.qa .rec::before{content:"Recommended: ";color:var(--muted)}
.qa .pick{display:flex;gap:3px}
.qa textarea,.other{grid-column:2/4;font:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 7px;resize:vertical;min-height:30px;width:100%}
.other{margin-top:6px}
.seg{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 8px;cursor:pointer;color:#5d5a6b}
.seg:focus{outline:none}
.seg[aria-pressed=true]{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok)}
.seg.chg[aria-pressed=true]{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.send{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.btn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:2px 14px;cursor:pointer}
.btn:focus{outline:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--accent-ink);border-color:#c9d0f3}
.hint{color:var(--muted);font-size:12px}
.done-msg{color:var(--ok)}

@media (max-width:1000px){
  .app{height:auto}
  .grid{grid-template-columns:1fr;grid-template-rows:none}
  #visP,#workPanel,#inbox,#colR{grid-column:auto!important;grid-row:auto!important}
  .vis{height:420px}
  .pipe{grid-template-columns:repeat(4,minmax(0,1fr))}
  .col{grid-template-rows:none}
  .scroll{max-height:320px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="empty" id="empty">Waiting for tracker-data.js…</div>
<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand"><b id="name"></b><span class="live" id="live"><i></i><span id="liveText">Live</span></span></div>
    <div class="stage" id="stageText"></div>
    <div class="prog"><span class="num" id="progText"></span><div class="pbar"><i id="pbar"></i></div><span class="num" id="runTime"></span></div>
    <div class="gates" id="gates"></div>
    <span class="sp"></span>
    <span class="upd num" id="upd"></span>
  </header>

  <nav class="pipe" id="pipe" aria-label="Stages"></nav>

  <main class="grid" id="grid">
    <div class="panel vis" id="visP" aria-label="Every agent, grouped by team">
      <h2><span>Every agent, grouped by team</span><em id="visNote"></em></h2>
      <svg id="cSvg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Agents by team; working agents spin"></svg>
    </div>
    <div class="panel" id="workPanel"><h2>Working now <em class="num" id="nWork"></em></h2><div class="scroll" id="now"></div></div>
    <section class="inbox" id="inbox" aria-label="Your input" hidden></section>

    <section class="col" id="colR">
      <div class="panel note" id="noteBox" hidden></div>
      <div class="panel"><h2>Output so far</h2><div class="kpis" id="kpis"></div></div>
      <div class="panel"><h2>Activity</h2><ul class="feed scroll" id="feed"></ul></div>
    </section>
  </main>
</div>

<script>
const HUES = {lead:220, product:262, design:320, architecture:190, engineering:150, domain:205, quality:38, audit:0, operations:95};
const GATE_SHORT = {G0:"Plan", G1:"Owner answers", GP:"Prototype", G2:"Scope", G3:"Design", G4:"Go-live"};
const KPI = [["docs","Documents"],["questions","Questions"],["criteria","Criteria"],["stories","Stories"],
  ["points","Points"],["ops","API operations"],["decisions","Decisions"],["adrs","ADRs"]];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svgEl = (tag, attrs = {}) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const ms = iso => iso ? new Date(iso).getTime() : 0;
const hhmm = iso => iso ? iso.slice(11, 16) : "";
const dur = s => { s = Math.max(0, Math.floor(s)); return s < 60 ? s + "s" : s < 3600 ? Math.floor(s/60) + "m " + String(s%60).padStart(2,"0") + "s" : Math.floor(s/3600) + "h " + String(Math.floor(s/60)%60).padStart(2,"0") + "m"; };
const ago = t => { const s = (Date.now() - t) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.floor(s/60) + " min ago" : Math.floor(s/3600) + " h ago"; };
const initials = a => a.split("-").map(w => w[0].toUpperCase()).join("").slice(0, 2);

let D = null, prev = null, AGENTS = {}, latest = {}, typers = {}, seenLog = new Set();
const hueOf = a => HUES[AGENTS[a]] ?? 260;
const teamName = id => (D.teams.find(t => t.id === id) || {name:"Other"}).name;
const working = () => Object.keys(latest).filter(a => latest[a].status === "working");

/* data arrives through tracker-data.js, which calls this */
window.__TRACKER__ = data => {
  prev = D; D = data;
  AGENTS = {}; D.teams.forEach(t => t.agents.forEach(a => AGENTS[a] = t.id));
  latest = {}; D.runs.forEach(r => { if (!latest[r.agent]) latest[r.agent] = r; });   /* runs are newest first */
  $("empty").hidden = true; $("app").hidden = false;
  render();
};
function poll(){
  if (window.PROTO) return;
  const s = document.createElement("script");
  s.src = "tracker-data.js?t=" + Date.now();
  s.onload = s.onerror = () => s.remove();
  document.head.append(s);
}

function render(){
  const first = !prev;
  document.title = D.name + " - factory tracker";
  $("name").textContent = D.name;
  const order = D.stages.map(s => s.id), cur = Math.max(0, order.indexOf(D.stage));
  const curName = (D.stages[cur] || {}).name || "";
  $("stageText").innerHTML = `<b>${esc(D.stage)} ${esc(curName)}</b>${D.stageNote ? " · " + esc(D.stageNote) : ""}`;

  /* stage strip */
  const runningIn = new Set(working().map(a => latest[a].stage).filter(Boolean));
  const gateAfter = {}; D.gateDefs.forEach(g => gateAfter[g.after] = g.id);
  let done = 0;
  $("pipe").innerHTML = D.stages.map((s, i) => {
    const docs = D.stageDocs[s.id] || 0, gate = gateAfter[s.id], gateOk = gate && (D.gates[gate] || {}).state === "approved";
    let cls, txt;
    if (s.id === D.stage || runningIn.has(s.id)) { cls = "cur"; txt = "in progress" + (docs ? " · " + docs + " docs" : ""); }
    else if (docs || gateOk) { cls = "done"; txt = "done · " + (docs ? docs + " docs" : "-"); }
    else if (i < cur) { cls = "skip"; txt = "not run"; }
    else { cls = ""; txt = "waiting"; }
    if (cls === "done" || cls === "skip") done++;
    return `<div class="pst ${cls}" title="${esc(s.id + " " + s.name)}"><b>${esc(s.id)} ${esc(s.name)}</b><span>${txt}</span></div>`;
  }).join("");
  $("progText").textContent = done + "/" + D.stages.length + " stages";
  $("pbar").style.width = Math.round(done / D.stages.length * 100) + "%";

  /* gates */
  const nextGate = D.gateDefs.find(g => (D.gates[g.id] || {}).state !== "approved");
  $("gates").innerHTML = D.gateDefs.map(g => {
    const st = (D.gates[g.id] || {}).state || "open", was = prev && ((prev.gates[g.id] || {}).state);
    const cls = st === "approved" ? "approved" : (st === "waiting" || g === nextGate) ? "next" : "";
    const words = (D.gates[g.id] || {}).words;
    return `<span class="gate ${cls} ${prev && was !== st && st === "approved" ? "pop" : ""}" title="${esc(g.name + (words ? ': "' + words + '"' : ""))}">${esc(g.id)} ${esc(GATE_SHORT[g.id] || g.name)}</span>`;
  }).join("");

  /* note: waiting on the user, else the next gate */
  const nb = $("noteBox");
  if (D.waiting) { nb.className = "panel note wait"; nb.innerHTML = `<b>Waiting on you:</b> ${esc(D.waiting)}`; nb.hidden = false; }
  else if (nextGate) { nb.className = "panel note"; nb.innerHTML = `<b>Next for you:</b> gate ${esc(nextGate.id)} ${esc(nextGate.name)}, after ${esc(nextGate.after)}.`; nb.hidden = false; }
  else nb.hidden = true;

  renderInbox(); renderNow(first); renderKpis(); renderFeed(first); renderC(first);
  const w = working().length;
  $("visNote").textContent = w ? w + " working in parallel" : "idle";
  $("live").classList.toggle("idle", !w);
  $("liveText").textContent = w ? "Live" : "Idle";
  tick();
}

function thoughtOf(a){
  const r = latest[a], act = (D.activity || {})[a];
  return act && ms(act.at) >= ms(r.startedAt) ? act.text : (r.task ? "Working on: " + r.task : "Working…");
}
function renderNow(first){
  const w = working().sort((a, b) => ms(latest[a].startedAt) - ms(latest[b].startedAt));
  const before = new Set(prev ? Object.keys(prev._working || {}) : []);
  D._working = Object.fromEntries(w.map(a => [a, 1]));
  $("nWork").textContent = w.length;
  $("now").innerHTML = w.length ? w.map(a => { const h = hueOf(a), r = latest[a];
    return `<div class="wk ${!first && !before.has(a) ? "new" : ""}"><div class="ava"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="13.5" fill="none" stroke="hsl(${h} 60% 70%)" stroke-width="2" stroke-dasharray="20 65" stroke-linecap="round"/></svg>
      <div class="core" style="background:hsl(${h} 70% 95%);color:hsl(${h} 45% 40%)">${initials(a)}</div></div>
      <div class="who">${esc(a)}<small>${esc(teamName(AGENTS[a]))}${r.task ? " · " + esc(r.task) : ""}</small></div>
      <div class="tm num" data-since="${esc(r.startedAt)}"></div>
      <div class="thought"><span class="typer" data-typer="${esc(a)}"></span></div></div>`; }).join("")
    : `<div class="idle">${D.waiting ? "Nobody is working. Waiting on you." : "Nobody is working right now."}</div>`;
  w.forEach(a => { const text = thoughtOf(a), t = typers[a];
    if (!t || t.text !== text) typers[a] = {text, c: first ? text.length : 0}; });
  Object.keys(typers).forEach(a => { if (!D._working[a]) delete typers[a]; });
}
function renderKpis(){
  const box = $("kpis");
  if (!box.children.length) box.innerHTML = KPI.map(([k, l]) => `<div class="kpi" id="k-${k}"><div class="v num">0</div><div class="l">${l}</div></div>`).join("");
  KPI.forEach(([k]) => countTo($("k-" + k).querySelector(".v"), D.outputs[k] || 0, $("k-" + k)));
}
function countTo(node, target, box){
  const from = +(node.dataset.v || 0); if (from === target) return;
  node.dataset.v = target; box.classList.remove("bump"); void box.offsetWidth; box.classList.add("bump");
  const t0 = performance.now(), d = 900, tok = (node._tok = (node._tok || 0) + 1);
  const step = () => { if (node._tok !== tok) return; const p = Math.max(0, Math.min(1, (performance.now() - t0) / d));
    node.textContent = p >= 1 ? target : Math.round(from + (target - from) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function renderFeed(first){
  $("feed").innerHTML = D.log.map(l => {
    const key = l.at + "|" + l.text, isNew = !first && !seenLog.has(key); seenLog.add(key);
    const cls = / finished/.test(l.text) ? "done" : / failed/.test(l.text) ? "bad" : /^gate \S+ approved/.test(l.text) ? "g" : "";
    const text = cls === "done" ? l.text.replace(" finished", "") : l.text;
    return `<li class="${cls} ${isNew ? "new" : ""}"><time class="num">${hhmm(l.at)}</time><span>${esc(text)}</span></li>`;
  }).join("");
}

/* constellation: every agent as a star, grouped by team, lit along the hand-offs */
const CL = {lead:[500,270], product:[190,140], design:[470,125], architecture:[760,140], domain:[915,290],
  operations:[170,370], audit:[360,425], quality:[580,395], engineering:[820,395]};
const HAND = [["team-lead","prd-reviewer"],["prd-reviewer","requirements-analyst"],["requirements-analyst","product-critic"],["requirements-analyst","ux-designer"],
  ["requirements-analyst","sf-consultant"],["product-critic","prototype-designer"],["ux-designer","prototype-designer"],["product-critic","story-sizer"],
  ["prototype-designer","story-sizer"],["story-sizer","solution-architect"],["solution-architect","api-designer"],["solution-architect","data-architect"],
  ["solution-architect","security-architect"],["solution-architect","sf-consultant"],["sf-consultant","integration-engineer"],["solution-architect","integration-engineer"],
  ["solution-architect","devops-engineer"],["api-designer","system-reviewer"],["data-architect","system-reviewer"],["security-architect","system-reviewer"],
  ["solution-architect","performance-engineer"],["performance-engineer","system-reviewer"],["system-reviewer","backend-developer"],["system-reviewer","frontend-developer"],
  ["backend-developer","qa-engineer"],["frontend-developer","qa-engineer"],["qa-engineer","code-reviewer"],["code-reviewer","audit-expert"],
  ["audit-expert","release-manager"],["release-manager","technical-writer"],["team-lead","base-builder"]];
const C = {pos:{}, up:{}, built:""};
const curve = (f, t) => { const [x1, y1] = C.pos[f], [x2, y2] = C.pos[t]; return `M${x1} ${y1} Q ${(x1+x2)/2} ${(y1+y2)/2 - 18} ${x2} ${y2}`; };
const statusOf = a => a === "team-lead" ? "working" : latest[a]?.status || "";
function buildC(){
  const svg = $("cSvg"); svg.innerHTML = ""; C.pos = {}; C.up = {};
  for (let i = 0; i < 70; i++) { const s = svgEl("circle", {cx:Math.random()*780, cy:Math.random()*470, r:Math.random()*1.1 + .3, fill:"#d6d0ec", class:"star"}); s.style.animationDelay = Math.random()*4 + "s"; svg.append(s); }
  D.teams.forEach((t, k) => { const [x, y] = CL[t.id] || [60 + k * 90, 470], n = t.agents.length, R = [0, 0, 38, 44, 50, 56][Math.min(n, 5)];
    svg.append(svgEl("circle", {cx:x, cy:y, r:R + 34, class:"cluster"}));
    const nm = svgEl("text", {x, y:y - R - 48, "text-anchor":"middle", class:"cl-name", id:"cT-" + t.id}); nm.textContent = t.name; svg.append(nm);
    t.agents.forEach((a, i) => { const ang = -Math.PI/2 + i*2*Math.PI/n + (n === 4 ? Math.PI/4 : n === 2 ? Math.PI/2 : 0);
      C.pos[a] = [x + R*Math.cos(ang), y + R*Math.sin(ang)]; C.up[a] = n > 1 && Math.sin(ang) < -0.1; }); });
  HAND.filter(([f, t]) => C.pos[f] && C.pos[t]).forEach(([f, t]) => svg.append(svgEl("path", {d:curve(f, t), class:"edge", id:`cE-${f}--${t}`})));
  Object.keys(C.pos).forEach(a => { const [x, y] = C.pos[a], h = hueOf(a), g = svgEl("g", {class:"an", id:"cA-" + a});
    g.append(svgEl("title"));
    g.append(svgEl("circle", {cx:x, cy:y, r:16, fill:"none", stroke:`hsl(${h} 55% 70%)`, "stroke-width":"1.5", "stroke-dasharray":"7 9", class:"orbit"}));
    g.append(svgEl("circle", {cx:x, cy:y, r:a === "team-lead" ? 14 : 9, fill:"#fff", stroke:`hsl(${h} 30% 86%)`, class:"body"}));
    /* two short lines ("security" / "architect") so neighbours never overlap */
    const [w1, ...rest] = a.split("-"), tx = svgEl("text", {x, y:C.up[a] ? y - (rest.length ? 27 : 16) : y + 23, "text-anchor":"middle"});
    const l1 = svgEl("tspan", {x}); l1.textContent = w1; tx.append(l1);
    if (rest.length) { const l2 = svgEl("tspan", {x, dy:"12", class:"l2"}); l2.textContent = rest.join("-"); tx.append(l2); }
    g.append(tx); svg.append(g); });
  C.built = D.teams.map(t => t.id + ":" + t.agents.join("+")).join(",");
}
function renderC(first){
  if (C.built !== D.teams.map(t => t.id + ":" + t.agents.join("+")).join(",")) buildC();
  Object.keys(C.pos).forEach(a => { const g = $("cA-" + a), h = hueOf(a), st = statusOf(a), body = g.querySelector(".body"), r = latest[a];
    g.setAttribute("class", "an " + st);
    body.setAttribute("fill", st === "working" ? `hsl(${h} 70% 82%)` : st === "done" ? `hsl(${h} 55% 90%)` : st === "failed" ? "#f4d6d3" : "#fff");
    body.setAttribute("stroke", st ? `hsl(${h} 45% 62%)` : `hsl(${h} 30% 86%)`);
    g.querySelector("title").textContent = a + ": " + (a === "team-lead" ? (D.stageNote || "running the flow") : r ? (r.result || r.task || r.status) : "not started"); });
  HAND.forEach(([f, t]) => $(`cE-${f}--${t}`)?.setAttribute("class", "edge" + ((f === "team-lead" || latest[f]) && latest[t] ? " lit" : "")));
  D.teams.forEach(t => $("cT-" + t.id).setAttribute("class", "cl-name" + (t.agents.some(a => latest[a]?.status === "working") ? " active" : "")));
  const w = working().length;
  $("visNote").textContent = w ? w + " working in parallel" : "idle";
  if (first) return;
  const was = {}; prev.runs.forEach(r => { if (!(r.agent in was)) was[r.agent] = r; });
  Object.keys(latest).forEach(a => { const r = latest[a], p = was[a];
    if (!C.pos[a] || (p && p.startedAt === r.startedAt && p.status === r.status)) return;
    if (r.status === "working") { const from = HAND.filter(([f, t]) => t === a && (f === "team-lead" || latest[f]?.status === "done")).map(([f]) => f);
      (from.length ? from : ["team-lead"]).forEach(f => comet(f, a)); }
    else if (r.status === "done") { comet(a, "team-lead", "#6fcf9f");
      const toast = document.createElement("div"); toast.className = "toast"; toast.innerHTML = `<b>✓ ${esc(a)}</b> `; toast.append(r.result || "finished");
      document.querySelector(".vis").append(toast); setTimeout(() => toast.remove(), 3500); }
  });
}
function comet(f, t, color){
  if (!C.pos[f] || !C.pos[t]) return;
  const g = svgEl("g"); [5, 3.5, 2.2].forEach((r, i) => { const c = svgEl("circle", {r, fill:color || `hsl(${hueOf(t)} 65% 66%)`, opacity:String(1 - i*.3)});
    c.append(svgEl("animateMotion", {dur:"1.3s", begin:(i*.06) + "s", fill:"freeze", path:curve(f, t)})); g.append(c); });
  $("cSvg").append(g); g.querySelectorAll("animateMotion").forEach(m => m.beginElement?.()); setTimeout(() => g.remove(), 1500);
}

/* ---------- your input: the lead asks, you answer here, the answer is saved to answers/<id>.json ---------- */
let draft = {}, sentAt = {};
/* when you have something to answer, it takes the middle column and the constellation moves left */
function placeInbox(){
  $("grid").classList.toggle("asking", (D.inputs || []).some(i => i.status === "open" || sentAt[i.id]));
}
function renderInbox(){
  const items = (D.inputs || []).filter(i => i.status === "open" || sentAt[i.id]);
  const ib = $("inbox"); ib.hidden = !items.length;
  if (items.length) $("noteBox").hidden = true;
  placeInbox();
  if (!items.length) { ib.innerHTML = ""; return; }
  if (ib.contains(document.activeElement) && ib.dataset.key === items.map(i => i.id + i.status).join()) return;  /* keep focus and typing */
  ib.dataset.key = items.map(i => i.id + i.status).join();
  ib.innerHTML = `<h2><span>Your input</span><em>${items.filter(i => i.status === "open").length} waiting</em></h2>` + items.map(askHtml).join("");
}
function askHtml(i){
  const d = draft[i.id] = draft[i.id] || {choice:"", text:"", items:{}};
  const links = (i.links || []).length ? `<div class="links">${i.links.map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("")}</div>` : "";
  const head = `<h3>${esc(i.title)}${i.gate ? ` <small>gate ${esc(i.gate)}</small>` : ""}</h3>${i.detail ? `<p>${esc(i.detail)}</p>` : ""}`;
  if (i.status !== "open" || sentAt[i.id] === "saved") {
    return `<div class="ask sent">${head}<p class="done-msg">✓ ${i.status === "open" ? "Sent. Saved in your Downloads; the team lead picks it up in a few seconds." : "Answered " + hhmm(i.answeredAt) + ". The team carries on."}</p></div>`;
  }
  let body = "";
  if (i.kind === "choice" || i.kind === "confirm") {
    const opts = i.kind === "confirm" && !(i.options || []).length ? [{id:"yes", label:"Yes, go ahead", recommended:true}, {id:"no", label:"No, stop"}] : i.options;
    body = `<div class="opts">${opts.map(o => `<button class="opt" data-ask="${esc(i.id)}" data-opt="${esc(o.id)}" aria-pressed="${d.choice === o.id}">
      ${o.recommended ? `<span class="rec">Recommended</span>` : ""}<b>${esc(o.id === o.label ? o.label : o.id + " · " + o.label)}</b>${o.detail ? `<span>${esc(o.detail)}</span>` : ""}</button>`).join("")}</div>
      <textarea class="other" data-ask="${esc(i.id)}" data-text="1" rows="1" placeholder="Anything to add or change? (optional)">${esc(d.text)}</textarea>`;
  } else {
    body = `<div class="qs">${(i.items || []).map(q => { const v = d.items[q.id] ?? "accept";
      return `<div class="qa"><span class="qid">${esc(q.id)}</span><div>${esc(q.q)}<div class="rec">${esc(q.rec)}</div></div>
        <div class="pick"><button class="seg" data-ask="${esc(i.id)}" data-q="${esc(q.id)}" data-v="accept" aria-pressed="${v === "accept"}">Accept</button>
        <button class="seg chg" data-ask="${esc(i.id)}" data-q="${esc(q.id)}" data-v="change" aria-pressed="${v !== "accept"}">Change</button></div>
        ${v !== "accept" ? `<textarea data-ask="${esc(i.id)}" data-qtext="${esc(q.id)}" rows="1" placeholder="Your answer">${esc(v === "change" ? "" : v)}</textarea>` : ""}</div>`; }).join("")}</div>`;
  }
  const ready = i.kind === "questions" || d.choice;
  return `<div class="ask">${head}${links}${body}<div class="send"><button class="btn" data-send="${esc(i.id)}" ${ready ? "" : "disabled"}>Send answer</button>
    <span class="hint">${i.kind === "questions" ? (i.items || []).length + " questions, recommended answers accepted unless you change them" : ready ? "" : "Pick one"}</span></div></div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ask],[data-send]"); if (!b || b.tagName === "TEXTAREA") return;
  const id = b.dataset.ask || b.dataset.send, d = draft[id];
  if (b.dataset.opt) { d.choice = b.dataset.opt; rerenderAsk(); }
  else if (b.dataset.q) { d.items[b.dataset.q] = b.dataset.v === "accept" ? "accept" : "change"; rerenderAsk(); }
  else if (b.dataset.send) sendAnswer(id);
});
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset.ask && draft[t.dataset.ask]; if (!d) return;
  if (t.dataset.text) d.text = t.value; else if (t.dataset.qtext) d.items[t.dataset.qtext] = t.value || "change";
});
function rerenderAsk(){ $("inbox").dataset.key = ""; const f = document.activeElement; renderInbox(); f && f.dataset && f.dataset.opt && document.querySelector(`[data-opt="${f.dataset.opt}"][data-ask="${f.dataset.ask}"]`)?.focus(); }

async function sendAnswer(id){
  const i = D.inputs.find(x => x.id === id), d = draft[id];
  const ans = {id, at: new Date().toISOString(), by: "user (tracker)"};
  if (i.kind === "questions") { ans.items = {}; (i.items || []).forEach(q => { const v = d.items[q.id] ?? "accept"; ans.items[q.id] = v === "accept" ? "accept: " + q.rec : v; }); }
  else { ans.choice = d.choice; if (d.text) ans.text = d.text; }
  try { await saveFile(id, ans); sentAt[id] = "saved"; }
  catch (err) { copyFallback(ans, err); return; }
  $("inbox").dataset.key = ""; renderInbox();
}
/* one click: the answer is saved as a download (factory-answer-<slug>-<id>.json in Downloads);
   tracker.py moves it into work/<slug>/answers/ and the team lead carries on */
async function saveFile(id, ans){
  if (window.PROTO) throw new Error("Prototype: nothing is saved.");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(ans, null, 2)], {type:"application/json"}));
  a.download = "factory-answer-" + D.slug + "-" + id + ".json";
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function copyFallback(ans, err){
  const text = "Answer for " + ans.id + ": " + (ans.choice || "") + (ans.text ? " - " + ans.text : "") +
    (ans.items ? "\n" + Object.entries(ans.items).map(([k, v]) => k + " " + v).join("\n") : "");
  navigator.clipboard?.writeText(text).catch(() => {});
  const hint = document.querySelector(`[data-send="${ans.id}"]`)?.nextElementSibling;
  if (hint) hint.textContent = (err && err.message ? err.message + " " : "") + "Copied the answer: paste it in the chat.";
}

function tick(){
  if (!D) return;
  document.querySelectorAll("[data-since]").forEach(e => e.textContent = dur((Date.now() - ms(e.dataset.since)) / 1000));
  $("runTime").textContent = "started " + hhmm(D.created) + " · " + dur((Date.now() - ms(D.created)) / 1000);
  $("upd").textContent = "updated " + ago(ms(D.updated));
}
function type(){
  for (const a in typers){ const t = typers[a]; if (t.c < t.text.length) t.c++;
    document.querySelectorAll(`[data-typer="${a}"]`).forEach(e => e.textContent = t.text.slice(0, t.c)); }
}
setInterval(tick, 1000);
setInterval(type, 30);
setInterval(poll, 3000);
poll();
</script>
