<style>
/* Base palette: the SkillsOS review tracker tokens (soft Bento). Light first, dark redefines them. */
:root{
  --bg:#f6f6fa;--surface:#ffffff;--surface-2:#f3f2f8;--surface-3:#ebe9f3;--ink:#1f1d30;--muted:#615e76;--line:#e6e4ee;--line-2:#d8d5e3;--focus:#7d68d0;
  --rose:#fcecf0;--rose-ink:#9b3553;--peach:#fdf0e6;--peach-ink:#8f4a1f;--lemon:#fbf5df;--lemon-ink:#6b5414;
  --sky:#eaf3fb;--sky-ink:#235b84;--mint:#e6f5ee;--mint-ink:#226a4b;--lilac:#f0ecfb;--lilac-ink:#5a46a6;
  --grad:linear-gradient(130deg,#fbe4d8 0%,#f8dde7 50%,#e7e0f8 100%);--on-grad:#2b2440;--grad-chip:rgba(255,255,255,.62);
  --grad-strong:linear-gradient(130deg,#efa98b 0%,#e48aa6 52%,#a493dd 100%);
  --a1:#8d7ad3;--a2:#7581d6;--a3:#6c9bd6;--a4:#5eaea3;--a5:#de9a6f;--a6:#d3b25d;--a7:#d98cae;--a8:#6eb78b;--a9:#63aed3;--a10:#a2aab8;
  --crit:#cf6079;--high:#d88a58;--med:#cdaa4c;--low:#6aa1c9;
  --code-bg:#24223a;--code-ink:#e8e5f6;--code-dim:#8f8bad;
  --f-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-display:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"Cascadia Code","Cascadia Mono",Consolas,ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13131f;--surface:#1b1b2a;--surface-2:#232335;--surface-3:#2b2b40;--ink:#ebeaf4;--muted:#a6a3bb;--line:#2c2b40;--line-2:#3a3952;--focus:#b3a5ee;
  --rose:#2e1c25;--rose-ink:#f0aabd;--peach:#2e231b;--peach-ink:#efb995;--lemon:#2b2718;--lemon-ink:#e3cd84;
  --sky:#192634;--sky-ink:#a3cbea;--mint:#172a21;--mint-ink:#98d8b6;--lilac:#231f3b;--lilac-ink:#c6baf0;
  --grad:linear-gradient(130deg,#3a2c29 0%,#382634 50%,#2a2746 100%);--on-grad:#f2eef9;--grad-chip:rgba(255,255,255,.09);
  --a1:#a495e3;--a2:#8f99e3;--a3:#86b0e3;--a4:#76c2b7;--a5:#e8ad86;--a6:#dcc275;--a7:#e3a2c0;--a8:#86c9a0;--a9:#7fc0e0;--a10:#b2b9c6;
  --crit:#e47d95;--high:#e6a173;--med:#dcbf66;--low:#86b8dc;
  --code-bg:#0f0e19;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13131f;--surface:#1b1b2a;--surface-2:#232335;--surface-3:#2b2b40;--ink:#ebeaf4;--muted:#a6a3bb;--line:#2c2b40;--line-2:#3a3952;--focus:#b3a5ee;
  --rose:#2e1c25;--rose-ink:#f0aabd;--peach:#2e231b;--peach-ink:#efb995;--lemon:#2b2718;--lemon-ink:#e3cd84;
  --sky:#192634;--sky-ink:#a3cbea;--mint:#172a21;--mint-ink:#98d8b6;--lilac:#231f3b;--lilac-ink:#c6baf0;
  --grad:linear-gradient(130deg,#3a2c29 0%,#382634 50%,#2a2746 100%);--on-grad:#f2eef9;--grad-chip:rgba(255,255,255,.09);
  --a1:#a495e3;--a2:#8f99e3;--a3:#86b0e3;--a4:#76c2b7;--a5:#e8ad86;--a6:#dcc275;--a7:#e3a2c0;--a8:#86c9a0;--a9:#7fc0e0;--a10:#b2b9c6;
  --crit:#e47d95;--high:#e6a173;--med:#dcbf66;--low:#86b8dc;
  --code-bg:#0f0e19;color-scheme:dark}

/* One tint family per stage, used the same way everywhere (ticks, pills, tiles, why box, board). */
.k-triage,.k-base{--k:var(--a9);--kb:color-mix(in srgb,var(--a9) 15%,var(--surface));--ki:color-mix(in srgb,var(--a9) 45%,var(--ink))}
.k-plan,.k-intake{--k:var(--a2);--kb:color-mix(in srgb,var(--a2) 14%,var(--surface));--ki:color-mix(in srgb,var(--a2) 50%,var(--ink))}
.k-spec,.k-requirements{--k:var(--a1);--kb:var(--lilac);--ki:var(--lilac-ink)}
.k-design,.k-prototype{--k:var(--a5);--kb:var(--peach);--ki:var(--peach-ink)}
.k-build,.k-do{--k:var(--a3);--kb:var(--sky);--ki:var(--sky-ink)}
.k-review{--k:var(--a6);--kb:var(--lemon);--ki:var(--lemon-ink)}
.k-test,.k-check{--k:var(--a8);--kb:var(--mint);--ki:var(--mint-ink)}
.k-verify,.k-audit{--k:var(--a4);--kb:color-mix(in srgb,var(--a4) 14%,var(--surface));--ki:color-mix(in srgb,var(--a4) 45%,var(--ink))}
.k-wrap,.k-release{--k:var(--a10);--kb:color-mix(in srgb,var(--a10) 18%,var(--surface));--ki:color-mix(in srgb,var(--a10) 35%,var(--ink))}
.k-fail{--k:var(--crit);--kb:var(--rose);--ki:var(--rose-ink)}
.k-ok{--k:var(--a8);--kb:var(--mint);--ki:var(--mint-ink)}
.r-low{--k:var(--low)}.r-medium{--k:var(--med)}.r-high{--k:var(--high)}
.r-low,.r-medium,.r-high{--kb:color-mix(in srgb,var(--k) 16%,var(--surface));--ki:color-mix(in srgb,var(--k) 42%,var(--ink))}
/* One accent per team, for the agent avatars and team marks. */
.t-Lead{--ac:var(--a9)}.t-Helpers{--ac:var(--a2)}.t-Product{--ac:var(--a1)}.t-Design{--ac:var(--a5)}.t-Architecture{--ac:var(--a7)}
.t-Engineering{--ac:var(--a3)}.t-Quality{--ac:var(--a6)}.t-Operations{--ac:var(--a4)}.t-Audit{--ac:var(--a10)}.t-Domain-experts{--ac:var(--a8)}.t-all{--ac:var(--a10)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--f-ui)}
button,input,select{font:inherit;color:inherit}
b,strong,th{font-weight:500}
h1,h2,h3,h4{margin:0;font-weight:500}
h1{font:500 17px/1.3 var(--f-display)}
h2{font:500 15px/1.35 var(--f-display)}
h3{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;gap:6px;align-items:center}
h4{font-size:12px;font-weight:500;color:var(--muted);margin:14px 0 6px;display:flex;gap:6px;align-items:center}
p{margin:0 0 8px}
ul{margin:4px 0 8px;padding-left:18px}
q{quotes:"\201C" "\201D"}
code{font:12px/1.45 var(--f-mono);background:var(--surface-2);border-radius:6px;padding:0 5px;overflow-wrap:anywhere}
pre{font:12px/1.6 var(--f-mono);background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:8px 12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.sub{color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ic.fill{fill:currentColor;stroke:none}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:4px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--lilac);color:var(--lilac-ink);border-color:color-mix(in srgb,var(--a1) 40%,var(--surface))}
.btn.pri:hover:not(:disabled){background:color-mix(in srgb,var(--a1) 22%,var(--surface))}
.btn.go{background:var(--mint);color:var(--mint-ink);border-color:color-mix(in srgb,var(--a8) 45%,var(--surface))}
.btn.go:hover:not(:disabled){background:color-mix(in srgb,var(--a8) 24%,var(--surface))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.btn.sm{min-height:26px;padding:2px 9px;font-size:12px}
.btn.icon{padding:4px 7px}
.seg{display:inline-flex;flex-wrap:wrap;align-items:center;gap:2px;padding:2px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:2px 10px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);border-color:var(--line-2);color:var(--ink)}
.seg.sm button{min-height:24px;padding:1px 8px;font-size:12px}
.cnt{font-size:11px;line-height:16px;padding:0 6px;border-radius:999px;background:var(--surface-3);color:var(--muted)}
.mark{width:8px;height:8px;border-radius:50%;background:var(--focus);display:inline-block;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:18px;padding:0 9px;border-radius:999px;white-space:nowrap;background:var(--kb);color:var(--ki);border:1px solid color-mix(in srgb,var(--k) 35%,var(--surface))}
.pn{display:inline-flex;align-items:center;font-size:11px;line-height:18px;padding:0 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.m{font-size:10.5px;line-height:16px;padding:0 6px;border-radius:999px;background:var(--surface-3);color:var(--muted);font-style:normal;white-space:nowrap}

/* avatars: coloured initials by team */
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;flex:none;font-size:10px;font-weight:500;letter-spacing:.02em;
  background:color-mix(in srgb,var(--ac,var(--a10)) 20%,var(--surface));color:color-mix(in srgb,var(--ac,var(--a10)) 45%,var(--ink));border:1px solid color-mix(in srgb,var(--ac,var(--a10)) 45%,var(--surface))}
.av.s{width:22px;height:22px;font-size:9.5px}
.av.l{width:44px;height:44px;font-size:15px}
.av.t-You{background:var(--grad);color:var(--on-grad);border-color:color-mix(in srgb,var(--a7) 40%,var(--surface))}
.av.fin{background:var(--mint);color:var(--mint-ink);border-color:color-mix(in srgb,var(--a8) 45%,var(--surface))}
.av.fin .ic{width:12px;height:12px}
.av.hl{outline:2px solid var(--focus);outline-offset:1px}
.app{max-width:1440px;margin:0 auto;padding:16px;container:app/inline-size}

/* page header */
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--grad);color:var(--on-grad);flex:none}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.follow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:5px 10px;border-radius:12px;background:color-mix(in srgb,var(--focus) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--focus) 30%,var(--surface))}
.follow .btn{margin-left:auto}

/* step body */
.files{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.fc{display:inline-flex;align-items:center;gap:4px;font:11px/1.6 var(--f-mono);padding:1px 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);overflow-wrap:anywhere}
.fc .ic{width:12px;height:12px}
.agrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.agc{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 2px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px}
.imp{display:grid;gap:4px;margin:8px 0}
.ir{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:0 10px;padding:6px 10px;border-radius:10px;background:var(--surface-2)}
.ir .kind{font-size:11px;color:var(--muted)}
.ir code{grid-column:2/-1;background:transparent;padding:0;color:var(--muted)}
.team{display:grid}
.tr{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:4px 10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.tr .tn{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
details.out{margin-top:8px}
details.out summary{cursor:pointer;color:var(--muted);font-size:12px;padding:2px 0}
details.out .tr{grid-template-columns:auto auto minmax(0,1fr)}
.note-box,.okbox,.failbox,.donebox{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:8px 12px;margin:8px 0}
.note-box{background:var(--surface-2);color:var(--muted)}
.okbox{background:var(--mint);color:var(--mint-ink);border:1px solid color-mix(in srgb,var(--a8) 35%,var(--surface))}
.failbox{background:var(--rose);color:var(--rose-ink);border:1px solid color-mix(in srgb,var(--crit) 45%,var(--surface))}
.loopnote{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:1px 10px;margin:0 0 8px;background:var(--rose);color:var(--rose-ink);font-size:12px}
.donebox{background:var(--mint);color:var(--mint-ink);border:1px solid color-mix(in srgb,var(--a8) 35%,var(--surface));padding:12px 14px}
.donebox .dt{font:500 15px/1.4 var(--f-display)}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.gate{background:var(--grad);color:var(--on-grad);border-radius:14px;padding:12px 14px;margin:2px 0 8px;border:1px solid color-mix(in srgb,var(--a7) 30%,var(--surface))}
.gate .gh{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.gate .gq{font:500 17px/1.35 var(--f-display);margin:4px 0 8px}
.gate .gs{display:flex;gap:6px;align-items:center;font-size:12px}
.gate .fc{background:var(--grad-chip);border-color:transparent;color:var(--on-grad)}
.gate .qa{background:var(--grad-chip);border-radius:10px;padding:8px 10px;margin:8px 0}
.gact{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gate .btn:not(.go){background:var(--grad-chip);color:var(--on-grad);border-color:transparent}
.decided{display:inline-flex;gap:6px;align-items:center;margin-top:8px;padding:2px 10px;border-radius:999px;background:var(--grad-chip)}
.mins{display:flex;align-items:center;gap:6px;margin-top:6px}
.mins .ic{width:14px;height:14px}
.sh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px}
.sh .n{margin-left:auto}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.ctrls .sp{flex:1}
.ticks{display:flex;gap:2px;align-items:center}
.tk{flex:1 1 0;min-width:4px;height:8px;border:0;padding:0;border-radius:999px;background:color-mix(in srgb,var(--k) 24%,var(--surface));cursor:pointer}
.tk.done{background:var(--k)}
.tk.cur{background:var(--k);height:14px}
.tk.g.done,.tk.g.cur{background:var(--grad-strong)}
.tk:disabled{cursor:default}
.why{background:var(--kb);border-color:color-mix(in srgb,var(--k) 35%,var(--surface))}
.why h3{color:var(--ki)}
.why p{font-size:14px;line-height:1.55;margin:0;color:var(--ink)}
.wrow{display:flex;gap:8px;align-items:center;padding:3px 0}
.wif .tg{display:flex;gap:8px;align-items:flex-start;padding:3px 0;cursor:pointer}
.wif .tg input{margin:3px 0 0;accent-color:var(--focus)}
.wif .tg.off{color:var(--muted);cursor:default}
.clock .ct{margin-bottom:6px}
.crow{display:grid;grid-template-columns:104px minmax(0,1fr) 78px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.cbar{position:relative;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.cbar i{position:absolute;inset:0 auto 0 0;border-radius:999px}
.cbar .ce{background:var(--kb);border:1px solid color-mix(in srgb,var(--k) 45%,var(--surface))}
.cbar .cd{background:var(--k)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--k,var(--ac));display:inline-block}
.legend .lg-you i{background:var(--grad-strong)}

/* live tracker placeholder */
.live{margin-top:12px}
.lh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.lh h3{margin:0}
.lv-frame{border:1.5px dashed var(--line-2);border-radius:12px;min-height:220px;display:grid;place-items:center;padding:16px;background:var(--surface-2)}
.lv-ph{display:flex;gap:10px;max-width:560px;align-items:flex-start}
.lv-load{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;min-height:220px;align-content:start}
.sk{height:12px;border-radius:6px;background:var(--surface-3);animation:pulse 1.4s ease-in-out infinite}
.sk:nth-child(2){width:72%}.sk:nth-child(3){width:90%}.sk:nth-child(4){width:56%}.sk:nth-child(5){width:80%}.sk:nth-child(6){width:40%}
.lv-off{display:flex;gap:10px;padding:14px;border-radius:12px;background:var(--peach);color:var(--peach-ink);border:1px solid color-mix(in srgb,var(--a5) 40%,var(--surface))}
.lv-off .btn{margin-top:8px}
@keyframes pulse{50%{opacity:.45}}
@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Studio: requests, board, transport, inspector ---------- */
.C .cgrid{display:grid;grid-template-columns:220px minmax(0,1fr) 320px;gap:12px;margin-top:14px;align-items:start}
.C .reqs{display:flex;flex-direction:column;gap:10px;min-width:0}
.rq{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:inherit;margin-bottom:6px;position:relative}
.rq:hover{border-color:var(--line-2)}
.rq[aria-pressed="true"]{background:color-mix(in srgb,var(--focus) 9%,var(--surface));border-color:color-mix(in srgb,var(--focus) 45%,var(--surface))}
.rq .rt{font-weight:500;padding-right:14px}
.rq .ra{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rq .rp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.rq .mark{position:absolute;top:12px;right:10px}
.C .mid{display:flex;flex-direction:column;gap:12px;min-width:0}
.C .board{padding:0;overflow:hidden}
.C .bscroll{overflow-x:auto;position:relative}
.C .bgridC{display:grid;grid-template-columns:128px repeat(9,minmax(64px,1fr));min-width:704px}
.C .corner,.C .bh{padding:8px;font-size:12px;border-bottom:1px solid var(--line)}
.C .corner{color:var(--muted);position:sticky;left:0;background:var(--surface);z-index:2}
.C .bh{display:flex;flex-direction:column;gap:1px;border-left:1px solid var(--line)}
.C .bh .bn{font-weight:500;color:var(--ki)}
.C .bh .bs{font-size:11px;color:var(--muted)}
.C .bh.is-cur,.C .bh.is-fail{background:var(--kb)}
.C .bh.is-fail{--kb:var(--rose);--ki:var(--rose-ink)}
.C .bh.is-todo .bn{color:var(--muted)}
.C .bl{position:sticky;left:0;z-index:1;background:var(--surface);display:flex;gap:6px;align-items:center;padding:4px 8px;border-top:1px solid var(--line);font-size:12px;min-width:0}
.C .bl .ln{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.C .bl.hlrow{background:color-mix(in srgb,var(--focus) 9%,var(--surface))}
.C .bcell{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;min-height:36px}
.C .bcell.is-cur{background:color-mix(in srgb,var(--k) 7%,var(--surface))}
.C .bcell.is-skip,.C .bh.is-skip{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px)}
.C .tile{display:flex;align-items:center;gap:4px;width:100%;text-align:left;overflow-wrap:anywhere;font-size:11px;line-height:1.3;padding:3px 6px;border-radius:6px;border:1px solid color-mix(in srgb,var(--k) 40%,var(--surface));background:var(--surface);color:var(--ki);cursor:pointer}
.C .tile .ic{width:11px;height:11px}
.C .tile.done{background:var(--kb)}
.C .tile.cur{background:var(--kb);border:1.5px solid var(--k);outline:3px solid color-mix(in srgb,var(--k) 24%,transparent);animation:pop .15s ease-out}
/* the step being worked on: a breathing dot, a sheen running across and a pulsing ring (a gate waits instead) */
.C .tile.cur:not(.g){background:linear-gradient(100deg,var(--kb) 30%,color-mix(in srgb,var(--k) 22%,var(--kb)) 50%,var(--kb) 70%) 0 0/250% 100%;
  animation:pop .15s ease-out,work 2.2s linear infinite,ring 1.6s ease-in-out infinite}
.C .tile.cur:not(.g)::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--k);flex:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes work{from{background-position:100% 0}to{background-position:-150% 0}}
@keyframes ring{50%{outline-color:color-mix(in srgb,var(--k) 8%,transparent)}}
.C .tile.todo{border-style:dashed;color:var(--muted);cursor:default}
.C .tile.g{background:var(--grad);color:var(--on-grad);border-color:transparent}
.C .tile.g.todo{background:var(--surface);color:var(--muted);border:1px dashed var(--line-2)}
.C .tpt{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.C .tpt .gc{display:inline-flex;gap:4px;align-items:center;background:var(--grad);color:var(--on-grad);border:1px solid color-mix(in srgb,var(--a7) 30%,var(--surface))}
.C .transport .tk{height:12px;border-radius:4px}
.C .transport .tk.cur{height:18px}
.C .insp{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.C .whybig{background:var(--kb);border-radius:12px;padding:10px 12px;margin-bottom:12px;border:1px solid color-mix(in srgb,var(--k) 35%,var(--surface))}
.C .whybig .wl{display:flex;gap:6px;align-items:center;color:var(--ki);font-size:12px;font-weight:500;margin-bottom:4px}
.C .whybig p{font:15px/1.5 var(--f-display);margin:0}
.C .whoC{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}

/* ---------- Agents view ---------- */
.team{padding:10px}
.tdot{width:10px;height:10px;border-radius:50%;background:var(--ac,var(--a10));flex:none;display:inline-block}
.sdots{display:inline-flex;gap:2px}
.sdots i{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}
.sdots i.on{background:var(--k)}
.dh{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.dm{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tpill{display:inline-flex;align-items:center;font-size:11px;line-height:18px;padding:0 9px;border-radius:999px;background:color-mix(in srgb,var(--ac) 16%,var(--surface));color:color-mix(in srgb,var(--ac) 45%,var(--ink));border:1px solid color-mix(in srgb,var(--ac) 40%,var(--surface))}
.does{font-size:14px;line-height:1.55}
.mini{display:flex;gap:3px;flex-wrap:wrap}
.mi{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:18px;padding:0 7px;border-radius:999px;border:1px dashed var(--line-2);color:var(--muted)}
.mi i{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}
.mi.on{border-style:solid;background:var(--kb);color:var(--ki);border-color:color-mix(in srgb,var(--k) 40%,var(--surface))}
.mi.on i{background:var(--k)}
.rq-chip{display:flex;gap:8px;align-items:center;width:100%;text-align:left;padding:6px 10px;border-radius:10px;border:1px solid color-mix(in srgb,var(--focus) 35%,var(--surface));background:color-mix(in srgb,var(--focus) 7%,var(--surface));cursor:pointer;color:inherit;margin-bottom:4px}
.rq-chip>span:nth-child(2){flex:1}
.empty{display:flex;gap:10px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line-2);color:var(--muted)}
.empty b{color:var(--ink)}
.lo{font-size:12px;color:var(--muted);margin:2px 0}
.kv{width:100%;border-collapse:collapse;margin-top:10px}
.kv th{width:104px;text-align:left;vertical-align:top;color:var(--muted);font-size:12px;padding:5px 8px 5px 0;border-bottom:1px solid var(--line)}
.kv td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.bt{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.bt th,.bt td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line)}
.bt th{color:var(--muted)}
.C .tf{display:flex;flex-direction:column;gap:2px}
.tfb{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;color:inherit}
.tfb:hover{background:var(--surface-2)}
.tfb .sub{margin-left:auto}
.tfb[aria-pressed="true"]{background:color-mix(in srgb,var(--ac) 14%,var(--surface));border-color:color-mix(in srgb,var(--ac) 40%,var(--surface))}
.C .tbl{padding:0;overflow-x:auto}
.at{width:100%;border-collapse:collapse;min-width:560px}
.at th{text-align:left;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.at td{padding:4px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.at tr.sel td{background:color-mix(in srgb,var(--focus) 8%,var(--surface))}
.alink{display:flex;gap:8px;align-items:center;background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;color:inherit;border-radius:8px}
.alink>span{display:flex;flex-direction:column}

/* narrow frames: container queries on the app width */
@container app (max-width:1100px){
  .C .cgrid{grid-template-columns:220px minmax(0,1fr)}
  .C .insp{grid-column:1/-1;position:static;max-height:none}
}
@container app (max-width:700px){
  .C .cgrid{grid-template-columns:minmax(0,1fr)}
  .C .reqs,.C .mid{display:contents}
  .C .tfc,.C .rl{order:0}
  .C .board,.C .tbl{order:1}.C .transport{order:2}.C .insp{order:3;grid-column:auto}.C .live{order:4;margin-top:0}.C .wif{order:5}.C .clock{order:6}.C .legend{order:7}
  .C .rqs{display:flex;gap:6px;overflow-x:auto}
  .C .rq{min-width:230px;margin:0}
  .C .tf{flex-direction:row;flex-wrap:wrap}
}
@container app (max-width:560px){
  .top{flex-direction:column;align-items:flex-start}
  .ctl{width:100%}
  .ir{grid-template-columns:minmax(0,1fr)}
  .ir code{grid-column:auto}
  .tr{grid-template-columns:auto minmax(0,1fr)}
  .tr>.sub{grid-column:1/-1}
  .ctrls .sp{display:none}
  .crow{grid-template-columns:84px minmax(0,1fr) 64px}
  .gate .gq{font-size:15px}
}
/* the other lanes: no task (do it, check) and product mode stages share the task tints; product review and stories get their own */
.k-product{--k:var(--a7);--kb:color-mix(in srgb,var(--a7) 15%,var(--surface));--ki:color-mix(in srgb,var(--a7) 45%,var(--ink))}
.k-stories{--k:var(--a6);--kb:color-mix(in srgb,var(--a6) 16%,var(--surface));--ki:color-mix(in srgb,var(--a6) 40%,var(--ink))}
[hidden]{display:none!important}
a{color:var(--lilac-ink)}
.foot{margin-top:14px}
/* live tracker: replay command, link, and the demo task's live page in a frame */
.copy{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.copy code{flex:1 1 220px;min-width:0;padding:4px 8px}
.lv-links{display:flex;flex-wrap:wrap;gap:2px 12px;align-items:baseline}
.lv-off{margin-top:10px}
.lv-wrap{position:relative;margin-top:10px}
.lv-wrap .lv-load{position:absolute;inset:0;background:var(--surface)}
.lv-wrap iframe{display:block;width:100%;height:760px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
/* tables inside a step */
.tscroll{overflow-x:auto;margin:8px 0}
.st-t{width:100%;border-collapse:collapse;font-size:12px}
.st-t th,.st-t td{text-align:left;vertical-align:top;padding:4px 10px 4px 0;border-bottom:1px solid var(--line)}
.st-t th{color:var(--muted)}
/* long names and text wrap instead of widening the page */
.kv td{overflow-wrap:anywhere}
.dh>div{min-width:0}
.dh h2{overflow-wrap:anywhere}
.gact .btn{white-space:normal;text-align:left}
@container app (max-width:560px){.tr .tn{white-space:normal;flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

function load(id){S.sc=D.scenarios.find(x=>x.id===id)||D.scenarios[0];S.steps=expand(S.sc,S.tg);S.i=0;S.max=0;S.asked={};S.dec={};stop();try{history.replaceState(null,"","#"+S.sc.id)}catch(e){}}
/* the stage columns of a request's mode (the end step shows as Done in the transport, not as a column) */
function cols(sc){return (COLS[(sc||S.sc).mode]||COLS.task).filter(c=>c[0]!=="end")}
function stageName(sc,k){const c=(COLS[sc.mode]||[]).find(x=>x[0]===k);return c?c[1]:k}
function nm(k){return k==="fail"?"Review":k==="ok"?"Done":stageName(S.sc,k)}
function colOf(s){if(s.t==="triage")return "triage";if(["context","risk","team"].includes(s.t))return "plan";if(s.t==="end")return null;return s.stage||"plan"}
function kOf(s){return s.t==="end"?"ok":s.t==="reviewFail"?"fail":colOf(s)}
const kc=k=>"k-"+(k||"ok");
function title(s){const sc=S.sc;switch(s.t){
  case "triage":return "Triage: "+sc.lane;case "context":return "Context pack";case "risk":return "Risk: "+sc.risk;case "team":return "The team";
  case "gate":return (s.again?"Gate again: ":"Gate: ")+s.q;case "build":return "Build";case "review":return s.again?"Review again":"Review";case "reviewFail":return "Review fails";
  case "rebuild":return "Back to Build";case "lessons":return "A lesson is recorded";case "scope":return "Scope check blocks";case "guard":return "The guard";
  case "revise":return "Changes, then the gate again";case "check":return s.name;case "end":return "Done";default:return s.title||(s.stage?nm(s.stage):"Step")}}
function short(s){switch(s.t){case "triage":return "Triage";case "context":return "Context pack";case "risk":return "Risk";case "team":return "Team";case "gate":return s.again?"Gate again":"Gate";
  case "check":return s.name;case "build":return "Build";case "rebuild":return "Fix";case "review":return s.again?"Review again":"Review";case "reviewFail":return "Review fails";
  case "lessons":return "Lesson";case "guard":return "Guard";case "scope":return "Scope check";case "revise":return "Changes";case "end":return "Done";default:return s.title||(s.stage?nm(s.stage):"Step")}}
function who(s){
  if(s.t==="gate")return ["You"];
  if(["triage","risk","team","check","guard","scope","lessons"].includes(s.t))return ["main session"];
  if(s.t==="context")return ["explorer"];
  if(s.t==="revise")return [s.by||"main session"];
  if(s.t==="end")return [];

}
function stageState(k){
  const idx=[];S.steps.forEach((x,j)=>{if(colOf(x)===k)idx.push(j)});
  if(!idx.length)return "skip";
  const cur=S.steps[S.i];if(cur.t==="end")return "done";
  const fi=S.steps.findIndex(x=>x.t==="reviewFail"),ai=S.steps.findIndex(x=>x.t==="review"&&x.again);

  if(colOf(cur)===k)return "cur";

function gateWaiting(){const s=S.steps[S.i];return s.t==="gate"&&!S.dec[S.i]}
function stWord(k,st){if(st==="cur"&&gateWaiting()&&colOf(S.steps[S.i])===k)return "waiting for you";return {done:"done",cur:"now",todo:"to come",skip:"skipped",fail:"failed"}[st]}
function agentsIn(sc){const a=new Set(["main session"]);if(sc.mode==="task")a.add("explorer");(sc.team||[]).forEach(r=>a.add(r.agent));sc.steps.forEach(s=>(s.agents||[]).forEach(x=>a.add(x)));return a}
function stagesIn(sc,n){const k=new Set();(sc.team||[]).filter(r=>r.agent===n).forEach(r=>k.add(stageName(sc,r.stage)));sc.steps.filter(s=>(s.agents||[]).includes(n)).forEach(s=>s.stage&&k.add(stageName(sc,s.stage)));if(n==="explorer"&&sc.mode==="task")k.add("Context pack");if(n==="main session")k.add("Triage");return [...k]}
function uses(n){return D.scenarios.filter(sc=>agentsIn(sc).has(n))}
function mins(){let d=0,a=0;const per={};S.steps.forEach((s,j)=>{if(!s.min)return;const k=s.stage||"plan";per[k]=per[k]||{d:0,a:0};per[k].a+=s.min;a+=s.min;if(j<S.i){d+=s.min;per[k].d+=s.min}});return {d,a,per}}

function modelOf(n){const r=((S.sc&&S.sc.team)||[]).find(x=>x.agent===n&&x.model);const m=r?r.model:((D.models||{})[n]||(D.agents[n]||{}).model||D.defaultModel||"Opus");return m==="You"?"session":m}
function initials(n){if(n==="You")return "You";const p=n.split(/[- ]/).filter(Boolean);return (p.length>1?p[0][0]+p[1][0]:n.slice(0,2)).toUpperCase()}

function av(n,size){return '<span class="av '+(size||"")+' t-'+slug(teamOf(n))+(S.agent===n?" hl":"")+'" title="'+esc(n==="You"?"You decide":n+" ("+teamOf(n)+")")+'">'+esc(initials(n))+'</span>'}

function tableHTML(t){return t?'<div class="tscroll"><table class="st-t"><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join("")+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join("")+'</tr>').join("")+'</tbody></table></div>':""}
function ticks(){return S.steps.map((s,j)=>'<button class="tk '+kc(kOf(s))+(j<S.i?" done":j===S.i?" cur":"")+(s.t==="gate"?" g":"")+'" data-act="jump" data-arg="'+j+'"'+(j>S.max?" disabled":"")+' aria-label="Step '+(j+1)+': '+esc(title(s))+'" title="'+(j+1)+'. '+esc(title(s))+'"></button>').join("")}

}
function stepHead(s){const k=kOf(s);return '<div class="sh">'+pill(k,nm(k)||"Step")+'<h2>'+esc(title(s))+'</h2><span class="sub n">Step '+(S.i+1)+' of '+S.steps.length+'</span></div>'}
function topHTML(){const t=document.documentElement.dataset.theme||"light";

  '<div class="ctl"><div class="seg" role="group" aria-label="View"><button data-act="view" data-arg="flow" aria-pressed="'+(S.view==="flow")+'">'+ic("route")+'Flow</button><button data-act="view" data-arg="agents" aria-pressed="'+(S.view==="agents")+'">'+ic("users")+'Agents <span class="cnt">'+Object.keys(D.agents).length+'</span></button></div>'+

function followHTML(){if(!S.agent)return "";const on=agentsIn(S.sc).has(S.agent);

/* the what-if toggles change a task only; for other lanes they are greyed out */

function clockHTML(){const sc=S.sc,h='<section class="card clock"><h3>'+ic("clock")+'Agent time</h3>';

/* ---------- step body ---------- */
function gateHTML(s){const j=S.i,d=S.dec[j];
  return '<div class="gate"><div class="gh">'+ic("flag")+'<span>Your decision'+(s.again?" (again)":"")+'</span></div><div class="gq">'+esc(s.q)+'</div>'+
  '<div class="gs">'+av(s.by||"main session","s")+'<span>'+esc(s.by||"main session")+' wrote these. The full text is in the chat and on the live page, with line comments.</span></div>'+files(s.files)+
  (S.asked[j]&&s.qa?'<div class="qa"><div><b>You asked:</b> '+esc(s.qa.q)+'</div><div><b>Answer:</b> '+esc(s.qa.a)+'</div><div class="sub">Logged and added to the document\'s questions. The gate stays open.</div></div>':"")+
  (d==="ok"?'<div class="decided">'+ic("check")+'You approved. It is recorded in decisions.md.</div>':d==="change"?'<div class="decided">'+ic("loop")+'You asked for changes.</div>':

function doneHTML(s){const g=S.steps.filter(x=>x.t==="gate").length,l=S.steps.filter(x=>x.t==="reviewFail").length,m=mins();
  return '<div class="donebox">'+ic("check")+'<div><div class="dt">'+esc(s.say)+'</div><div class="stats"><span><b>'+g+'</b> gate'+(g===1?"":"s")+'</span><span><b>'+l+'</b> review loop'+(l===1?"":"s")+'</span><span>about <b>'+m.a+'</b> min of agent time</span></div></div></div>'}
function bodyHTML(s){
  const sc=S.sc;let h="";
  switch(s.t){
    case "triage":h+=(sc.mode==="product"?'<p><b>"Hold on - I won\'t start building from this directly."</b></p>':"")+'<p>Lane '+pill("triage",sc.lane)+' '+esc(sc.laneWhy)+'</p>'+
      (sc.mode==="task"?'<p class="muted">Next: a task folder <code>demo-'+esc(sc.id)+'</code> (normally the ticket id), with its own live page.</p>':"");break;
    case "context":{const c=sc.context;
      h+='<p>'+av("explorer","s")+' <b>explorer</b> writes <code>context.md</code>: everything this change touches, so nobody explores twice.</p><div class="imp">'+
      c.impact.map(r=>'<div class="ir"><span class="kind">'+esc(r[0])+'</span><span>'+esc(r[1])+'</span><span class="sub">'+esc(r[3])+'</span><code>'+esc(r[2])+'</code></div>').join("")+'</div>'+
      '<p class="muted"><b>Rules that apply:</b> '+esc(c.rules.join("; "))+'.</p><p class="muted"><b>Risk signals:</b> '+esc(c.signals.join("; "))+'.</p>'+files(["context.md"]);break}

    case "team":h+='<p>Each agent joins for a reason. A stage with nobody on it is skipped.</p><div class="team">'+sc.team.map(r=>'<div class="tr">'+pill(r.stage,stageName(sc,r.stage))+'<span class="tn">'+av(r.agent,"s")+esc(r.agent)+mdl(r.agent)+'</span><span class="sub">'+(r.focus?'('+esc(r.focus)+') ':"")+esc(r.why)+'</span></div>').join("")+'</div>'+
      ((sc.notNeeded||[]).length?'<details class="out"><summary>'+sc.notNeeded.length+' agents left out, and why</summary>'+sc.notNeeded.map(n=>'<div class="tr">'+av(n.agent,"s")+'<span>'+esc(n.agent)+'</span><span class="sub">'+esc(n.why)+'</span></div>').join("")+'</details>':"")+files(["triage.md"]);break;
    case "gate":h+=gateHTML(s);break;

    case "reviewFail":h+=agentsRow(s.agents)+'<div class="failbox">'+ic("x")+'<div><b>Review failed.</b> '+esc(s.finding)+'<div>The task goes back to Build. Only what failed runs again.</div></div></div>';break;
    case "rebuild":h+='<div class="loopnote">'+ic("loop")+'Back to Build to fix the finding</div>'+agentsRow(s.agents)+'<p>'+esc(s.say)+'</p>';break;
    case "lessons":h+='<p>One line goes into <code>.claude/review/lessons.md</code>. Agents read the lines for their area; the reviewer fails a repeat.</p><pre>'+esc(s.line)+'</pre><p class="muted">In the demo replay it goes into the demo folder, never your real lessons file.</p>';break;
    case "scope":h+='<p>'+esc(s.say)+'</p><div class="failbox">'+ic("warn")+'<div><b>Scope check blocks.</b> <code>'+esc(s.file)+'</code> is in no plan.<div>The agent drops that change, or accepts it with a reason.</div></div></div>';break;

  return h;
}

/* ---------- Studio: requests, board, transport, inspector ---------- */
function reqList(){return '<section class="card rl"><h3>Requests</h3><div class="rqs">'+D.scenarios.map(sc=>'<button class="rq" data-act="'+(S.view==="flow"?"load":"open")+'" data-arg="'+esc(sc.id)+'" aria-pressed="'+(S.view==="flow"&&sc.id===S.sc.id)+'">'+markDot(sc)+

function tileC(s,j){const k=kOf(s),cls=j<S.i?"done":j===S.i?"cur":j<=S.max?"seen":"todo";

function boardC(){
  const C=cols(),lanes=["You"];S.steps.forEach(s=>who(s).forEach(a=>{if(!lanes.includes(a))lanes.push(a)}));
  const head='<div class="corner">Who</div>'+C.map(([k,n])=>{const st=stageState(k);return '<div class="bh '+kc(k)+' is-'+st+'"><span class="bn">'+esc(n)+'</span><span class="bs">'+stWord(k,st)+'</span></div>'}).join("");
  const rows=lanes.map(l=>'<div class="bl'+(S.agent===l?" hlrow":"")+'" title="'+esc(l==="You"?"You decide":l)+'">'+av(l,"s")+'<span class="ln">'+(l==="You"?"You decide":esc(l))+'</span></div>'+
    C.map(([k])=>'<div class="bcell '+kc(k)+' is-'+stageState(k)+'">'+S.steps.map((s,j)=>[s,j]).filter(([s])=>colOf(s)===k&&who(s).includes(l)).map(([s,j])=>tileC(s,j)).join("")+'</div>').join("")).join("");
  return '<div class="bscroll"><div class="bgridC" role="group" aria-label="Who works in which stage" style="grid-template-columns:128px repeat('+C.length+',minmax(64px,1fr));min-width:'+(128+64*C.length)+'px">'+head+rows+'</div></div>';
}
function renderFlow(){
  const s=S.steps[S.i],k=kOf(s),w=who(s),skips=cols().filter(([c])=>stageState(c)==="skip");
  $("f-reqs").innerHTML=reqList()+whatIf()+clockHTML();

    '<span>Step '+(S.i+1)+' of '+S.steps.length+': <b>'+esc(title(s))+'</b></span>'+(skips.length?'<span class="sub">Skipped: '+skips.map(([c,n])=>esc(n)).join(", ")+'</span>':"")+'</div><div class="ticks">'+ticks()+'</div>'+controls();

  $("livebody").innerHTML=liveHTML();
  $("f-legend").innerHTML=legend();
  const ins=$("f-insp");ins.className="card insp "+kc(k);
  ins.innerHTML='<div class="whybig"><div class="wl">'+ic("bulb")+'Why this step</div><p>'+esc(s.why||"")+'</p></div>'+stepHead(s)+
    (w.length?'<div class="whoC">'+w.map(n=>'<span class="agc">'+av(n,"s")+(n==="You"?"You decide":esc(n))+'</span>').join("")+'</div>':"")+'<div class="body">'+bodyHTML(s)+'</div>';
}

/* ---------- Agents view ---------- */
function teamGroups(){const g={},o=[];Object.entries(D.agents).forEach(([n,a])=>{if(!g[a.team]){g[a.team]=[];o.push(a.team)}g[a.team].push(n)});return o.map(t=>[t,g[t]])}
function ensureAgent(){if(!S.agent||!D.agents[S.agent])S.agent="code-reviewer"}
function sdots(n){const st=(D.agents[n]||{}).stages||[];return '<span class="sdots" title="Stages: '+esc(st.filter(k=>CK.includes(k)).map(k=>TN[k]).join(", ")||"none in a task")+'">'+COLS.task.map(([k])=>'<i class="'+kc(k)+(st.includes(k)?" on":"")+'"></i>').join("")+'</span>'}
const modelName=a=>a.model==="You"?"session":(a.model||D.defaultModel||"Opus");
function budgetHTML(a){
  const ks=(a.stages||[]).filter(k=>D.budgets.low[k]!=null);
  return '<p>'+(a.model==="You"?"Your session: no turn limit.":"About "+(a.calls||20)+" tool calls, stops at "+a.turns+" turns"+(a.web?", at most 3 web lookups":"")+". Writes its file first, replies in 10 lines or fewer.")+'</p>'+
  (ks.length?'<table class="bt"><thead><tr><th>Stage budget</th><th>low</th><th>medium</th><th>high</th></tr></thead><tbody>'+ks.map(k=>'<tr><td>'+pill(k,TN[k]||k)+'</td><td>'+D.budgets.low[k]+' min</td><td>'+D.budgets.medium[k]+' min</td><td>'+D.budgets.high[k]+' min</td></tr>').join("")+'</tbody></table><div class="sub">Minutes for the whole stage, shared with everyone on it, by the task\'s risk; the live page flags an overrun.</div>'
  :'<div class="sub">No task-stage budget: it works in product mode or before the stages start. A product has no stage budget; the live page shows its working time.</div>')}
function agentDetail(n){
  const a=D.agents[n];if(!a)return "";
  const ins=uses(n),outs=D.scenarios.map(sc=>[sc,(sc.notNeeded||[]).find(x=>x.agent===n)]).filter(x=>x[1]),st=a.stages||[];
  const head='<div class="dh t-'+slug(a.team)+'">'+av(n,"l")+'<div><h2>'+esc(n)+'</h2><div class="dm"><span class="tpill">'+esc(a.team)+'</span><span class="m">'+esc(modelName(a))+'</span>'+(a.own?'<span class="pn">this repo\'s own agent</span>':"")+'</div></div></div>';
  const track='<h4>Stages it joins in a task</h4><div class="mini">'+COLS.task.map(([k,t])=>'<span class="mi '+kc(k)+(st.includes(k)?" on":"")+'"><i></i>'+t+'</span>').join("")+'</div>';
  const kv='<table class="kv"><tbody>'+[["Joins when",a.joins],["Left out when",a.skipped],["Reads",a.reads],["Writes",a.writes],["Hands to",a.hands]].map(r=>'<tr><th>'+r[0]+'</th><td>'+esc(r[1])+'</td></tr>').join("")+'</tbody></table>';
  const works='<h4>Works on</h4>'+(ins.length?ins.map(sc=>'<button class="rq-chip" data-act="open" data-arg="'+esc(sc.id)+'"><span class="mark"></span><span><b>'+esc(sc.label)+'</b> <span class="sub">'+esc(stagesIn(sc,n).join(", "))+'</span></span>'+ic("next")+'</button>').join(""):
    '<div class="empty">'+ic("users")+'<div><b>None of these requests use it.</b><div>It joins when: '+esc(a.joins)+'</div></div></div>');
  const lo=outs.length?'<h4>Left out, and why</h4>'+outs.map(([sc,x])=>'<div class="lo"><b>'+esc(sc.label)+':</b> '+esc(x.why)+'</div>').join(""):"";
  return head+'<p class="does">'+esc(a.does)+'</p>'+kv+track+works+lo+'<h4>'+ic("clock")+'Budget</h4>'+budgetHTML(a);
}
function renderAgents(){ensureAgent();const g=teamGroups(),all=Object.keys(D.agents),list=all.filter(n=>S.team==="all"||D.agents[n].team===S.team);
  $("a-reqs").innerHTML='<section class="card tfc"><h3>Teams</h3><div class="tf">'+
    [["all","All teams",all.length]].concat(g.map(([t,ns])=>[t,t,ns.length])).map(([id,t,c])=>'<button class="tfb t-'+slug(id)+'" data-act="team" data-arg="'+esc(id)+'" aria-pressed="'+(S.team===id)+'"><span class="tdot"></span>'+esc(t)+'<span class="sub">'+c+'</span></button>').join("")+'</div></section>'+reqList();
  $("a-tbl").innerHTML='<table class="at"><thead><tr><th>Agent</th><th>Model</th><th>Stages</th><th>Requests</th><th>Budget</th></tr></thead><tbody>'+
    list.map(n=>{const a=D.agents[n],u=uses(n).length;return '<tr class="'+(n===S.agent?"sel":"")+'"><td><button class="alink" data-act="agent" data-arg="'+esc(n)+'" aria-pressed="'+(n===S.agent)+'">'+av(n,"s")+'<span><span>'+esc(n)+'</span><span class="sub">'+esc(a.team)+'</span></span></button></td><td><span class="m">'+esc(modelName(a))+'</span></td><td>'+sdots(n)+'</td><td>'+(u||'<span class="sub">none</span>')+'</td><td class="sub">'+(a.model==="You"?"no limit":(a.calls||20)+" calls, "+a.turns+" turns")+'</td></tr>'}).join("")+
    '</tbody></table>';
  $("a-insp").innerHTML=agentDetail(S.agent);
}

/* ---------- actions ---------- */
function start(){if(S.auto)return;S.auto=setInterval(()=>{if(gateWaiting()||S.i>=S.steps.length-1){stop();render();return}S.i++;S.max=Math.max(S.max,S.i);render()},1600/S.speed)}
function stop(){if(S.auto){clearInterval(S.auto);S.auto=null}}
function act(a,arg){
  const s=S.steps[S.i];
  if(a!=="copy")S.copied=false;
  switch(a){
    case "next":if(S.i<S.steps.length-1&&!gateWaiting())S.i++;break;
    case "back":stop();if(S.i>0)S.i--;break;
    case "restart":stop();S.steps=expand(S.sc,S.tg);S.i=0;S.max=0;S.asked={};S.dec={};break;
    case "ok":if(gateWaiting()){S.dec[S.i]="ok";S.i++}break;
    case "change":if(gateWaiting()){S.dec[S.i]="change";S.steps.splice(S.i+1,0,{t:"revise",stage:s.stage,by:s.by,agents:[s.by||"main session"],why:"You asked for changes: live_status.py changes marks the cards, the author changes only those and gates again. Nothing goes ahead on a card you did not approve."},Object.assign({},s,{again:true}));S.max=S.i;S.i++}break;
    case "ask":S.asked[S.i]=true;break;
    case "play":if(S.auto)stop();else start();break;
    case "speed":S.speed=+arg;if(S.auto){stop();start()}break;
    case "jump":{const j=+arg;if(j>=0&&j<=S.max){stop();S.i=j}break}
    case "load":load(arg);S.view="flow";break;
    case "open":S.view="flow";load(arg);break;
    case "view":stop();S.view=arg;try{history.replaceState(null,"","#"+(arg==="agents"?"agents":S.sc.id))}catch(e){}break;
    case "agent":S.agent=arg||null;break;
    case "team":S.team=arg;break;
    case "theme":{const t=THEMES[(THEMES.indexOf(document.documentElement.dataset.theme)+1)%3];document.documentElement.dataset.theme=t;try{localStorage.setItem("sim:theme",t)}catch(e){}break}
    case "copy":{const c=$("cmd");if(c&&navigator.clipboard)navigator.clipboard.writeText(c.textContent).then(()=>{S.copied=true;render()},()=>{});break}
    case "tg":S.tg[arg]=!S.tg[arg];S.steps=expand(S.sc,S.tg);S.i=Math.min(S.i,S.steps.length-1);S.max=Math.min(S.max,S.steps.length-1);S.asked={};break;
  }
  S.max=Math.max(S.max,S.i);
  render();
}
function after(){
  if(S.view==="flow"){const t=document.querySelector(".C .tile.cur");if(t){const sc=t.closest(".bscroll");sc.scrollLeft=Math.max(0,t.closest(".bcell").offsetLeft-sc.clientWidth/2)}}
}
function render(){
  const ae=document.activeElement,fk=ae&&ae.dataset&&ae.dataset.act?[ae.dataset.act,ae.dataset.arg||""]:null;
  $("top").innerHTML=topHTML();
  $("follow").innerHTML=S.view==="flow"?followHTML():"";
  $("flowv").hidden=S.view!=="flow";$("agv").hidden=S.view!=="agents";
  if(S.view==="flow")renderFlow();else renderAgents();
  liveFrame();
  if(fk){const all=[...document.querySelectorAll("[data-act]")];
    let el=all.find(e=>e.dataset.act===fk[0]&&(e.dataset.arg||"")===fk[1]&&!e.disabled&&e.offsetParent!==null);
    if(!el&&fk[0]==="next")el=document.querySelector('[data-act="ok"]');
    if(!el&&["ok","change"].includes(fk[0]))el=document.querySelector('[data-act="next"]:not([disabled])');
    if(el)el.focus({preventScroll:true})}
  after();
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled||b.tagName==="INPUT")return;act(b.dataset.act,b.dataset.arg)});
document.addEventListener("change",e=>{const t=e.target;if(t.matches&&t.matches("input[data-act]"))act(t.dataset.act,t.dataset.arg)});
document.addEventListener("keydown",e=>{if(S.view!=="flow"||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="ArrowRight"){e.preventDefault();act("next")}else if(e.key==="ArrowLeft"){e.preventDefault();act("back")}});
$("liveframe").addEventListener("load",()=>{if($("liveframe").dataset.src)$("lvload").hidden=true});

const first=(location.hash||"").slice(1);
load(D.scenarios.some(x=>x.id===first)?first:"medium");
if(first==="agents"){S.view="agents";try{history.replaceState(null,"","#agents")}catch(e){}}
render();
</script>
</body>
