<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracker Input Variants</title>
<style>
/* Live tracker (variant A). Offline: the page reloads tracker-data.js every 3 s; tracker.py writes it. */
:root{--ink:#2e2d38;--muted:#8b879a;--line:#ebe8f1;--soft:#f7f6fb;--accent:#6c7fd8;--accent-ink:#3a49a8;
  --accent-soft:#eef0fc;--ok:#3f9d72;--ok-soft:#ecf8f1;--ok-line:#c4e7d4;--warn:#a86b12;--warn-soft:#fdf5e6;--warn-line:#f0dcb4;
  --bad:#b4534b;--bad-soft:#fbefee;--bad-line:#efcdc9}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
[hidden]{display:none!important}
body{font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;background:var(--soft);color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.app{height:100vh;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:8px;padding:8px 12px 10px}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px 12px}
.brand{display:flex;align-items:center;gap:8px}.brand b{font-size:16px;font-weight:500}
.live{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ok)}
.live i{width:7px;height:7px;border-radius:50%;background:#5cc995;animation:blink 1.6s infinite}
.live.idle{color:var(--muted)}.live.idle i{background:#cfcbd8;animation:none}
@keyframes blink{50%{opacity:.3}}
.stage{color:#5d5a6b}.stage b{font-weight:500;color:var(--ink)}
.prog{display:flex;align-items:center;gap:6px;color:var(--muted)}
.pbar{width:90px;height:6px;border-radius:999px;background:#efedf4;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b9c3f1,#8fd1b0);border-radius:999px;transition:width .8s}
.gates{display:flex;gap:4px;flex-wrap:wrap}
.gate{border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);font-size:12px;background:#fff;transition:all .6s}
.gate.approved{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.gate.next{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.gate.pop{animation:pop .8s}@keyframes pop{40%{transform:scale(1.15)}}
.sp{flex:1}
.upd{color:var(--muted);font-size:12px}

.pipe{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.pst{position:relative;border:1px solid var(--line);border-radius:10px;padding:4px 7px;background:#fff;overflow:hidden;min-width:0}
.pst b{display:block;font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pst span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pst.done{border-color:var(--ok-line);background:var(--ok-soft)}.pst.done b{color:var(--ok)}
.pst.skip{opacity:.5;border-style:dashed}
.pst.cur{border-color:#c9d0f3;background:var(--accent-soft)}.pst.cur b{color:var(--accent-ink)}
.pst.cur::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
  transform:translateX(-100%);animation:sweep 2.2s infinite}
@keyframes sweep{to{transform:translateX(100%)}}

.grid{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr) minmax(250px,.8fr);gap:8px;min-height:0}
.col{display:grid;gap:8px;min-height:0;grid-template-rows:auto minmax(0,1fr)}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 11px;min-height:0;display:flex;flex-direction:column}
.panel h2{margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  display:flex;justify-content:space-between;align-items:center;flex:none}
.panel h2 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:0 7px}
.scroll{overflow:auto;min-height:0;flex:1}
.vis{position:relative}
.vis svg{display:block;width:100%;height:32vh;flex:none}
.note{border-color:#c9d0f3;background:var(--accent-soft);color:var(--accent-ink)}
.note.wait{background:var(--warn-soft);border-color:var(--warn-line);color:#6e4a0c}
.note b{font-weight:500}

.wk{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 9px;align-items:center;padding:5px 0;border-top:1px solid #f3f1f6}
.wk.new{animation:slideIn .5s ease-out}
.wk:first-child{border-top:0}
.ava{position:relative;width:30px;height:30px;grid-row:span 2}
.ava .core{position:absolute;inset:4px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:10px}
.ava svg{position:absolute;inset:0;animation:spin 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wk .who{font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .who small{font-weight:400;color:var(--muted);margin-left:4px}
.wk .tm{color:var(--muted);font-size:12px;grid-row:span 2;align-self:center}
.thought{grid-column:2;color:#4b58a8;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.typer::after{content:"▍";animation:blink 1s infinite;margin-left:1px;color:var(--accent)}
.idle{color:var(--muted);padding:6px 0}

.tb{display:grid;grid-template-columns:112px minmax(0,1fr);gap:6px;align-items:start;padding:3px 0;border-top:1px solid #f3f1f6}
.tb:first-child{border-top:0}
.tb .tn{display:flex;align-items:center;gap:6px;font-weight:500;padding-top:2px}
.tb .tn i{width:8px;height:8px;border-radius:50%;flex:none}
.pills{display:flex;flex-wrap:wrap;gap:3px}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:0 7px 0 5px;font-size:11.5px;line-height:18px;color:#8b879a;background:#fff;transition:all .6s}
.pill i{width:6px;height:6px;border-radius:50%;background:#dcd8e4}
.pill b{font-weight:400;font-size:10.5px;opacity:.75}
.pill.working{color:var(--accent-ink);border-color:#c9d0f3;background:var(--accent-soft)}
.pill.working i{background:var(--accent);animation:blink 1.1s infinite}
.pill.done{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.pill.done i{background:#5cc995}
.pill.failed{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.pill.failed i{background:var(--bad)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kpi{border:1px solid #f0eef5;border-radius:10px;padding:5px 7px;transition:background .8s,border-color .8s}
.kpi .v{font-size:17px;font-weight:500}
.kpi .l{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.bump{animation:bump 1s}@keyframes bump{30%{border-color:#c9d0f3;background:var(--accent-soft)}}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px;padding:4px 0;border-top:1px solid #f3f1f6}
.feed li.new{animation:slideIn .5s ease-out}
.feed li:first-child{border-top:0}
.feed time{color:var(--muted)}
.feed li.done span::before{content:"✓ ";color:var(--ok)}
.feed li.g span{color:var(--ok)}
.feed li.bad span{color:var(--bad)}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.node circle.halo{transform-box:fill-box;transform-origin:center;opacity:0}
.node.active circle.halo{animation:halo 2s ease-out infinite}
@keyframes halo{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.6)}}
.link{stroke:#ebe8f1;stroke-width:2;fill:none;transition:stroke .6s}
.link.active{stroke:#b9c3f1;stroke-dasharray:6 8;animation:flow 1s linear infinite}
.link.done{stroke:var(--ok-line)}
@keyframes flow{to{stroke-dashoffset:-28}}
.toast{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#fff;border:1px solid var(--ok-line);
  border-radius:999px;padding:4px 12px;white-space:nowrap;animation:toast 3.4s forwards;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast b{color:var(--ok);font-weight:500}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.empty{display:grid;place-items:center;height:100vh;color:var(--muted)}

/* your input: choices and questions answered in the tracker */
.inbox{background:#fff;border:1px solid var(--warn-line);border-radius:14px;padding:9px 11px;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:auto}
.inbox>h2{margin:0;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);display:flex;justify-content:space-between;align-items:center}
.inbox>h2 em{font-style:normal;text-transform:none;letter-spacing:0;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:0 7px}
.ask{border:1px solid #f3ead8;border-radius:12px;padding:8px 10px;background:#fffdf8}
.ask.sent{border-color:var(--ok-line);background:var(--ok-soft)}
.ask h3{margin:0;font-size:13px;font-weight:500;display:flex;gap:6px;align-items:baseline}
.ask h3 small{color:var(--muted);font-weight:400}
.ask p{margin:3px 0 0;color:#5d5a6b}
.links{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.links a{display:inline-flex;align-items:center;gap:4px;border:1px solid #c9d0f3;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 9px;font-size:12px;text-decoration:none}
.links a::after{content:"↗";font-size:11px}
.links a:focus-visible,.opt:focus-visible,.btn:focus-visible,.qa textarea:focus-visible,.other:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:7px}
.opt{text-align:left;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt:focus{outline:none}
.opt b{font-weight:500}
.opt span{color:var(--muted);font-size:12px}
.opt .rec{align-self:flex-start;font-size:10.5px;color:var(--ok);background:var(--ok-soft);border:1px solid var(--ok-line);border-radius:999px;padding:0 6px}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.qa{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:3px 8px;align-items:start;padding:5px 0;border-top:1px solid #f3eee4}
.qa:first-child{border-top:0}
.qa .qid{font-weight:500;color:var(--warn)}
.qa .rec{color:var(--ok);font-size:12px}
.qa .rec::before{content:"Recommended: ";color:var(--muted)}
.qa .pick{display:flex;gap:3px}
.qa textarea,.other{grid-column:2/4;font:inherit;border:1px solid var(--line);border-radius:8px;padding:4px 7px;resize:vertical;min-height:30px;width:100%}
.other{margin-top:6px}
.seg{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 8px;cursor:pointer;color:#5d5a6b}
.seg:focus{outline:none}
.seg[aria-pressed=true]{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok)}
.seg.chg[aria-pressed=true]{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.send{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.btn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:2px 14px;cursor:pointer}
.btn:focus{outline:none}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--accent-ink);border-color:#c9d0f3}
.hint{color:var(--muted);font-size:12px}
.done-msg{color:var(--ok)}
/* B: decision bar across the screen */
.app.lay-B .inbox{max-height:32vh}
.app.lay-B .inbox .ask{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(0,2fr);gap:4px 14px}
.app.lay-B .inbox .ask>*{grid-column:2}
.app.lay-B .inbox .ask>h3,.app.lay-B .inbox .ask>p,.app.lay-B .inbox .ask>.links{grid-column:1}
.app.lay-B .inbox .ask>h3{grid-row:1}.app.lay-B .inbox .ask>p{grid-row:2}.app.lay-B .inbox .ask>.links{grid-row:3;align-self:start}
.app.lay-B .inbox .ask>.opts,.app.lay-B .inbox .ask>.qs{grid-row:1/span 3;margin-top:0}
.app.lay-B .inbox .ask>.send{grid-column:2}
.ptabs{display:flex;gap:4px}
.ptab{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;color:#5d5a6b;border-radius:999px;padding:2px 10px;cursor:pointer}
.ptab[aria-selected=true]{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}

@media (max-width:1000px){
  .app{height:auto}
  .grid{grid-template-columns:1fr}
  .vis svg{height:300px}
  .pipe{grid-template-columns:repeat(4,minmax(0,1fr))}
  .col{grid-template-rows:none}
  .scroll{max-height:320px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="empty" id="empty">Waiting for tracker-data.js…</div>
<div class="app" id="app" hidden>
  <header class="top">
    <div class="brand"><b id="name"></b><span class="live" id="live"><i></i><span id="liveText">Live</span></span></div>
    <div class="stage" id="stageText"></div>
    <div class="prog"><span class="num" id="progText"></span><div class="pbar"><i id="pbar"></i></div><span class="num" id="runTime"></span></div>
    <div class="gates" id="gates"></div>
    <span class="sp"></span>
    <div class="ptabs" id="ptabs" role="tablist" aria-label="Input panel variant" hidden>
      <button class="ptab" role="tab" data-l="A" aria-selected="true">A Inline card</button>
      <button class="ptab" role="tab" data-l="B" aria-selected="false">B Decision bar</button>
      <button class="ptab" role="tab" data-l="C" aria-selected="false">C Your turn column</button>
    </div>
    <span class="upd num" id="upd"></span>
  </header>

  <nav class="pipe" id="pipe" aria-label="Stages"></nav>

  <main class="grid" id="grid">
    <section class="col" id="colV">
      <div class="panel vis" aria-label="Teams around the lead">
        <h2><span>Teams around the lead</span><em id="visNote"></em></h2>
        <svg id="aSvg" viewBox="0 0 620 430" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="panel"><h2>Team board <em class="num" id="nTeam"></em></h2><div class="scroll" id="board"></div></div>
    </section>

    <section class="col" id="colM">
      <section class="inbox" id="inbox" aria-label="Your input" hidden></section>
      <div class="panel note" id="noteBox" hidden></div>
      <div class="panel" id="workPanel"><h2>Working now <em class="num" id="nWork"></em></h2><div class="scroll" id="now"></div></div>
    </section>

    <section class="col">
      <div class="panel"><h2>Output so far</h2><div class="kpis" id="kpis"></div></div>
      <div class="panel"><h2>Activity</h2><ul class="feed scroll" id="feed"></ul></div>
    </section>
  </main>
</div>

<script>
window.PROTO = true;
const HUES = {lead:220, product:262, design:320, architecture:190, engineering:150, domain:205, quality:38, audit:0, operations:95};
const GATE_SHORT = {G0:"Plan", G1:"Owner answers", GP:"Prototype", G2:"Scope", G3:"Design", G4:"Go-live"};
const KPI = [["docs","Documents"],["questions","Questions"],["criteria","Criteria"],["stories","Stories"],
  ["points","Points"],["ops","API operations"],["decisions","Decisions"],["adrs","ADRs"]];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svgEl = (tag, attrs = {}) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const ms = iso => iso ? new Date(iso).getTime() : 0;
const hhmm = iso => iso ? iso.slice(11, 16) : "";
const dur = s => { s = Math.max(0, Math.floor(s)); return s < 60 ? s + "s" : s < 3600 ? Math.floor(s/60) + "m " + String(s%60).padStart(2,"0") + "s" : Math.floor(s/3600) + "h " + String(Math.floor(s/60)%60).padStart(2,"0") + "m"; };
const ago = t => { const s = (Date.now() - t) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.floor(s/60) + " min ago" : Math.floor(s/3600) + " h ago"; };
const initials = a => a.split("-").map(w => w[0].toUpperCase()).join("").slice(0, 2);

let D = null, prev = null, AGENTS = {}, latest = {}, typers = {}, seenLog = new Set(), hub = {pos:{}, built:""};
const hueOf = a => HUES[AGENTS[a]] ?? 260;
const teamName = id => (D.teams.find(t => t.id === id) || {name:"Other"}).name;
const working = () => Object.keys(latest).filter(a => latest[a].status === "working");

/* data arrives through tracker-data.js, which calls this */
window.__TRACKER__ = data => {
  prev = D; D = data;
  AGENTS = {}; D.teams.forEach(t => t.agents.forEach(a => AGENTS[a] = t.id));
  latest = {}; D.runs.forEach(r => { if (!latest[r.agent]) latest[r.agent] = r; });   /* runs are newest first */
  $("empty").hidden = true; $("app").hidden = false;
  render();
};
function poll(){
  if (window.PROTO) return;
  const s = document.createElement("script");
  s.src = "tracker-data.js?t=" + Date.now();
  s.onload = s.onerror = () => s.remove();
  document.head.append(s);
}

function render(){
  const first = !prev;
  document.title = D.name + " - factory tracker";
  $("name").textContent = D.name;
  const order = D.stages.map(s => s.id), cur = Math.max(0, order.indexOf(D.stage));
  const curName = (D.stages[cur] || {}).name || "";
  $("stageText").innerHTML = `<b>${esc(D.stage)} ${esc(curName)}</b>${D.stageNote ? " · " + esc(D.stageNote) : ""}`;

  /* stage strip */
  const runningIn = new Set(working().map(a => latest[a].stage).filter(Boolean));
  const gateAfter = {}; D.gateDefs.forEach(g => gateAfter[g.after] = g.id);
  let done = 0;
  $("pipe").innerHTML = D.stages.map((s, i) => {
    const docs = D.stageDocs[s.id] || 0, gate = gateAfter[s.id], gateOk = gate && (D.gates[gate] || {}).state === "approved";
    let cls, txt;
    if (s.id === D.stage || runningIn.has(s.id)) { cls = "cur"; txt = "in progress" + (docs ? " · " + docs + " docs" : ""); }
    else if (docs || gateOk) { cls = "done"; txt = "done · " + (docs ? docs + " docs" : "-"); }
    else if (i < cur) { cls = "skip"; txt = "not run"; }
    else { cls = ""; txt = "waiting"; }
    if (cls === "done" || cls === "skip") done++;
    return `<div class="pst ${cls}" title="${esc(s.id + " " + s.name)}"><b>${esc(s.id)} ${esc(s.name)}</b><span>${txt}</span></div>`;
  }).join("");
  $("progText").textContent = done + "/" + D.stages.length + " stages";
  $("pbar").style.width = Math.round(done / D.stages.length * 100) + "%";

  /* gates */
  const nextGate = D.gateDefs.find(g => (D.gates[g.id] || {}).state !== "approved");
  $("gates").innerHTML = D.gateDefs.map(g => {
    const st = (D.gates[g.id] || {}).state || "open", was = prev && ((prev.gates[g.id] || {}).state);
    const cls = st === "approved" ? "approved" : (st === "waiting" || g === nextGate) ? "next" : "";
    const words = (D.gates[g.id] || {}).words;
    return `<span class="gate ${cls} ${prev && was !== st && st === "approved" ? "pop" : ""}" title="${esc(g.name + (words ? ': "' + words + '"' : ""))}">${esc(g.id)} ${esc(GATE_SHORT[g.id] || g.name)}</span>`;
  }).join("");

  /* note: waiting on the user, else the next gate */
  const nb = $("noteBox");
  if (D.waiting) { nb.className = "panel note wait"; nb.innerHTML = `<b>Waiting on you:</b> ${esc(D.waiting)}`; nb.hidden = false; }
  else if (nextGate) { nb.className = "panel note"; nb.innerHTML = `<b>Next for you:</b> gate ${esc(nextGate.id)} ${esc(nextGate.name)}, after ${esc(nextGate.after)}.`; nb.hidden = false; }
  else nb.hidden = true;

  renderInbox(); renderNow(first); renderBoard(); renderKpis(); renderFeed(first); renderHub(first);
  const w = working().length;
  $("visNote").textContent = w ? w + " working in parallel" : "idle";
  $("live").classList.toggle("idle", !w);
  $("liveText").textContent = w ? "Live" : "Idle";
  tick();
}

function thoughtOf(a){
  const r = latest[a], act = (D.activity || {})[a];
  return act && ms(act.at) >= ms(r.startedAt) ? act.text : (r.task ? "Working on: " + r.task : "Working…");
}
function renderNow(first){
  const w = working().sort((a, b) => ms(latest[a].startedAt) - ms(latest[b].startedAt));
  const before = new Set(prev ? Object.keys(prev._working || {}) : []);
  D._working = Object.fromEntries(w.map(a => [a, 1]));
  $("nWork").textContent = w.length;
