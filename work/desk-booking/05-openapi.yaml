        officeName:
          type: string
          description: Office name.
          maxLength: 100
        date:
          type: string
          description: Tomorrow, office-local.
          format: date
        freeDesks:
          type: integer
          description: Free desks for a full day.
          minimum: 0
        bookableDesks:
          type: integer
          description: Desks that can be booked tomorrow (not blocked out, not reserved for others, not retired), the 'of M' in '40 of 57 desks free'.
          minimum: 0
