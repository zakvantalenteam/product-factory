openapi: 3.1.0
info:
  title: DeskBook API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: 'Desk booking for 3,000 employees. Contract for the 45 MVP operations plus the base endpoints DeskBook uses.
    Rules: errors are RFC 9457 problem details; updates need If-Match with the version; actions are POST /<resource>/{id}/<action>
    (D4, ADR-9); dates are office-local (`date`) and instants are UTC (`date-time`); every request accepts and returns X-Request-Id.
    All DeskBook paths are below /api/v1 (path prefix, as the base theme paths already are); servers.url /deskbook is the context path. R1, R2 and Later operations are listed in 05-api-notes.md only. A write body (POST, PUT, PATCH) over 16 KB is refused
    with 400 PAYLOAD_TOO_LARGE (problem details); the contract has no 413 (Q209). Calls that spend a per-person limit answer
    429 RATE_LIMITED with Retry-After and retryAfter (see 05-api-notes.md, Changes after S7 fixes).'
servers:
- url: /deskbook
  description: Behind the approuter (context path /deskbook).
security:
- bearerAuth: []
tags:
- name: office
  description: Offices, floors, zones, desks, desk features, closed days and office settings (module office, admin).
- name: booking
  description: Finding free desks, booking, my bookings, Today and the company booking rules (module booking).
- name: checkin
  description: Check-in and the running-late hold (module checkin).
- name: access
  description: The signed-in person's roles and profile readiness (module access).
- name: reports
  description: Occupancy counts for Facilities (module reports).
- name: base
  description: 'Endpoints of the base product that DeskBook uses: session, i18n, integrations, theme, health.'
paths:
  /api/v1/offices:
    get:
      operationId: listOffices
      tags:
      - office
      summary: List offices
      description: Facilities admin list of all offices (S10), any state.
      x-roles: &id001
      - ADMIN
      x-release: MVP
      x-stories:
      - ST-OS-1
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - name: state
        in: query
        required: false
        description: Filter by state.
        schema:
          type: string
          description: Office state.
          enum:
          - DRAFT
          - OPEN
          - CLOSED
      - name: q
        in: query
        required: false
        description: Free text search.
        schema:
          type: string
          description: Part of the office name or city.
          maxLength: 100
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - name: sort
        in: query
        required: false
        description: Sort order. An unknown field or direction is 400 VALIDATION_ERROR with the field code INVALID_SORT on the field sort.
        schema:
          type: string
          description: 'Field and direction, for example name,asc. Fields: name, city, updatedAt.'
          pattern: ^(name|city|updatedAt),(asc|desc)$
          default: name,asc
          maxLength: 40
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeList'
              examples:
                example:
                  value:
                    items:
                    - id: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a01
                      name: Pune
                      city: Pune
                      timezone: Asia/Kolkata
                      state: OPEN
                      sfLocationCode: PNQ
                      version: 3
                      updatedAt: '2026-10-28T09:12:00Z'
                    page:
                      number: 0
                      size: 20
                      totalElements: 1
                      totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createOffice
      tags:
      - office
      summary: Create an office
      description: Creates an office in state DRAFT with default settings (release 10:00 and 14:00, midday 13:00, Monday to
        Friday).
      x-roles: *id001
      x-release: MVP
      x-stories:
      - ST-OS-1
      - ST-OS-7
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeCreate'
            examples:
              example:
                value:
                  name: Pune
                  city: Pune
                  timezone: Asia/Kolkata
                  sfLocationCode: PNQ
      responses:
        '201':
          description: Created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: URI of the created record.
              schema:
                type: string
                description: Relative URI.
                format: uri-reference
                maxLength: 300
                examples:
                - /deskbook/api/v1/offices/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Office'
              examples:
                example:
                  value:
                    id: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a01
                    name: Pune
                    city: Pune
                    timezone: Asia/Kolkata
                    state: DRAFT
                    sfLocationCode: PNQ
                    settings: &id002
                      morningReleaseTime: '10:00'
                      afternoonReleaseTime: '14:00'
                      middayTime: '13:00'
                      workingDays: &id006
                      - MONDAY
                      - TUESDAY
                      - WEDNESDAY
                      - THURSDAY
                      - FRIDAY
                      settingsEffectiveFrom: '2026-10-29'
                    allowedActions:
                    - OPEN
                    version: 0
                    updatedAt: '2026-10-28T09:12:00Z'
                    updatedBy: u-100234
        '400':
          description: 'VALIDATION_ERROR: One or more fields are invalid.; INVALID_TIMEZONE: The timezone is not an IANA timezone
            id.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    type: https://deskbook.example/problems/validation-error
                    title: Validation failed
                    status: 400
                    detail: One or more fields are invalid.
                    instance: /deskbook/api/v1/bookings
                    code: VALIDATION_ERROR
                    traceId: req-7f3a91c2
                    errors: &id004
                    - field: name
                      code: REQUIRED
                      message: must not be blank
                INVALID_TIMEZONE:
                  summary: INVALID_TIMEZONE
                  value:
                    type: https://deskbook.example/problems/invalid-timezone
                    title: Invalid timezone
                    status: 400
                    detail: The timezone is not an IANA timezone id.
                    instance: /deskbook/api/v1/bookings
                    code: INVALID_TIMEZONE
                    traceId: req-7f3a91c2
                    errors: &id005
                    - field: timezone
                      code: INVALID_TIMEZONE
                      message: not an IANA timezone id
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'OFFICE_NAME_TAKEN: An office with this name already exists.; DUPLICATE: The SuccessFactors location code is already used by another office.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                OFFICE_NAME_TAKEN:
                  summary: OFFICE_NAME_TAKEN
                  value:
                    type: https://deskbook.example/problems/office-name-taken
                    title: Office name taken
                    status: 409
                    detail: An office with this name already exists.
                    instance: /deskbook/api/v1/bookings
                    code: OFFICE_NAME_TAKEN
                    traceId: req-7f3a91c2
                DUPLICATE:
                  summary: DUPLICATE
                  value:
                    type: https://deskbook.example/problems/duplicate
                    title: Already exists
                    status: 409
                    detail: A record with this value already exists.
                    instance: /deskbook/api/v1/bookings
                    code: DUPLICATE
                    traceId: req-7f3a91c2
                    errors:
                    - field: sfLocationCode
                      code: DUPLICATE
                      message: already used by another office
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/offices/{officeId}:
    get:
      operationId: getOffice
      tags:
      - office
      summary: Get an office
      description: One office with its settings (S11).
      x-roles: *id001
      x-release: MVP
      x-stories:
      - ST-OS-1
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/path_officeId'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Office'
              examples:
                example:
                  value: &id003
                    id: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a01
                    name: Pune
                    city: Pune
                    timezone: Asia/Kolkata
                    state: OPEN
                    sfLocationCode: PNQ
                    settings: *id002
                    allowedActions:
                    - CLOSE
                    version: 3
                    updatedAt: '2026-10-28T09:12:00Z'
                    updatedBy: u-100234
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateOffice
      tags:
      - office
      summary: Replace office master data
      description: Changes name, city, timezone and SuccessFactors location code. Needs If-Match. A timezone change is refused while future bookings exist (422 HAS_FUTURE_BOOKINGS with the count; ADR-3).
      x-roles: *id001
      x-release: MVP
      x-stories:
      - ST-OS-1
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/path_officeId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeUpdate'
            examples:
              example:
                value:
                  name: Pune
                  city: Pune
                  timezone: Asia/Kolkata
                  sfLocationCode: PNQ
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Office'
              examples:
                example:
                  value: *id003
        '400':
          description: 'VALIDATION_ERROR: One or more fields are invalid.; IF_MATCH_REQUIRED: Send the record version in the
            If-Match header.; INVALID_TIMEZONE: The timezone is not an IANA timezone id.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                VALIDATION_ERROR:
                  summary: VALIDATION_ERROR
                  value:
                    type: https://deskbook.example/problems/validation-error
                    title: Validation failed
                    status: 400
                    detail: One or more fields are invalid.
                    instance: /deskbook/api/v1/bookings
                    code: VALIDATION_ERROR
                    traceId: req-7f3a91c2
                    errors: *id004
                IF_MATCH_REQUIRED:
                  summary: IF_MATCH_REQUIRED
                  value:
                    type: https://deskbook.example/problems/if-match-required
                    title: If-Match header missing
                    status: 400
                    detail: Send the record version in the If-Match header.
                    instance: /deskbook/api/v1/bookings
                    code: IF_MATCH_REQUIRED
                    traceId: req-7f3a91c2
                INVALID_TIMEZONE:
                  summary: INVALID_TIMEZONE
                  value:
                    type: https://deskbook.example/problems/invalid-timezone
                    title: Invalid timezone
                    status: 400
                    detail: The timezone is not an IANA timezone id.
                    instance: /deskbook/api/v1/bookings
                    code: INVALID_TIMEZONE
                    traceId: req-7f3a91c2
                    errors: *id005
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'CONCURRENT_UPDATE: The record changed since you loaded it. Reload and try again.; OFFICE_NAME_TAKEN:
            An office with this name already exists.; DUPLICATE: The SuccessFactors location code is already used by another office.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CONCURRENT_UPDATE:
                  summary: CONCURRENT_UPDATE
                  value:
                    type: https://deskbook.example/problems/concurrent-update
                    title: Changed by someone else
                    status: 409
                    detail: The record changed since you loaded it. Reload and try again.
                    instance: /deskbook/api/v1/bookings
                    code: CONCURRENT_UPDATE
                    traceId: req-7f3a91c2
                OFFICE_NAME_TAKEN:
                  summary: OFFICE_NAME_TAKEN
                  value:
                    type: https://deskbook.example/problems/office-name-taken
                    title: Office name taken
                    status: 409
                    detail: An office with this name already exists.
                    instance: /deskbook/api/v1/bookings
                    code: OFFICE_NAME_TAKEN
                    traceId: req-7f3a91c2
                DUPLICATE:
                  summary: DUPLICATE
                  value:
                    type: https://deskbook.example/problems/duplicate
                    title: Already exists
                    status: 409
                    detail: A record with this value already exists.
                    instance: /deskbook/api/v1/bookings
                    code: DUPLICATE
                    traceId: req-7f3a91c2
                    errors:
                    - field: sfLocationCode
                      code: DUPLICATE
                      message: already used by another office
        '422':
          description: 'HAS_FUTURE_BOOKINGS: Future bookings block this change.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                HAS_FUTURE_BOOKINGS:
                  summary: HAS_FUTURE_BOOKINGS
                  value:
                    type: https://deskbook.example/problems/has-future-bookings
                    title: Future bookings exist
                    status: 422
                    detail: Future bookings block this change.
                    instance: /deskbook/api/v1/bookings
                    code: HAS_FUTURE_BOOKINGS
                    traceId: req-7f3a91c2
                    count: 2
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/offices/{officeId}/history:
    get:
      operationId: getOfficeHistory
      tags:
      - office
      summary: Get office history
      description: Who changed what, newest first (base audit).
      x-roles: *id001
      x-release: MVP
      x-stories:
      - ST-OS-1
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/path_officeId'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              examples:
                example:
                  value:
                    items:
                    - &id011
                      changeId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a08
                      action: UPDATE
                      entityVersion: 3
                      changedAt: '2026-10-28T09:12:00Z'
                      changedBy: u-100234
                      requestId: req-7f3a91c2
                      fields:
                      - field: name
                        labelKey: office.fields.name
                        oldValue: Pune office
                        newValue: Pune
                    page:
                      number: 0
                      size: 20
                      totalElements: 1
                      totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/offices/{officeId}/open:
    post:
      operationId: openOffice
      tags:
      - office
      summary: Open an office for booking
      description: DRAFT to OPEN. CLOSED is final (D6 item 4, Q84, Q139) and answers 422 INVALID_STATE_TRANSITION.
      x-roles: *id001
      x-release: MVP
      x-stories:
      - ST-OS-2
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/path_officeId'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Office'
              examples:
                example:
                  value: *id003
        '400':
          description: 'IF_MATCH_REQUIRED: Send the record version in the If-Match header.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                IF_MATCH_REQUIRED:
                  summary: IF_MATCH_REQUIRED
                  value:
                    type: https://deskbook.example/problems/if-match-required
                    title: If-Match header missing
                    status: 400
                    detail: Send the record version in the If-Match header.
                    instance: /deskbook/api/v1/bookings
                    code: IF_MATCH_REQUIRED
                    traceId: req-7f3a91c2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'CONCURRENT_UPDATE: The record changed since you loaded it. Reload and try again.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CONCURRENT_UPDATE:
                  summary: CONCURRENT_UPDATE
                  value:
                    type: https://deskbook.example/problems/concurrent-update
                    title: Changed by someone else
                    status: 409
                    detail: The record changed since you loaded it. Reload and try again.
                    instance: /deskbook/api/v1/bookings
                    code: CONCURRENT_UPDATE
                    traceId: req-7f3a91c2
        '422':
          description: 'INVALID_STATE_TRANSITION: The record is not in a state that allows this action.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_STATE_TRANSITION:
                  summary: INVALID_STATE_TRANSITION
                  value:
                    type: https://deskbook.example/problems/invalid-state-transition
                    title: Invalid state change
                    status: 422
                    detail: The record is not in a state that allows this action.
                    instance: /deskbook/api/v1/bookings
                    code: INVALID_STATE_TRANSITION
                    traceId: req-7f3a91c2
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/offices/{officeId}/close:
    post:
      operationId: closeOffice
      tags:
      - office
      summary: Close an office
      description: OPEN to CLOSED. Refused while future bookings exist (MVP; R1 turns it into confirm-and-cancel).
      x-roles: *id001
      x-release: MVP
      x-stories:
      - ST-OS-2
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/path_officeId'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Office'
              examples:
                example:
                  value:
                    id: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a01
                    name: Pune
                    city: Pune
                    timezone: Asia/Kolkata
                    state: CLOSED
                    sfLocationCode: PNQ
                    settings: *id002
                    allowedActions:
                    - OPEN
                    version: 4
                    updatedAt: '2026-10-28T09:12:00Z'
                    updatedBy: u-100234
        '400':
          description: 'IF_MATCH_REQUIRED: Send the record version in the If-Match header.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                IF_MATCH_REQUIRED:
                  summary: IF_MATCH_REQUIRED
                  value:
                    type: https://deskbook.example/problems/if-match-required
                    title: If-Match header missing
                    status: 400
                    detail: Send the record version in the If-Match header.
                    instance: /deskbook/api/v1/bookings
                    code: IF_MATCH_REQUIRED
                    traceId: req-7f3a91c2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'CONCURRENT_UPDATE: The record changed since you loaded it. Reload and try again.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                CONCURRENT_UPDATE:
                  summary: CONCURRENT_UPDATE
                  value:
                    type: https://deskbook.example/problems/concurrent-update
                    title: Changed by someone else
                    status: 409
                    detail: The record changed since you loaded it. Reload and try again.
                    instance: /deskbook/api/v1/bookings
                    code: CONCURRENT_UPDATE
                    traceId: req-7f3a91c2
        '422':
          description: 'INVALID_STATE_TRANSITION: The record is not in a state that allows this action.; HAS_FUTURE_BOOKINGS:
            Future bookings block this change.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                INVALID_STATE_TRANSITION:
                  summary: INVALID_STATE_TRANSITION
                  value:
                    type: https://deskbook.example/problems/invalid-state-transition
                    title: Invalid state change
                    status: 422
                    detail: The record is not in a state that allows this action.
                    instance: /deskbook/api/v1/bookings
                    code: INVALID_STATE_TRANSITION
                    traceId: req-7f3a91c2
                HAS_FUTURE_BOOKINGS:
                  summary: HAS_FUTURE_BOOKINGS
                  value:
                    type: https://deskbook.example/problems/has-future-bookings
                    title: Future bookings exist
                    status: 422
                    detail: Future bookings block this change.
                    instance: /deskbook/api/v1/bookings
                    code: HAS_FUTURE_BOOKINGS
                    traceId: req-7f3a91c2
                    count: 2
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/offices/{officeId}/settings:
    put:
      operationId: updateOfficeSettings
      tags:
      - office
      summary: Replace office settings
      description: Release times, midday and working days. Applies from tomorrow (R10); deadlines of later bookings are recomputed.
      x-roles: *id001
      x-release: MVP
      x-stories:
      - ST-OS-7
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/path_officeId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfficeSettingsUpdate'
            examples:
              example:
                value:
