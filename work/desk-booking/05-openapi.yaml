      - officeName
      - date
      - freeDesks
      - bookableDesks
      additionalProperties: false
    SyncBanner:
      type: object
      description: People-copy health, for admins only.
      properties:
        lastGoodCopyAt:
          type: string
          description: Time of the last good copy; absent if there never was one.
          format: date-time
        daysSinceLastGoodCopy:
          type: integer
          description: Full days since the last good copy.
          minimum: 0
        severity:
          type: string
          description: WARNING after 2 days without a good copy.
          enum:
          - INFO
          - WARNING
      required:
      - daysSinceLastGoodCopy
      - severity
      additionalProperties: false
    TodayView:
      type: object
      description: Read model for the Today screen S1.
      properties:
        asOf:
          type: string
          description: Server time (UTC).
          format: date-time
        timezone:
          type: string
          description: IANA timezone of the home office (Q151). Absent when the person has no home office or it is closed.
          maxLength: 64
          examples:
          - Asia/Kolkata
        today:
          type: string
          description: Today as a date in that timezone (Q151); the S1 and S4 windows start here. Absent with timezone.
          format: date
        bookings:
          type: array
          description: Next bookings, soonest first, at most 3.
          items:
            $ref: '#/components/schemas/Booking'
          maxItems: 3
        releasedToday:
          $ref: '#/components/schemas/ReleasedNote'
        tomorrow:
          $ref: '#/components/schemas/TomorrowFree'
        syncBanner:
          $ref: '#/components/schemas/SyncBanner'
        usualDesk:
          description: 'R1 (ST-BK-16), not filled in the MVP. The most booked desk in the last 60 days; absent when none.'
          $ref: '#/components/schemas/UsualDesk'
        nextTwoWeeks:
          type: array
          description: 'MVP (ST-BK-15, D6, PF-12): the next 14 office-local days from today at the home office, soonest first, for
            the two-week strip. Her own bookings only; bounded; no extra call.'
          minItems: 14
          maxItems: 14
          items:
            $ref: '#/components/schemas/TwoWeekDay'
      required:
      - asOf
      - bookings
      - nextTwoWeeks
      additionalProperties: false
    BookingRules:
      type: object
      description: Company-wide booking rules (ConfigService group DESKBOOK, ADR-11).
      properties:
        horizonDays:
          type: integer
          description: How many days ahead one can book. Default 14.
          minimum: 1
          maximum: 60
        holdMinutes:
          type: integer
          description: A running-late hold keeps the desk until release time plus this many minutes. Default 90.
          minimum: 15
          maximum: 240
        lateCheckInMinutes:
          type: integer
          description: A booking made after the release time must be checked in within this many minutes. Default 30.
          minimum: 5
          maximum: 120
        version:
          type: integer
          description: Version of the rules, read from the counter key DESKBOOK_RULES_VERSION (ConfigService has no row version).
            Send it back in If-Match on update.
          minimum: 0
      required:
      - horizonDays
      - holdMinutes
      - lateCheckInMinutes
      - version
      additionalProperties: false
    BookingRulesUpdate:
      type: object
      description: Full replacement of the booking rules.
      properties:
        horizonDays:
          type: integer
          description: How many days ahead one can book.
          minimum: 1
          maximum: 60
        holdMinutes:
          type: integer
          description: Hold length after release time, minutes.
          minimum: 15
          maximum: 240
        lateCheckInMinutes:
          type: integer
          description: Late check-in window, minutes.
          minimum: 5
          maximum: 120
      required:
      - horizonDays
      - holdMinutes
      - lateCheckInMinutes
      additionalProperties: false
    MyProfile:
      type: object
      description: The signed-in person's DeskBook profile. Carries only the caller.
      properties:
        userId:
          type: string
          description: Sign-in user id (the SuccessFactors user id, Q62).
          maxLength: 100
        displayName:
          type: string
