  /api/v1/reports/occupancy:
    get:
      operationId: getOccupancyReport
      tags:
      - reports
      summary: Get the occupancy report
      description: 'Counts per office, floor and office-local day, plus dayTotals (per office and day across all floors, computed on the server, Q152) and totals over the whole filter. Counts only: no ids or names of people (R39). The range is at most 93 days. An unknown officeId, or an office of another tenant, is answered with 400 VALIDATION_ERROR on the field officeId (not 404: the id is a filter value, and the answer does not tell the two cases apart). A to more than 93 days after from is 400 on the field to. A missing from or to is 400 VALIDATION_ERROR with the field code REQUIRED on that field (the parameters are required in this contract; the server answers the 400 itself), and a to before from is the field code BEFORE_FROM on the field to. An invalid sort is the field code INVALID_SORT on the field sort.'
      x-roles: *id001
      x-release: MVP
      x-stories:
      - ST-RP-1
      - ST-RP-2
      - ST-RP-3
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - name: officeId
        in: query
        required: false
        description: 'One office; absent: all offices.'
        schema:
          type: string
          description: Office id.
          format: uuid
      - name: from
        in: query
        required: true
        description: From day.
        schema:
          type: string
          description: First day, office-local.
          format: date
      - name: to
        in: query
        required: true
        description: To day, at most 93 days after from.
        schema:
          type: string
          description: Last day, office-local.
          format: date
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      - name: sort
        in: query
        required: false
        description: Sort order. An unknown field or direction is 400 VALIDATION_ERROR with the field code INVALID_SORT on the field sort.
        schema:
          type: string
          description: 'Field and direction, for example name,asc. Fields: date, office, floor.'
          pattern: ^(date|office|floor),(asc|desc)$
          default: date,asc
          maxLength: 40
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyReport'
              examples:
                example:
                  value:
                    items:
                    - date: '2026-10-26'
                      officeId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a01
                      officeName: Pune
                      floorId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a02
                      floorName: Floor 3
                      capacityDeskDays: 60
                      bookedDeskDays: 42
                      checkedInDeskDays: 35
                      noShowDeskDays: 5
                      releasedAfterHoldDeskDays: 2
                      cancelledBeforeDeadlineDeskDays: 4
                      noShowRate: 0.119
                    dayTotals:
                    - date: '2026-10-26'
                      officeId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a01
                      officeName: Pune
                      capacityDeskDays: 60
                      bookedDeskDays: 42
                      checkedInDeskDays: 35
                      noShowDeskDays: 5
                      releasedAfterHoldDeskDays: 2
                      cancelledBeforeDeadlineDeskDays: 4
                      noShowRate: 0.119
                    page:
                      number: 0
                      size: 20
                      totalElements: 1
                      totalPages: 1
                    totals:
                      capacityDeskDays: 60
                      bookedDeskDays: 42
                      checkedInDeskDays: 35
                      noShowDeskDays: 5
                      releasedAfterHoldDeskDays: 2
                      cancelledBeforeDeadlineDeskDays: 4
                      noShowRate: 0.119
        '400':
          description: 'Validation failed (VALIDATION_ERROR): officeId unknown or of another tenant (field officeId, code NOT_FOUND), or a range over 93 days (field to, code RANGE_TOO_LONG).'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                OFFICE_UNKNOWN:
                  summary: OFFICE_UNKNOWN
                  value:
                    type: https://deskbook.example/problems/validation-error
                    title: Validation failed
                    status: 400
                    detail: One or more fields are invalid.
                    instance: /deskbook/api/v1/reports/occupancy
                    code: VALIDATION_ERROR
                    traceId: req-7f3a91c2
                    errors:
                    - field: officeId
                      code: NOT_FOUND
                      message: The office does not exist
                RANGE_TOO_LONG:
                  summary: RANGE_TOO_LONG
                  value:
                    type: https://deskbook.example/problems/validation-error
                    title: Validation failed
                    status: 400
                    detail: One or more fields are invalid.
                    instance: /deskbook/api/v1/reports/occupancy
                    code: VALIDATION_ERROR
                    traceId: req-7f3a91c2
                    errors:
                    - field: to
                      code: RANGE_TOO_LONG
                      message: The range is at most 93 days
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
