  /api/v1/reports/occupancy/grid:
    get:
      operationId: getOccupancyGrid
      tags:
      - reports
      summary: Get the occupancy grid by zone and day
      description: 'Heat grid for one office (D5, ADR-12): one cell per zone and office-local day with capacity, booked, checked
        in, no-show and upcoming desk-days, grouped by the current zone of the desk. Counts only: no ids or names of people
        (R39). Small-cell rule (D2): a zone with fewer than 3 desks, or holding a reserved desk, is not shown on its own; its desks
        are merged into one row for the floor (zone id and name absent, merged true), so a cell never shows one person''s attendance.
        The range is at most 31 days. Not paged: zones x days is bounded by the office size and the 31-day cap.'
      x-roles: *id001
      x-release: R1
      x-stories:
      - ST-RP-1
      - ST-RP-10
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - name: officeId
        in: query
        required: true
        description: The office to show.
        schema:
          type: string
          description: Office id.
          format: uuid
      - name: from
        in: query
        required: true
        description: From day.
        schema:
          type: string
          description: First day, office-local.
          format: date
      - name: to
        in: query
        required: true
        description: To day, at most 31 days after from.
        schema:
          type: string
          description: Last day, office-local.
          format: date
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyGrid'
              examples:
                example:
                  value:
                    zones:
                    - id: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a10
                      name: 3rd floor east
                      floorName: Floor 3
                    - id: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a11
                      name: 3rd floor west
                      floorName: Floor 3
                    - floorName: Floor 4
                      merged: true
                    days:
                    - '2026-10-26'
                    - '2026-10-27'
                    cells:
                    - zoneId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a10
                      date: '2026-10-26'
                      capacity: 30
                      booked: 24
                      checkedIn: 20
                      noShow: 3
                      upcoming: 0
                    - zoneId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a10
                      date: '2026-10-27'
                      capacity: 30
                      booked: 18
                      checkedIn: 0
                      noShow: 0
                      upcoming: 18
                    - zoneId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a11
                      date: '2026-10-26'
                      capacity: 30
                      booked: 18
                      checkedIn: 15
                      noShow: 2
                      upcoming: 0
                    - zoneId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a11
                      date: '2026-10-27'
                      capacity: 30
                      booked: 12
                      checkedIn: 0
                      noShow: 0
                      upcoming: 12
                    - floorName: Floor 4
                      merged: true
                      date: '2026-10-26'
                      capacity: 9
                      booked: 6
                      checkedIn: 5
                      noShow: 1
                      upcoming: 0
                    - floorName: Floor 4
                      merged: true
                      date: '2026-10-27'
                      capacity: 9
                      booked: 4
                      checkedIn: 0
                      noShow: 0
                      upcoming: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
