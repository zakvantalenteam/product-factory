          items:
            $ref: '#/components/schemas/OccupancyDayTotal'
          maxItems: 100
        page: *id026
        totals:
          $ref: '#/components/schemas/OccupancyTotals'
      required:
      - items
      - dayTotals
      - page
      - totals
      additionalProperties: false
    OccupancyGridZone:
      type: object
      description: One row of the grid, a zone or, by the small-cell rule, the merged row of a floor.
      properties:
        id:
          type: string
          description: Zone id; absent on a merged floor row.
          format: uuid
        name:
          type: string
          description: Zone name; absent on a merged floor row.
          maxLength: 100
        floorName:
          type: string
          description: Floor name.
          maxLength: 100
        merged:
          type: boolean
          description: True for the merged floor row (zones under 3 desks or holding a reserved desk); absent otherwise. The
            row is identified by floorName.
      required:
      - floorName
      additionalProperties: false
    OccupancyGridCell:
      type: object
      description: Desk-day counts for one zone and day. A half day counts 0.5 (R40).
      properties:
        zoneId:
          type: string
          description: Zone id; absent in a merged floor row.
          format: uuid
        floorName:
          type: string
          description: Floor name; present only in a merged floor row, which it identifies.
          maxLength: 100
        merged:
          type: boolean
          description: True for a merged floor row; absent otherwise.
        date:
          type: string
          description: Office-local day.
          format: date
        capacity:
          type: number
          description: Bookable desks that day, retired and blocked out.
          minimum: 0
          multipleOf: 0.5
        booked:
          type: number
          description: Booked desk-days, cancelled before the deadline excluded (R41).
          minimum: 0
          multipleOf: 0.5
        checkedIn:
          type: number
          description: Checked-in desk-days (the solid part of the cell).
          minimum: 0
          multipleOf: 0.5
        noShow:
          type: number
          description: No-show desk-days.
          minimum: 0
          multipleOf: 0.5
        upcoming:
          type: number
          description: Booked desk-days still to come, not yet checked in or released (the dashed part of the cell).
          minimum: 0
          multipleOf: 0.5
      required:
      - date
      - capacity
      - booked
      - checkedIn
      - noShow
      - upcoming
      additionalProperties: false
    OccupancyGrid:
      type: object
      description: 'Occupancy of one office by zone and day. Counts only: no ids or names of people (R39). A cell exists
