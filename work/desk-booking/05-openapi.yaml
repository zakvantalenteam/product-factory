      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/size'
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPage'
              examples:
                example:
                  value:
                    items:
                    - *id011
                    page:
                      number: 0
                      size: 20
                      totalElements: 1
                      totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/public/health:
    get:
      operationId: getHealth
      tags:
      - base
      summary: Health check
      description: No sign-in needed (B1.10).
      x-roles:
      - ANY
      x-release: MVP
      x-stories:
      - B1.10
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      security: []
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                example:
                  value:
                    status: UP
                    service: DeskBook
                    timestamp: '2026-10-28T09:20:00Z'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'XSUAA token forwarded by the approuter after company sign-in. The browser holds only the approuter session
        cookie. Roles come from x-roles on each operation: EMPLOYEE (any signed-in user with the app role; managers and admins
        are also employees), MANAGER (R1), ADMIN (base admin, ADR-7).'
  headers:
    XRequestId:
      description: Correlation id of the request.
      schema:
        type: string
        description: Request id.
        maxLength: 100
        examples:
        - req-7f3a91c2
    RetryAfter:
      description: Seconds to wait before the next try (RATE_LIMITED); the same number is in the retryAfter member of the problem.
      schema:
        type: integer
        description: Seconds.
        minimum: 1
        maximum: 3600
    ETag:
      description: SHA-256 of the image.
      schema:
        type: string
        description: Entity tag.
        maxLength: 100
  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation id. Accepted and returned; logs carry it.
      schema:
        type: string
        description: Request id.
        maxLength: 100
        examples:
        - req-7f3a91c2
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Version of the record you loaded (the version field). A mismatch gives 409.
      schema:
        type: string
        description: Record version.
        pattern: ^"?[0-9]+"?$
        maxLength: 20
        examples:
        - '3'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Client-made unique key, 1 to 64 characters of letters, digits, underscore and hyphen (a UUID fits). A repeat
        with the same key and body returns the first result; a different body gives 422. Any other character (a colon too)
        or a longer key is refused with 400 VALIDATION_ERROR, field code INVALID_FORMAT. The batch call builds its own per-day
        keys from this key on the server.'
      schema:
        type: string
        description: Unique key per user action.
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]{1,64}$
        examples:
        - 5c2f0a9e-3b7d-4c1e-8a64-0f9d2b7e1a33
    page:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema:
        type: integer
        description: Page number.
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      required: false
      description: Page size, at most 100.
      schema:
        type: integer
        description: Page size.
        minimum: 1
        maximum: 100
        default: 20
    path_officeId:
      name: officeId
      in: path
      required: true
      description: Office id.
      schema:
        type: string
        description: Office id.
        format: uuid
    path_floorId:
      name: floorId
      in: path
      required: true
      description: Floor id.
      schema:
        type: string
        description: Floor id.
        format: uuid
    path_zoneId:
      name: zoneId
      in: path
      required: true
      description: Zone id.
      schema:
        type: string
        description: Zone id.
        format: uuid
    path_deskId:
      name: deskId
      in: path
      required: true
      description: Desk id.
      schema:
        type: string
        description: Desk id.
        format: uuid
    path_bookingId:
      name: bookingId
      in: path
      required: true
      description: Booking id.
      schema:
        type: string
        description: Booking id.
        format: uuid
    path_featureId:
      name: featureId
      in: path
      required: true
      description: Desk feature id.
      schema:
        type: string
        description: Desk feature id.
        format: uuid
    path_closedDayId:
      name: closedDayId
      in: path
      required: true
      description: Closed day id.
      schema:
        type: string
        description: Closed day id.
        format: uuid
  responses:
    BadRequest:
      description: Validation failed (VALIDATION_ERROR).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            VALIDATION_ERROR:
              summary: VALIDATION_ERROR
              value:
                type: https://deskbook.example/problems/validation-error
                title: Validation failed
                status: 400
                detail: One or more fields are invalid.
                instance: /deskbook/api/v1/bookings
                code: VALIDATION_ERROR
                traceId: req-7f3a91c2
                errors: *id004
    Unauthorized:
      description: 'Not signed in. The app guard answers with this problem (code UNAUTHORIZED). A 401 raised earlier by the platform
        filter (TTCommon) before the request reaches the app has no problem body, so clients decide on the status 401 and
        not on the body.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            UNAUTHORIZED:
              summary: UNAUTHORIZED
              value:
                type: https://deskbook.example/problems/unauthorized
                title: Not signed in
                status: 401
                detail: Sign in to continue.
                instance: /deskbook/api/v1/bookings
                code: UNAUTHORIZED
                traceId: req-7f3a91c2
    Forbidden:
      description: Signed in but not allowed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            FORBIDDEN:
              summary: FORBIDDEN
              value:
                type: https://deskbook.example/problems/forbidden
                title: Not allowed
                status: 403
                detail: Your role does not allow this operation.
                instance: /deskbook/api/v1/bookings
                code: FORBIDDEN
                traceId: req-7f3a91c2
    NotFound:
      description: Not found, or exists but is not the caller's.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            RESOURCE_NOT_FOUND:
              summary: RESOURCE_NOT_FOUND
              value:
                type: https://deskbook.example/problems/resource-not-found
                title: Not found
                status: 404
                detail: The record does not exist or is not yours.
                instance: /deskbook/api/v1/bookings
                code: RESOURCE_NOT_FOUND
                traceId: req-7f3a91c2
    TooManyRequests:
      description: 'RATE_LIMITED: Rate limit reached for this person and this call in the last minute. Retry-After header and
        the retryAfter member of the problem both give the seconds to wait. A refused call counts nothing and changes nothing.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            RATE_LIMITED:
              summary: RATE_LIMITED
              value:
                type: https://deskbook.example/problems/rate-limited
                title: Too many requests
                status: 429
                detail: Slow down and try again.
                instance: /deskbook/api/v1/bookings
                code: RATE_LIMITED
                traceId: req-7f3a91c2
                retryAfter: 30
    InternalError:
      description: Unexpected error; no internals in the body.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            INTERNAL_ERROR:
              summary: INTERNAL_ERROR
              value:
                type: https://deskbook.example/problems/internal-error
                title: Unexpected error
                status: 500
                detail: An unexpected error occurred.
                instance: /deskbook/api/v1/bookings
                code: INTERNAL_ERROR
                traceId: req-7f3a91c2
    EnvelopeError:
      description: Failure of a base shell call (ApiResponse envelope, B9.3).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnvelopeFailure'
          examples:
            forbidden:
              value:
                success: false
                message: Not allowed
                error:
                  code: FORBIDDEN
                  detail: Only administrators can manage integration configuration
                  requestId: req-7f3a91c2
  schemas:
    Page:
      type: object
      description: Paging block of a list answer.
      properties:
        number:
          type: integer
          description: Zero-based page number.
          minimum: 0
        size:
          type: integer
          description: Page size used.
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          description: Rows over all pages.
          minimum: 0
        totalPages:
          type: integer
          description: Number of pages.
          minimum: 0
      required:
      - number
      - size
      - totalElements
      - totalPages
      additionalProperties: false
    FieldError:
      type: object
      description: One field that failed validation.
      properties:
        field:
          type: string
          description: Name of the field in the request.
          maxLength: 100
        code:
          type: string
          description: Stable machine code of the field error.
          maxLength: 60
        message:
          type: string
          description: Short English text for logs; the SPA maps the code to its own label.
          maxLength: 300
      required:
      - field
      - code
      - message
      additionalProperties: false
    Problem:
      type: object
      description: RFC 9457 problem details. Every error of the /api/v1 operations has this shape.
      properties:
        type:
          type: string
          description: URI that names the problem type.
          format: uri-reference
          maxLength: 200
        title:
          type: string
          description: Short summary of the problem type.
          maxLength: 200
        status:
          type: integer
          description: HTTP status code.
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Explanation for this occurrence. Never contains internals.
          maxLength: 500
        instance:
          type: string
          description: Path of the request.
          maxLength: 300
        code:
          type: string
          description: Stable machine code, UPPER_SNAKE. The SPA maps every code to a message and a next step.
          maxLength: 60
        traceId:
          type: string
          description: Request id (X-Request-Id) for support.
          maxLength: 100
        errors:
          type: array
          description: Field errors of a validation failure.
          items:
            $ref: '#/components/schemas/FieldError'
          maxItems: 100
        currentStatus:
          type: string
          description: 'BOOKING_STATE_CHANGED: the real status of the booking now.'
          enum: *id016
        existingBookingId:
          type: string
          description: 'ALREADY_BOOKED_THAT_DAY: the booking the person already has that day.'
          format: uuid
        reason:
          type: string
          description: 'DATE_NOT_BOOKABLE: why the day or part cannot be booked.'
          enum:
          - PAST
          - NON_WORKING_DAY
          - CLOSED_DAY
          - BEYOND_HORIZON
          - PART_ENDED
        lastCopyAt:
          type: string
          description: 'PROFILE_NOT_READY: when the last good people copy was made.'
          format: date-time
        opensAt:
          type: string
          description: 'CHECK_IN_NOT_OPEN: when check-in opens (UTC).'
          format: date-time
        retryAfter:
          type: integer
          description: 'RATE_LIMITED: seconds to wait before the next try; the same number as the Retry-After header.'
          minimum: 1
          maximum: 3600
        count:
          type: integer
          description: 'HAS_FUTURE_BOOKINGS: number of future bookings that block the change.'
          minimum: 0
        deadline:
          type: string
          description: 'HOLD_ALREADY_USED, DEADLINE_PASSED: the current check-in deadline (UTC); the SPA shows it in the office timezone.'
          format: date-time
      required:
      - type
      - title
      - status
      - code
      additionalProperties: true
    OfficeSettings:
      type: object
      description: Booking times and working days of an office.
      properties:
        morningReleaseTime:
          type: string
          description: Release time of morning and full-day bookings, office time. Default 10:00.
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          examples:
          - '10:00'
        afternoonReleaseTime:
          type: string
          description: Release time of afternoon bookings, office time. Default 14:00. Later than the morning time and not
            earlier than midday.
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          examples:
          - '10:00'
        middayTime:
          type: string
          description: Split between morning and afternoon, office time. Default 13:00.
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          examples:
          - '10:00'
        workingDays:
          type: array
          description: Days the office can be booked. Default Monday to Friday.
          items:
            type: string
            description: Day of the week.
            enum: &id017
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
          minItems: 1
          maxItems: 7
          uniqueItems: true
        settingsEffectiveFrom:
          type: string
          description: Office-local date from which these values apply (a change applies from tomorrow, R10).
          format: date
      required:
      - morningReleaseTime
      - afternoonReleaseTime
      - middayTime
      - workingDays
      additionalProperties: false
    OfficeSettingsUpdate:
      type: object
      description: Full replacement of the office settings.
      properties:
        morningReleaseTime:
          type: string
          description: Release time of morning and full-day bookings, office time. Default 10:00.
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          examples:
          - '10:00'
        afternoonReleaseTime:
          type: string
          description: Release time of afternoon bookings, office time. Default 14:00. Later than the morning time and not
            earlier than midday.
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          examples:
          - '10:00'
        middayTime:
          type: string
          description: Split between morning and afternoon, office time. Default 13:00.
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          examples:
          - '10:00'
        workingDays:
          type: array
          description: Days the office can be booked. Default Monday to Friday.
          items:
            type: string
            description: Day of the week.
            enum: *id017
          minItems: 1
          maxItems: 7
          uniqueItems: true
      required:
      - morningReleaseTime
      - afternoonReleaseTime
      - middayTime
      - workingDays
      additionalProperties: false
    Office:
      type: object
      description: An office with its settings.
      properties:
        id:
          type: string
          description: Office id.
          format: uuid
        name: &id018
          type: string
          description: Office name, unique ignoring upper and lower case.
          minLength: 1
          maxLength: 100
        city: &id019
          type: string
          description: City of the office.
          minLength: 1
          maxLength: 100
        timezone: &id020
          type: string
          description: IANA timezone id, chosen from a list.
          minLength: 1
          maxLength: 64
        state:
          type: string
          description: DRAFT is not bookable, OPEN is bookable, CLOSED is hidden from booking.
          enum:
          - DRAFT
          - OPEN
          - CLOSED
        sfLocationCode: &id021
          type: string
          description: Optional SuccessFactors location code that maps people to this office (Q63).
          maxLength: 50
        settings:
          $ref: '#/components/schemas/OfficeSettings'
        allowedActions:
          type: array
          description: State actions allowed now.
          items:
            type: string
            description: Action the admin may take now.
            enum:
            - OPEN
            - CLOSE
          maxItems: 2
        version: &id022
          type: integer
          description: Version of the record. Send it back in If-Match on update.
          minimum: 0
        updatedAt: &id023
          type: string
          description: When the record was last changed (UTC).
          format: date-time
        updatedBy: &id024
          type: string
          description: User id of the person who last changed the record.
          maxLength: 100
      required:
      - id
      - name
      - city
      - timezone
      - state
      - settings
      - allowedActions
      - version
      additionalProperties: false
    OfficeSummary:
      type: object
      description: An office as shown in the list.
      properties:
        id:
          type: string
          description: Office id.
          format: uuid
        name: *id018
        city: *id019
        timezone: *id020
        state:
          type: string
          description: Office state.
          enum:
          - DRAFT
          - OPEN
          - CLOSED
        sfLocationCode: *id021
        floorCount:
          type: integer
          description: Active floors of the office (Q145). Optional; absent when not counted.
          minimum: 0
        deskCount:
          type: integer
          description: Active desks on active floors of the office (Q145). Optional; absent when not counted.
          minimum: 0
        version: *id022
        updatedAt: *id023
      required:
      - id
      - name
      - city
      - timezone
      - state
      - version
      additionalProperties: false
    OfficeCreate:
      type: object
      description: A new office. Settings start with the defaults (AC3.1).
      properties:
        name: *id018
        city: *id019
        timezone: *id020
        sfLocationCode: *id021
      required:
      - name
      - city
      - timezone
      additionalProperties: false
    OfficeUpdate:
      type: object
      description: Full replacement of the office master data. Settings and state have their own operations.
      properties:
        name: *id018
        city: *id019
        timezone: *id020
        sfLocationCode: *id021
      required:
      - name
      - city
      - timezone
      additionalProperties: false
    OfficeList:
      type: object
      description: A page of offices.
      properties:
        items:
          type: array
          description: Rows of this page.
          items:
            $ref: '#/components/schemas/OfficeSummary'
          maxItems: 100
        page: &id026
          $ref: '#/components/schemas/Page'
      required:
      - items
      - page
      additionalProperties: false
    Floor:
      type: object
      description: A floor of an office.
      properties:
        id:
          type: string
          description: Floor id.
          format: uuid
        officeId:
          type: string
          description: Office the floor belongs to.
          format: uuid
        name: &id025
          type: string
          description: Floor name, unique within the office.
          minLength: 1
          maxLength: 100
        status:
          type: string
          description: ACTIVE floors are bookable, RETIRED floors are hidden from booking.
          enum:
          - ACTIVE
          - RETIRED
        version: *id022
        updatedAt: *id023
        updatedBy: *id024
      required:
      - id
      - officeId
      - name
      - status
      - version
      additionalProperties: false
    FloorCreate:
      type: object
      description: A new floor. A default zone Main is created with it.
      properties:
        name: *id025
      required:
      - name
      additionalProperties: false
    FloorUpdate:
      type: object
      description: Full replacement of a floor.
      properties:
        name: *id025
      required:
      - name
      additionalProperties: false
    FloorList:
      type: object
      description: A page of floors.
      properties:
        items:
          type: array
          description: Rows of this page.
          items:
            $ref: '#/components/schemas/Floor'
          maxItems: 100
        page: *id026
      required:
      - items
      - page
      additionalProperties: false
    Zone:
      type: object
      description: A zone of a floor. Group booking (R2) uses zones.
      properties:
        id:
          type: string
          description: Zone id.
          format: uuid
        floorId:
          type: string
          description: Floor the zone belongs to.
          format: uuid
        name: &id027
          type: string
          description: Zone name, unique within the floor.
          minLength: 1
          maxLength: 100
        deskCount:
          type: integer
          description: Number of desks in the zone.
          minimum: 0
        version: *id022
      required:
      - id
      - floorId
      - name
      - deskCount
      - version
      additionalProperties: false
    ZoneCreate:
      type: object
      description: A new zone.
      properties:
        name: *id027
      required:
      - name
      additionalProperties: false
    ZoneRename:
      type: object
      description: New name of a zone.
      properties:
        name: *id027
      required:
      - name
      additionalProperties: false
    ZoneList:
      type: object
      description: A page of zones.
      properties:
        items:
          type: array
          description: Rows of this page.
          items:
            $ref: '#/components/schemas/Zone'
          maxItems: 100
        page: *id026
      required:
      - items
      - page
      additionalProperties: false
    DeskFeature:
      type: object
      description: A desk feature such as monitor or standing desk.
      properties:
        id:
          type: string
          description: Feature id.
          format: uuid
        name: &id028
          type: string
          description: Feature name, unique.
          minLength: 1
          maxLength: 60
        version: *id022
      required:
      - id
      - name
      - version
      additionalProperties: false
    DeskFeatureCreate:
      type: object
      description: A new desk feature.
      properties:
        name: *id028
      required:
      - name
      additionalProperties: false
    DeskFeatureList:
      type: object
      description: A page of desk features.
      properties:
        items:
          type: array
          description: Rows of this page.
          items:
            $ref: '#/components/schemas/DeskFeature'
          maxItems: 100
        page: *id026
      required:
      - items
      - page
      additionalProperties: false
    FeatureRef:
      type: object
      description: A feature on a desk.
      properties:
        id:
          type: string
          description: Feature id.
          format: uuid
        name: *id028
      required:
      - id
      - name
      additionalProperties: false
    DeskSummary:
      type: object
      description: A desk as shown in the admin list.
      properties:
        id:
          type: string
          description: Desk id.
          format: uuid
        code: &id029
          type: string
          description: Desk code, printed on the QR code. Unique across all offices; read-only after the first booking.
          pattern: ^[A-Z0-9-]{2,30}$
          minLength: 2
          maxLength: 30
        officeId:
          type: string
          description: Office of the desk.
          format: uuid
        floorId:
          type: string
          description: Floor of the desk.
          format: uuid
        floorName:
          type: string
          description: Floor name.
          maxLength: 100
        zoneId:
          type: string
          description: Zone of the desk.
          format: uuid
        zoneName:
          type: string
          description: Zone name.
          maxLength: 100
        features:
          type: array
          description: Features of the desk.
          items:
            $ref: '#/components/schemas/FeatureRef'
          maxItems: 20
        status:
          type: string
          description: ACTIVE or RETIRED.
          enum:
