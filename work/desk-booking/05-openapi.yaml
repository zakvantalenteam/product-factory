        '422':
          description: 'PROFILE_NOT_READY: Your profile is not ready yet.; EMPLOYEE_INACTIVE: This person is no longer active.
            (A reused Idempotency-Key is not a 422 here: the key is stored per day, so it fails that day as a FAILED outcome
