          - NOT_IN_COPY
          - INACTIVE
        lastCopyAt:
          type: string
          description: Time of the last good people copy; absent if there never was one.
          format: date-time
      required:
      - userId
      - displayName
      - roles
      - profileReady
      additionalProperties: false
    OccupancyRow:
      type: object
      description: 'Counts for one office, floor and office-local day. Desk-days: a half day counts 0.5.'
      properties:
        date:
          type: string
          description: Office-local day.
          format: date
        officeId:
          type: string
          description: Office.
          format: uuid
        officeName:
          type: string
          description: Office name.
          maxLength: 100
        floorId:
          type: string
          description: Floor.
          format: uuid
        floorName:
          type: string
          description: Floor name.
          maxLength: 100
        capacityDeskDays:
          type: number
          description: Bookable desks that day, retired and blocked out.
          minimum: 0
          multipleOf: 0.5
        bookedDeskDays:
          type: number
          description: Bookings not cancelled before the deadline.
          minimum: 0
          multipleOf: 0.5
        checkedInDeskDays:
          type: number
          description: Checked-in or completed bookings.
          minimum: 0
          multipleOf: 0.5
        noShowDeskDays:
          type: number
          description: Bookings released as NO_SHOW.
          minimum: 0
          multipleOf: 0.5
        releasedAfterHoldDeskDays:
          type: number
          description: Bookings released after a hold or late booking; kept apart from no-shows (Q50).
          minimum: 0
          multipleOf: 0.5
        cancelledBeforeDeadlineDeskDays:
          type: number
          description: Bookings cancelled before the deadline.
          minimum: 0
          multipleOf: 0.5
        noShowRate:
          type: number
          description: NO_SHOW divided by bookings not cancelled before the deadline; absent when there are none.
          minimum: 0
          maximum: 1
      required:
      - date
      - officeId
      - officeName
      - floorId
      - floorName
      - capacityDeskDays
      - bookedDeskDays
      - checkedInDeskDays
      - noShowDeskDays
      - releasedAfterHoldDeskDays
      - cancelledBeforeDeadlineDeskDays
      additionalProperties: false
    OccupancyTotals:
      type: object
      description: Totals over all rows of the filter, not only this page.
      properties:
        capacityDeskDays:
          type: number
          description: Total capacity.
          minimum: 0
        bookedDeskDays:
          type: number
          description: Total booked.
          minimum: 0
        checkedInDeskDays:
          type: number
          description: Total checked in.
          minimum: 0
        noShowDeskDays:
          type: number
          description: Total no-shows.
          minimum: 0
        releasedAfterHoldDeskDays:
          type: number
          description: Total released after hold.
          minimum: 0
        cancelledBeforeDeadlineDeskDays:
          type: number
          description: Total cancelled before the deadline.
          minimum: 0
        noShowRate:
          type: number
          description: Overall no-show rate; absent when there are no bookings.
          minimum: 0
          maximum: 1
      required:
      - capacityDeskDays
      - bookedDeskDays
      - checkedInDeskDays
      - noShowDeskDays
      - releasedAfterHoldDeskDays
      - cancelledBeforeDeadlineDeskDays
      additionalProperties: false
    OccupancyDayTotal:
      type: object
      description: 'Q152. Totals of one office and one office-local day across ALL its floors, computed on the server over every
        floor, not only the floors or rows of the loaded page. Same desk-day rules as OccupancyRow.'
      properties:
        date:
          type: string
          description: Office-local day.
          format: date
        officeId:
          type: string
          description: Office.
          format: uuid
        officeName:
          type: string
          description: Office name.
          maxLength: 100
        capacityDeskDays:
          type: number
          description: Bookable desks that day over all floors, retired and blocked out.
          minimum: 0
          multipleOf: 0.5
        bookedDeskDays:
          type: number
          description: Bookings not cancelled before the deadline, all floors.
          minimum: 0
          multipleOf: 0.5
        checkedInDeskDays:
          type: number
          description: Checked-in or completed bookings, all floors.
          minimum: 0
          multipleOf: 0.5
        noShowDeskDays:
          type: number
          description: Bookings released as NO_SHOW, all floors.
          minimum: 0
          multipleOf: 0.5
        releasedAfterHoldDeskDays:
          type: number
          description: Bookings released after a hold or late booking, all floors; kept apart from no-shows (Q50).
          minimum: 0
          multipleOf: 0.5
        cancelledBeforeDeadlineDeskDays:
          type: number
          description: Bookings cancelled before the deadline, all floors.
          minimum: 0
          multipleOf: 0.5
        noShowRate:
          type: number
          description: NO_SHOW divided by bookings not cancelled before the deadline (Q50), computed by the server; absent when there are none.
          minimum: 0
          maximum: 1
      required:
      - date
      - officeId
      - officeName
      - capacityDeskDays
      - bookedDeskDays
      - checkedInDeskDays
      - noShowDeskDays
      - releasedAfterHoldDeskDays
      - cancelledBeforeDeadlineDeskDays
      additionalProperties: false
    OccupancyReport:
      type: object
      description: 'Occupancy per office, floor and day. Counts only: no ids or names of people (R39).'
      properties:
        items:
          type: array
          description: Rows of this page.
          items:
            $ref: '#/components/schemas/OccupancyRow'
          maxItems: 100
        dayTotals:
          type: array
          description: 'Q152. One entry for every office and day that appears in items, with the totals over all floors of that
