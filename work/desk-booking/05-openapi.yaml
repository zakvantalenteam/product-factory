    DeskProposal:
      type: object
      description: The proposal for one day. desk is absent when nothing can be proposed; then noneReason says why.
      properties:
        date:
          type: string
          description: Office-local date.
          format: date
        part: *id030
        desk:
          $ref: '#/components/schemas/FreeDesk'
        reason:
          type: string
          description: Why this desk was proposed. Present with desk.
          enum:
          - USUAL_DESK
          - SAME_ZONE
          - MATCHES_CHOICES
          - FIRST_FREE
        noneReason:
          type: string
          description: 'Why there is no desk. Present when desk is absent. NOTHING_FREE: no desk at all is free that day and
            part (her zone and features do not matter). NO_MATCH: desks are free, but none matches the zone or features she
            chose; alternatives then lists the nearest options. NO_MATCH never occurs when she chose no zone and no features.'
          enum:
          - NOTHING_FREE
          - DATE_NOT_BOOKABLE
          - ALREADY_BOOKED
          - NO_MATCH
        alternatives:
          type: array
          description: 'Present only with noneReason NO_MATCH, then 1 to 3 entries in the order of DeskAlternative.reason (AC19.5).
            Absent otherwise. Each is one free desk for this date and part that she can book with createBookings (source
            CHOSEN) or pick in Change.'
          items:
            $ref: '#/components/schemas/DeskAlternative'
          minItems: 1
          maxItems: 3
      required:
      - date
      - part
      additionalProperties: false
    DeskAlternative:
      type: object
      description: 'One nearest option when nothing matches her choices. Filled in this order until 3 are reached, one desk (lowest
        code) per zone or per dropped feature: (1) USUAL_DESK, her usual desk (D6: most booked in the last 60 days, at least
        3 times) when it is free but outside her choices; (2) NEAREST_ZONE, a zone on the same floor as the zone she chose
        (with no zone chosen, the floor of her usual desk) that has a free desk with all her features; (3) OTHER_ZONE, any
        other zone with a free desk with all her features, by zone name; (4) WITHOUT_FEATURE, a free desk in her chosen zone
        (any zone if none chosen) that has all her features but one, one entry per dropped feature in the order of featureIds,
        only when such a desk exists; (5) ANY_FREE, the first free desk of the office by code, only when nothing above gave
        a desk, so NO_MATCH always has at least one. missingFeature is present only with WITHOUT_FEATURE and names the feature
        she asked for that this desk lacks. No person data.'
      properties:
        desk:
          $ref: '#/components/schemas/FreeDesk'
        reason:
          type: string
          description: Why this desk is offered.
          enum:
          - USUAL_DESK
          - NEAREST_ZONE
          - OTHER_ZONE
          - WITHOUT_FEATURE
          - ANY_FREE
        missingFeature:
          $ref: '#/components/schemas/FeatureRef'
      required:
      - desk
      - reason
      additionalProperties: false
