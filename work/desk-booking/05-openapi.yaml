          maxItems: 200
        days:
          type: array
          description: Office-local days of the range, ascending, at most 31.
          items:
            type: string
            description: Office-local day.
            format: date
          minItems: 1
          maxItems: 31
        cells:
          type: array
          description: One cell per zone and day.
          items:
            $ref: '#/components/schemas/OccupancyGridCell'
          maxItems: 6200
      required:
      - zones
      - days
      - cells
      additionalProperties: false
