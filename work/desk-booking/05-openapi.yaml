  /api/v1/bookings/batch:
    post:
      operationId: createBookings
      tags:
      - booking
      summary: Book several days in one action
      description: 'Plan my week (D5, ADR-12): 1 to 14 distinct days, each its own booking in its own transaction with every
        rule of createBooking. Answers 200 with an outcome per day: BOOKED, REPICKED (the PROPOSED desk was just taken and
        the next desk was booked; the booking shows the new desk) or FAILED (a CHOSEN desk was taken, or any other refusal,
        with the usual problem code). Booked days stay booked. The request fails as a whole only for its own validation, a
        missing or reused Idempotency-Key, PROFILE_NOT_READY or EMPLOYEE_INACTIVE. A repeat with the same Idempotency-Key
        and body returns the same days (stored per day as <key>:<date>).'
      x-roles: *id012
      x-release: MVP
      x-stories:
      - ST-BK-13
      - ST-BK-8
      - ST-BK-14
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingBatchCreate'
            examples:
              example:
                value:
                  officeId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a01
                  items:
                  - date: '2026-10-30'
                    part: FULL_DAY
                    deskId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a04
                    source: PROPOSED
