                    part: FULL_DAY
                    deskId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a0b
                    source: PROPOSED
                  - date: '2026-11-03'
                    part: FULL_DAY
                    deskId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a0c
                    source: CHOSEN
      responses:
        '200':
          description: Processed. Check each item outcome; the call itself succeeded.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingBatchResult'
              examples:
                example:
                  value:
                    items:
                    - date: '2026-10-30'
                      outcome: BOOKED
                      booking: *id014
                    - date: '2026-11-02'
                      outcome: REPICKED
                      previousDeskCode: PNQ-3-15
                      booking:
                        id: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a0d
                        officeId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a01
                        officeName: Pune
                        timezone: Asia/Kolkata
                        deskId: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a0e
                        deskCode: PNQ-3-16
                        floorName: Floor 3
                        zoneName: 3rd floor east
                        date: '2026-11-02'
                        part: FULL_DAY
                        status: BOOKED
                        bookedBy: SELF
                        bookedAt: '2026-10-28T09:20:01Z'
                        checkInOpensAt: '2026-11-02T00:30:00Z'
                        deadline: '2026-11-02T04:30:00Z'
                        deadlineKind: NORMAL
                        holdAvailable: true
                        holdUntil: '2026-11-02T06:00:00Z'
                        allowedActions:
                        - CANCEL
                        - HOLD
                        version: 1
                    - date: '2026-11-03'
                      outcome: FAILED
                      problem:
                        code: DESK_JUST_TAKEN
