    get:
      operationId: proposeDesks
      tags:
      - booking
      summary: Propose a desk for each chosen day
      description: 'Read only (D5, ADR-12). For each chosen day the best free desk and the reason it was proposed: usual desk,
        same zone as the usual desk, matches the chosen zone and features, or first free. A day without a desk has noneReason
        and no desk; NO_MATCH (desks are free but none fits her zone or features) also carries up to 3 alternatives, the nearest zone
        or feature options (AC19.5). Nothing is held or stored: the desk can be taken before createBookings, which then re-picks. No person
        data. 1 to 14 distinct dates, so the answer is bounded and not paged.'
      x-roles: *id012
      x-release: MVP
      x-stories:
      - ST-BK-8
      - ST-BK-13
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      - name: officeId
        in: query
        required: true
        description: Office to book in.
        schema:
          type: string
          description: Office id.
          format: uuid
      - name: dates
        in: query
        required: true
        description: Days to plan, comma-separated, 1 to 14 distinct office-local dates (for example 2026-10-30,2026-11-02).
        style: form
        explode: false
        schema:
          type: array
          description: Office-local dates.
          items:
            type: string
            description: Office-local date.
            format: date
          minItems: 1
          maxItems: 14
          uniqueItems: true
      - name: part
        in: query
        required: true
        description: Part of the day, the same for every day.
        schema: *id030
      - name: zoneId
        in: query
        required: false
        description: Only propose desks in this zone.
        schema:
          type: string
          description: Zone id.
          format: uuid
      - name: featureIds
        in: query
        required: false
        description: Only propose desks that have all these features, comma-separated.
        style: form
        explode: false
        schema:
          type: array
          description: Feature ids.
          items:
            type: string
            description: Feature id.
            format: uuid
          minItems: 1
          maxItems: 20
          uniqueItems: true
      responses:
        '200':
          description: OK.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeskProposalList'
              examples:
                example:
                  value:
                    items:
                    - date: '2026-10-30'
                      part: FULL_DAY
                      desk:
                        id: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a04
                        code: PNQ-3-14
                        floorName: Floor 3
                        zoneName: 3rd floor east
                        features:
                        - *id013
                      reason: USUAL_DESK
                    - date: '2026-11-02'
                      part: FULL_DAY
                      desk:
                        id: 3f6c1e52-7a0b-4d0e-9a3c-1b2d4e5f6a0b
                        code: PNQ-3-15
                        floorName: Floor 3
                        zoneName: 3rd floor east
                        features: []
                      reason: SAME_ZONE
                    - date: '2026-11-03'
                      part: FULL_DAY
