<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live status</title>
<script>window.__PROJECT__={"name":"","ticket":""};</script>
<script>/* light by default; "System" follows the computer's light/dark setting */
try{document.documentElement.dataset.theme=localStorage.getItem("ls:theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<style>
@property --ax{syntax:"<percentage>";inherits:false;initial-value:15%}
@property --bx{syntax:"<percentage>";inherits:false;initial-value:85%}
:root{--bg:#f8f8fc;--card:#fff;--line:#e6e8f0;--text:#1e2230;--muted:#5b6274;--faint:#8a90a0;
--spec:#7c6cf0;--design:#139c87;--build:#3b7ddd;--review:#cf8417;--test:#3c974a;--verify:#1790b5;--release:#c9558b;--wrap:#6b7480;
--intake:#6d72c9;--base:#5f7a8c;--requirements:var(--spec);--product:#a35fc4;--prototype:var(--design);--stories:#a9861c;--audit:var(--verify);
--you:#c27812;--fail:#c43d48;--cur:var(--build)}
:root{color-scheme:light}:root[data-theme="system"]{color-scheme:light dark}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--bg:#111318;--card:#181b22;--line:#2a2e39;--text:#e8eaf0;--muted:#a9afbd;--faint:#7e8596;
--spec:#a99ff8;--design:#4ccab5;--build:#7eaaf0;--review:#eeb25c;--test:#7cc68a;--verify:#5fc3e0;--release:#e78db6;--wrap:#a5acb8;--you:#f1b752;--fail:#f28c95;
--intake:#a3a8f0;--base:#9fb4c2;--product:#d09be8;--stories:#e2c165}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
:focus{outline:none}:focus-visible{outline:2px solid var(--cur);outline-offset:2px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding:16px}
.sub{color:var(--faint);font-size:12px}
.pill{font-size:11px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
button.thm{font:inherit;font-size:11px;background:transparent;cursor:pointer}
.st-live{color:var(--cur);border-color:color-mix(in srgb,var(--cur) 35%,var(--card));background:color-mix(in srgb,var(--cur) 9%,var(--card))}
.st-wait{color:var(--you);border-color:color-mix(in srgb,var(--you) 35%,var(--card));background:color-mix(in srgb,var(--you) 10%,var(--card))}
.st-done{color:var(--test);border-color:color-mix(in srgb,var(--test) 35%,var(--card));background:color-mix(in srgb,var(--test) 9%,var(--card))}
.st-fail{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 35%,var(--card));background:color-mix(in srgb,var(--fail) 8%,var(--card))}
.st-idle{color:var(--faint)}
.btn{display:inline-block;text-decoration:none;border:1px solid transparent;background:var(--cur);color:#fff;border-radius:6px;padding:4px 12px;cursor:pointer}
.btn.ghost{background:transparent;border-color:color-mix(in srgb,currentColor 40%,transparent);color:inherit}
.btn.sm{padding:2px 9px;font-size:12px}
/* header */
.top{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.orbw{position:relative;width:46px;height:46px;flex:none;--c:var(--cur)}
.orb{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--c),color-mix(in srgb,var(--c) 12%,var(--card)) 35%,var(--c) 65%,color-mix(in srgb,var(--c) 12%,var(--card)));animation:spin 3.6s linear infinite}
.orb::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--card)}
.spark{position:absolute;inset:0;display:grid;place-items:center;color:var(--c);font-size:19px;animation:breathe 2.4s ease-in-out infinite}
.sat{position:absolute;inset:-5px;animation:spin 2.2s linear infinite}
.sat::before{content:"";position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--c)}
.who{flex:1;min-width:0}
.l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.l1 b{font-weight:500;font-size:14px}
.l1 .tt{color:var(--muted)}
.risk{--rc:var(--review);font-size:11px;padding:0 8px;border-radius:999px;white-space:nowrap;color:color-mix(in srgb,var(--rc) 78%,var(--text));background:color-mix(in srgb,var(--rc) 12%,var(--card));border:1px solid color-mix(in srgb,var(--rc) 28%,var(--line))}
.risk.low{--rc:var(--test)}.risk.high{--rc:var(--fail)}
.l2{display:flex;align-items:center;margin-top:3px;min-height:20px;min-width:0}
#doing{font-size:14px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.caret{display:none;flex:none;width:2px;height:14px;background:var(--cur);margin-left:2px;animation:blink .8s step-end infinite}
body[data-ov=live] .caret{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* mini keyboard: the key of each typed letter presses down */
.kb{--kc:var(--cur);flex:none;display:grid;gap:1.5px;padding:3px;border-radius:5px;border:1px solid color-mix(in srgb,var(--kc) 25%,var(--card));background:color-mix(in srgb,var(--kc) 5%,var(--card))}
.kb .r{display:flex;gap:1.5px;justify-content:center}
.kb i{width:5px;height:5px;border-radius:1px;background:color-mix(in srgb,var(--kc) 18%,var(--card));transition:transform .08s,background .3s}
.kb i.sp{width:24px}
.kb i.dn{transform:translateY(.5px);background:var(--kc);transition:transform .04s,background 0s}
body[data-ov=wait] .kb{--kc:var(--you)}body[data-ov=done] .kb{--kc:var(--test)}body[data-ov=fail] .kb{--kc:var(--fail)}body[data-ov=idle] .kb{opacity:.55}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.meta .row1{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
.beat::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cur);margin-right:5px;vertical-align:1px}
.beat.pulse::before{animation:ping .9s ease-out}
/* stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.stat b.bump{animation:bump .5s ease-out}
/* gate */
.gate{border:1px solid color-mix(in srgb,var(--you) 40%,var(--card));background:color-mix(in srgb,var(--you) 7%,var(--card));border-radius:12px;padding:12px 14px;margin-bottom:14px;animation:glow 3.2s ease-in-out infinite}
.gh{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.bell{width:10px;height:10px;border-radius:50%;background:var(--you);margin-top:5px;flex:none;animation:ping 1.8s ease-out infinite}
.gq{font-weight:500;font-size:14px}
.file{border:1px solid var(--line);border-radius:8px;background:var(--card);margin:8px 0;max-height:min(70vh,640px);overflow:auto}
.fh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;padding:6px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;left:0;z-index:1;background:var(--card);font-size:12px;color:var(--muted)}
.fh a,.lnk{color:var(--cur)}
.fa{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.lnk{border:0;background:none;cursor:pointer;font-size:12px;padding:0}
.okc{display:inline-flex;gap:5px;align-items:center;cursor:pointer;color:var(--text)}
.fh .by{font-size:11px;color:var(--faint);margin-left:8px}
.gq .who{display:block;font-size:12px;font-weight:500;color:var(--you);margin-bottom:2px}
.okd{font-size:11px;padding:1px 8px;border-radius:999px;margin-left:6px;background:color-mix(in srgb,var(--test) 14%,var(--card));color:var(--test)}
/* formatted markdown, one row per source line so line comments keep working */
.lines.md{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;line-height:1.55}
.lines.md>li{padding:1px 10px 1px 0}
.lines.md .ln{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;padding-top:3px;opacity:.6}
.lines.md .lt{white-space:normal}
.lines.md>li.md-h .lt{font-weight:500}
.lines.md>li.md-h1 .lt{font-size:16px;padding-top:2px}
.lines.md>li.md-h2 .lt{font-size:14.5px;padding-top:8px}
.lines.md>li.md-h3 .lt,.lines.md>li.md-h4 .lt{font-size:13.5px;padding-top:4px}
.lines.md>li.md-blank,.lines.md>li.md-sep,.lines.md>li.md-fence{height:6px;overflow:hidden;cursor:default}
.lines.md>li.md-blank .ln,.lines.md>li.md-sep .ln,.lines.md>li.md-fence .ln,.lines.md>li.md-hr .ln{visibility:hidden}
.lines.md>li.md-hr{cursor:default}
.lines.md>li.md-hr .lt{border-top:1px solid var(--line);margin:8px 0}
.lines.md>li.md-li .lt{display:flex;gap:6px}
.md-b{color:var(--muted);flex:none;min-width:10px}
.lines.md>li.md-cont .lt{padding-left:22px}
.lines.md>li.md-q .lt{border-left:3px solid var(--line);padding-left:8px;color:var(--muted)}
.lines.md>li.md-code .lt{font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.4;white-space:pre;width:max-content;min-width:100%;padding:0 10px;background:color-mix(in srgb,var(--text) 5%,var(--card))}
.lines.md .tr{display:grid;gap:0 12px;padding:3px 0;border-bottom:1px solid var(--line)}
.lines.md .tr>div{min-width:0;overflow-wrap:break-word}
.lines.md>li.md-th .tr{font-weight:500;border-bottom-color:var(--faint)}
.lines.md code{font-family:ui-monospace,Consolas,monospace;font-size:12px;padding:0 4px;border-radius:4px;background:color-mix(in srgb,var(--text) 6%,var(--card))}
.lines.md u{text-decoration-color:var(--faint)}
.lines{list-style:none;margin:0;padding:4px 0;font-family:ui-monospace,Consolas,monospace;font-size:12px}
.lines>li{display:grid;grid-template-columns:36px 1fr;cursor:pointer;padding:0 8px 0 0}
.lines>li:hover{background:color-mix(in srgb,var(--you) 8%,var(--card))}
.lines>li.has{background:color-mix(in srgb,var(--you) 12%,var(--card))}
.ln{color:var(--faint);text-align:right;padding-right:10px;user-select:none}
.lt{white-space:pre-wrap;word-break:break-word}
.lines>li.ed,.lines>li.note{display:flex;gap:6px;align-items:center;cursor:default;padding:4px 10px 6px 46px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:transparent}
.lines>li.ed input{flex:1;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--card)}
.lines>li.note .nt{flex:1;border-left:3px solid var(--you);padding:2px 8px;background:color-mix(in srgb,var(--you) 9%,var(--card));border-radius:0 6px 6px 0}
.x{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:12px}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);resize:vertical;margin-top:4px}
.gact{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
/* team: one row per expert */
.crew{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.crew-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.crew-h b{font-weight:500}
.crew-k{font-size:11px;padding:0 8px;border-radius:999px;color:var(--verify);background:color-mix(in srgb,var(--verify) 10%,var(--card));border:1px solid color-mix(in srgb,var(--verify) 28%,var(--card))}
.crew-t{border:0;background:transparent;color:var(--muted);cursor:pointer;margin-left:auto;font-size:12px;text-decoration:underline;padding:0}
.crew-g{margin-top:6px}
.crew-r{display:grid;grid-template-columns:84px minmax(0,1.1fr) 112px minmax(0,2fr);gap:0 14px;padding:4px 0;border-top:1px solid var(--line)}
.crew-r>div{min-width:0}
.crew-r.hd{color:var(--faint);font-size:12px;border-top:0}
.crew-r.first{border-top-color:color-mix(in srgb,var(--text) 14%,var(--card))}
.crew-s{display:flex;gap:6px;align-items:center;color:color-mix(in srgb,var(--c) 70%,var(--text))}
.crew-s i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.crew-s.more{visibility:hidden}
.crew-x{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.crew-x.live{color:color-mix(in srgb,var(--c) 75%,var(--text))}
.crew-x.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px;animation:breathe 1.4s ease-in-out infinite}
.crew-x.done{color:color-mix(in srgb,var(--c) 60%,var(--text))}
.crew-x.done::before{content:"\2713  "}
.crew-e.live{font-weight:500}
.crew-e.skip,.crew-x.skip{color:var(--faint);text-decoration:line-through}
.crew-a{font-size:11px;color:var(--you);margin-left:6px}
.crew-w{color:var(--muted);font-size:12px}
.crew-c{margin-top:6px;font-size:12px;color:var(--you)}
@media (max-width:620px){.crew-r{grid-template-columns:minmax(0,1fr) auto}.crew-r.hd,.crew-s.more{display:none}
.crew-s,.crew-w{grid-column:1/-1}.crew-r:not(.first){border-top-style:dashed}}
/* team map (ported from the product-factory tracker): every agent as a star, grouped by team, lit along the hand-offs */
.crew-v{display:inline-flex;margin-left:auto;border:1px solid var(--line);border-radius:999px;overflow:hidden;align-self:center}
.crew-v button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:1px 10px;cursor:pointer}
.crew-v button[aria-pressed="true"]{background:color-mix(in srgb,var(--spec) 12%,var(--card));color:color-mix(in srgb,var(--spec) 75%,var(--text))}
.crew-v+.crew-t{margin-left:10px}
.vis{position:relative;margin-top:6px}
.vis svg{display:block;width:100%;height:auto;max-height:480px}
.vis-n{position:absolute;right:0;top:0;font-size:12px;color:var(--faint)}
.star{fill:var(--line);animation:tw 4s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
.cluster{fill:color-mix(in srgb,var(--spec) 5%,var(--card));stroke:color-mix(in srgb,var(--spec) 22%,var(--line));stroke-dasharray:2 5}
.cl-name{fill:var(--faint);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;transition:fill .6s}
.cl-name.active{fill:var(--spec)}
.edge{stroke:var(--line);stroke-width:1.3;fill:none;transition:stroke 1s}
.edge.lit{stroke:color-mix(in srgb,var(--spec) 45%,var(--line))}
.an .body{fill:var(--card);stroke:hsl(var(--h) 30% 86%);transition:fill .8s,stroke .8s}
.an.planned .body{stroke:hsl(var(--h) 40% 74%)}
.an.done .body{fill:hsl(var(--h) 55% 90%);stroke:hsl(var(--h) 45% 62%)}
.an.working .body{fill:hsl(var(--h) 70% 82%);stroke:hsl(var(--h) 45% 62%)}
.an.off{opacity:.35}
.an text{fill:var(--faint);font-size:12.5px;transition:fill .8s}
.an text .l2{font-size:10.5px;opacity:.85}
.an.done text,.an.working text,.an.planned text{fill:var(--text)}
.an .orbit{stroke:hsl(var(--h) 55% 70%);transform-box:fill-box;transform-origin:center;opacity:0}
.an.working .orbit{opacity:1;animation:spin 3.4s linear infinite}
.vtoast{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);background:var(--card);border:1px solid color-mix(in srgb,var(--test) 40%,var(--line));
  border-radius:999px;padding:3px 12px;font-size:12px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;pointer-events:none;animation:vtoast 3.4s forwards}
.vtoast b{color:var(--test);font-weight:500}
@keyframes vtoast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-color-scheme:dark){:root[data-theme="system"] .an .body{stroke:hsl(var(--h) 22% 38%)}:root[data-theme="system"] .an.planned .body{stroke:hsl(var(--h) 35% 52%)}
:root[data-theme="system"] .an.done .body{fill:hsl(var(--h) 28% 26%);stroke:hsl(var(--h) 40% 55%)}:root[data-theme="system"] .an.working .body{fill:hsl(var(--h) 45% 40%);stroke:hsl(var(--h) 55% 68%)}}
.gate .btn{--cur:var(--you)}
.gate .btn:not(.ghost){background:var(--you)}
.gid{font-size:11px;padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--faint);white-space:nowrap;font-weight:400}
.gid.approved{color:var(--test);border-color:color-mix(in srgb,var(--test) 35%,var(--card))}
.gid.waiting{color:var(--you);border-color:color-mix(in srgb,var(--you) 40%,var(--card))}
.gid.changes{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 35%,var(--card))}
/* timeline */
.tl{list-style:none;margin:0;padding:0}
.row{--c:var(--wrap);display:grid;grid-template-columns:28px 1fr;gap:10px}
.s-spec{--c:var(--spec)}.s-design{--c:var(--design)}.s-build{--c:var(--build)}.s-review{--c:var(--review)}.s-test{--c:var(--test)}.s-verify{--c:var(--verify)}.s-release{--c:var(--release)}.s-wrap{--c:var(--wrap)}
.s-intake{--c:var(--intake)}.s-base{--c:var(--base)}.s-requirements{--c:var(--requirements)}.s-product{--c:var(--product)}.s-prototype{--c:var(--prototype)}.s-stories{--c:var(--stories)}.s-audit{--c:var(--audit)}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:24px;bottom:-6px;width:2px;background:var(--line);border-radius:2px}
.row:last-child .rail::before{display:none}
.row.done .rail::before{background:color-mix(in srgb,var(--c) 35%,var(--card))}
.row.live .rail::before{background:repeating-linear-gradient(180deg,var(--c) 0 5px,transparent 5px 11px);background-size:2px 22px;animation:flow .7s linear infinite}
.mk{position:relative;z-index:1;width:20px;height:20px;margin-top:9px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.mk svg{width:13px;height:13px}
.mk path{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .6s .15s}
.done .mk{background:var(--c);border-color:var(--c)}.done .mk path{stroke-dashoffset:0}
.live .mk{border-color:var(--c)}
.live .mk::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--c);animation:breathe 1.6s ease-in-out infinite}
.live .mk::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);animation:ring 1.8s ease-out infinite}
.wait .mk{border-color:var(--you);background:color-mix(in srgb,var(--you) 25%,var(--card));animation:breathe 2.4s ease-in-out infinite}
.fail .mk{border-color:var(--fail);background:color-mix(in srgb,var(--fail) 18%,var(--card))}
.fail .mk::after{content:"!";color:var(--fail);font-weight:500;font-size:12px}
.skip .mk{border-style:dashed}
.main{border-radius:10px;padding:7px 12px 8px;margin:2px 0 6px;min-width:0}
.row.live .main,.row.fail .main{border:1px solid color-mix(in srgb,var(--c) 30%,var(--card));
background:radial-gradient(180px 70px at var(--ax) 20%,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%),
radial-gradient(220px 90px at var(--bx) 90%,color-mix(in srgb,var(--c) 12%,transparent),transparent 70%),color-mix(in srgb,var(--c) 5%,var(--card));
animation:aurora 9s ease-in-out infinite alternate}
.row.fail .main{border-color:color-mix(in srgb,var(--fail) 35%,var(--card))}
.row.wait .main{border:1px dashed color-mix(in srgb,var(--you) 45%,var(--card))}
.row.just .main{animation:flash 1.6s ease-out}
.h{display:flex;gap:8px;align-items:baseline;width:100%;border:0;background:transparent;padding:2px 0;text-align:left;cursor:pointer}
.nm{font-weight:500;font-size:14px}
.row.todo .nm,.row.skip .nm{color:var(--faint);font-weight:400}
.row.live .nm,.row.done .nm{color:color-mix(in srgb,var(--c) 70%,var(--text))}
.whoa{color:var(--muted);font-size:12px}
.row.skip .whoa{font-style:italic}
.whoa:empty{display:none}
/* the agent of the running stage stands out: a tag in the stage colour with a breathing dot */
.row.live .whoa,.row.fail .whoa{display:inline-flex;gap:6px;align-items:center;font-weight:500;padding:0 9px;border-radius:999px;color:color-mix(in srgb,var(--cur) 80%,var(--text));background:color-mix(in srgb,var(--cur) 10%,var(--card));border:1px solid color-mix(in srgb,var(--cur) 30%,var(--card))}
.row.live .whoa::before,.row.fail .whoa::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--cur);animation:breathe 1.4s ease-in-out infinite}
.bud{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bud.over{padding:0 7px;border-radius:4px;color:color-mix(in srgb,var(--you) 80%,var(--text));background:color-mix(in srgb,var(--you) 14%,var(--card))}
.bud.past{font-size:12px;color:var(--faint)}
.tm{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.out{color:var(--muted);font-size:12px}
.out:empty{display:none}
.row.done .out{color:color-mix(in srgb,var(--c) 60%,var(--text))}
.row.fail .out{color:var(--fail)}
.feed{list-style:none;margin:6px 0 0;padding:0}
.row:not(.live):not(.wait):not(.fail):not(.open) .feed{display:none}
.feed li{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:2px 0}
.feed .when{color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px}
.feed .tx{word-break:break-word}
.feed li:last-child .tx{color:var(--text)}
.feed li:not(:last-child){opacity:.72}
.feed .by{color:var(--faint);font-size:12px}
.tag{font-size:11px;padding:0 6px;border-radius:4px;margin-right:6px;background:color-mix(in srgb,var(--c) 12%,var(--card));color:color-mix(in srgb,var(--c) 75%,var(--text))}
.k-block .tag,.k-fail .tag,.k-must .tag{background:color-mix(in srgb,var(--fail) 13%,var(--card));color:var(--fail)}
.k-flag .tag,.k-gate .tag,.k-changes .tag,.k-ask .tag{background:color-mix(in srgb,var(--you) 14%,var(--card));color:var(--you)}
.ans{color:var(--muted);margin-top:2px;white-space:pre-wrap}
.dec{font-size:11px;padding:1px 8px;border-radius:999px;margin-right:6px;vertical-align:1px;background:color-mix(in srgb,var(--you) 14%,var(--card));color:var(--you)}
.k-ok .tag,.k-done .tag{background:color-mix(in srgb,var(--test) 14%,var(--card));color:var(--test)}
.feed li.new{animation:rise .45s ease-out}
.feed li.new .tx::before{content:"\2726  ";color:var(--c);animation:fade 2.5s forwards}
.typing::after{content:"";display:inline-block;width:2px;height:13px;background:var(--c);margin-left:2px;vertical-align:-2px;animation:blink .7s step-end infinite}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chips:empty{display:none}
.chip{font-size:11px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 11%,var(--card));color:color-mix(in srgb,var(--c) 70%,var(--text));border:1px solid color-mix(in srgb,var(--c) 22%,var(--card))}
.chip.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
button.chip{font:inherit;font-size:11px;cursor:pointer}
button.chip:hover{background:color-mix(in srgb,var(--c) 20%,var(--card))}
dialog.fv{width:min(980px,94vw);height:min(82vh,900px);padding:0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);flex-direction:column;overflow:hidden}
dialog.fv[open]{display:flex}
dialog.fv::backdrop{background:rgba(16,18,28,.38)}
.fv-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.fv-p{flex:1;min-width:0;font-family:ui-monospace,Consolas,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv-h button{font:inherit;font-size:12px;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:6px;padding:2px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.fv-b{flex:1;overflow:auto}
.fv-b .lines>li{grid-template-columns:52px 1fr;cursor:text}
.fv-b .lines>li:hover{background:transparent}
.fv-b .lt{tab-size:4}
.fv-b .lines:not(.md){width:max-content;min-width:100%}
.fv-b .lines:not(.md) .lt{white-space:pre}
.fv-b .lines:not(.md) .ln{position:sticky;left:0;background:var(--card)}
.fv-m{margin:0;padding:14px 16px;color:var(--muted);font-size:13px}
/* misc */
.toast{position:sticky;bottom:12px;margin:12px auto 0;max-width:520px;background:var(--text);color:var(--bg);border-radius:10px;padding:9px 14px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:none;pointer-events:auto}
.toast textarea{color:var(--text);margin-top:6px}
.idle{text-align:center;padding:60px 20px;color:var(--muted)}
.idle .orbw{margin:0 auto 14px;--c:var(--spec)}
.demo{font-size:11px;color:var(--spec);border:1px dashed var(--spec);border-radius:999px;padding:0 8px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(.82);opacity:.7}}
@keyframes ring{from{transform:scale(.6);opacity:.7}to{transform:scale(1.25);opacity:0}}
@keyframes ping{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--cur) 45%,transparent)}to{box-shadow:0 0 0 8px transparent}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes sweep{to{background-position:-160% 0}}
@keyframes flow{to{background-position:0 22px}}
@keyframes aurora{to{--ax:85%;--bx:15%}}
@keyframes flash{from{background:color-mix(in srgb,var(--c) 30%,var(--card))}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes fade{to{opacity:0}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes bump{40%{transform:translateY(-3px);color:var(--cur)}}
@keyframes glow{50%{border-color:color-mix(in srgb,var(--you) 70%,var(--card))}}
/* each stage shows one card per agent run (the live-rolling prototype, variant B): an avatar with its initials, its
   job in one sentence, calls against its Speed line and a roll of three lines - just done, now (typing itself
   out), up next in its own job; finished runs fold into a short summary for people */
#doing .n{color:var(--cur)}
.atag{display:inline-flex;gap:5px;align-items:center;font-size:11px;padding:0 8px;border-radius:999px;white-space:nowrap;flex:none;
 color:color-mix(in srgb,var(--a) 78%,var(--text));background:color-mix(in srgb,var(--a) 10%,var(--card));border:1px solid color-mix(in srgb,var(--a) 28%,var(--card))}
.adot{width:7px;height:7px;border-radius:50%;background:var(--a);flex:none;display:inline-block}
.live-a .adot,.adot.live{animation:breathe 1.4s ease-in-out infinite}
.feed .atag{margin-left:4px;vertical-align:1px}
.num{font-variant-numeric:tabular-nums;color:var(--faint);font-size:12px;white-space:nowrap}
.num.over{color:color-mix(in srgb,var(--you) 80%,var(--text))}
/* the roll: just done, now, up next */
.roll{position:relative;overflow:hidden;margin-top:6px;display:grid;grid-template-columns:minmax(0,1fr)}
.rl{display:flex;gap:8px;align-items:center;min-width:0;padding:3px 8px;border-radius:7px}
.rl .tx{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rl .ic:empty{display:none}
.rl .ic{width:14px;flex:none;text-align:center;color:var(--faint);font-size:12px}
.rl.past{opacity:.55;font-size:12px}
.rl.past .ic{color:var(--test)}
.rl.now{font-weight:500;font-size:13.5px;padding:5px 8px;background:color-mix(in srgb,var(--a,var(--c)) 11%,var(--card));border:1px solid color-mix(in srgb,var(--a,var(--c)) 26%,var(--card))}
.rl.next{opacity:.6;font-size:12px;color:var(--muted)}
.rl.next .tx{font-style:italic}
.roll.go .rl.past,.roll.go .rl.now{animation:roll .38s cubic-bezier(.2,.8,.3,1)}
.roll.go .rl.next{animation:fadein .6s .2s both}
.roll.go .rl.now .tx{animation:fadein .5s}
/* finished agents: summary for people */
.fin{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:8px}
.fin:empty{display:none}
.sum,.sum-h{min-width:0}
.sum{border:1px solid var(--line);border-left:3px solid var(--a);border-radius:8px;padding:6px 10px;background:var(--card)}
.sum-h{display:flex;gap:8px;align-items:center;width:100%;border:0;background:transparent;padding:0;text-align:left;cursor:pointer}
.sum-h .first{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.sum.open .sum-h .first{white-space:normal}
.sum ul{margin:4px 0 0 0;padding-left:18px;color:var(--text)}
.sum ul li{padding:1px 0}
.sum .ft{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.sum .lnk{border:0;background:none;padding:0;cursor:pointer;color:color-mix(in srgb,var(--a) 75%,var(--text));text-decoration:underline;font-size:12px}
.sum .why{color:color-mix(in srgb,var(--you) 80%,var(--text))}
.sum.failed .why{color:var(--fail)}
.steps{list-style:none;margin:6px 0 0;padding:0;max-height:180px;overflow:auto;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;font-size:12px;color:var(--muted);padding:1px 0}
.steps summary{cursor:pointer;list-style:none}.steps summary::-webkit-details-marker{display:none}
.steps summary::after{content:" \25B8";color:var(--faint)}.steps details[open] summary::after{content:" \25BE"}
.steps code{display:block;margin:2px 0 4px;padding:3px 6px;border-radius:5px;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);background:color-mix(in srgb,var(--text) 6%,transparent)}
.sum:not(.open) ul,.sum:not(.open) .ft,.sum:not(.open) .steps{display:none}
/* working, not loading: the step types itself out behind a caret, the avatar nods on each new step, the calls bar grows */
.typing::after{content:"";display:inline-block;width:2px;height:13px;background:var(--a,var(--c));margin-left:2px;vertical-align:-2px;animation:blink .9s step-end infinite}
@keyframes nod{35%{transform:translateY(-3px) scale(1.08)}}
.acard.go .av{animation:nod .45s ease-out}
.meter{height:4px;border-radius:2px;background:color-mix(in srgb,var(--a) 14%,var(--card));overflow:hidden;width:56px;flex:none}
.meter i{display:block;height:100%;background:var(--a);border-radius:2px;transition:width .5s ease-out}
.meter.over i{background:var(--you)}
.acard .calls{display:flex;gap:6px;align-items:center;margin-left:auto}
.acard .rl{padding:3px 6px}.acard .rl.now{font-size:13px}
/* one card per agent, side by side when several work */
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;margin-top:8px}
.agrid:empty{display:none}
.acard{border:1px solid color-mix(in srgb,var(--a) 30%,var(--card));border-radius:10px;background:var(--card);padding:8px 10px;min-width:0}
.acard.plan{border-style:dashed;opacity:.7}
.acard .ah{display:flex;gap:8px;align-items:center;min-width:0}
.acard .job{font-size:12px;color:var(--muted);margin:1px 0 0}
.acard .roll{margin-top:4px}
.upn{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted);font-style:italic}
.upn::before{content:"\2192";font-style:normal;color:var(--faint)}
/* the working agent, clearly at work: avatar with its initials and its name */
.pres{display:inline-flex;gap:7px;align-items:center;flex:none;min-width:0;font-size:12px;font-weight:500;color:color-mix(in srgb,var(--a) 80%,var(--text))}
.av{position:relative;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:500;letter-spacing:.2px;flex:none;
 color:color-mix(in srgb,var(--a) 85%,var(--text));background:color-mix(in srgb,var(--a) 16%,var(--card))}
.pres.off .av::after{content:"\2713";position:absolute;right:-4px;bottom:-3px;width:12px;height:12px;border-radius:50%;font-size:8px;display:grid;place-items:center;color:#fff;background:var(--test)}
.pres.off.stopped .av::after{content:"!";background:var(--you)}.pres.off.failed .av::after{content:"!";background:var(--fail)}
@keyframes roll{from{transform:translateY(100%)}}
@keyframes fadein{from{opacity:0}}
@media (max-width:620px){.sum-h{flex-wrap:wrap}.sum-h .first{order:3;flex-basis:100%;white-space:normal}.rl .ago,.rl .el{display:none}.agrid{grid-template-columns:1fr}.rl.now .tx{white-space:normal}}

/* glass: see-through panels over a slow colour field; a lit top edge and blur instead of shadows */
:root{--glass:color-mix(in srgb,var(--card) 52%,transparent);--glass-hi:color-mix(in srgb,#fff 70%,transparent);--glass-line:color-mix(in srgb,var(--text) 10%,transparent);--sheen:color-mix(in srgb,#fff 55%,transparent);--field:.30}
@media (prefers-color-scheme:dark){:root[data-theme="system"]{--glass:color-mix(in srgb,var(--card) 42%,transparent);--glass-hi:color-mix(in srgb,#fff 9%,transparent);--glass-line:color-mix(in srgb,#fff 10%,transparent);--sheen:color-mix(in srgb,#fff 14%,transparent);--field:.20}}
.field{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.field i{position:absolute;width:44vmax;height:44vmax;border-radius:50%;filter:blur(80px);opacity:var(--field);animation:drift 40s ease-in-out infinite alternate}
.field i:nth-child(1){background:var(--design);left:-14vmax;top:-12vmax}
.field i:nth-child(2){background:var(--build);right:-16vmax;top:16vh;animation-duration:48s;animation-delay:-14s}
.field i:nth-child(3){background:var(--spec);left:22vw;bottom:-24vmax;animation-duration:56s;animation-delay:-24s}
@keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.15)}}
.top,.stat,.crew,.acard,.sum{background:linear-gradient(180deg,var(--glass-hi),transparent 42%),var(--glass);
 -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--glass-line)}
.top{border-radius:16px}.stat{border-radius:12px}.crew{border-radius:14px}
.gate{background:linear-gradient(180deg,var(--glass-hi),transparent 42%),color-mix(in srgb,var(--you) 9%,var(--glass));
 -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border-radius:16px}
.row.live .main,.row.fail .main{border:1px solid color-mix(in srgb,var(--c) 26%,var(--glass-line));border-radius:16px;
 background:radial-gradient(200px 80px at var(--ax) 15%,color-mix(in srgb,var(--c) 20%,transparent),transparent 70%),
 radial-gradient(240px 100px at var(--bx) 95%,color-mix(in srgb,var(--c) 14%,transparent),transparent 70%),
 linear-gradient(180deg,var(--glass-hi),transparent 40%),var(--glass);
 -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%)}
.row.fail .main{border-color:color-mix(in srgb,var(--fail) 35%,var(--glass-line))}
.row.wait .main{border-radius:16px;background:color-mix(in srgb,var(--you) 5%,var(--glass))}
/* agent cards: tinted glass in the agent's colour; a light sheen crosses the card each time it takes a step */
.acard{position:relative;overflow:hidden;border-radius:14px;border-color:color-mix(in srgb,var(--a) 30%,var(--glass-line));
 background:linear-gradient(135deg,color-mix(in srgb,var(--a) 13%,transparent),transparent 55%),linear-gradient(180deg,var(--glass-hi),transparent 42%),var(--glass)}
.acard.plan{border-style:dashed;opacity:.75;background:var(--glass)}
.acard.go::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 30%,var(--sheen) 50%,transparent 70%);transform:translateX(-110%);animation:sheen 1s ease-out}
@keyframes sheen{to{transform:translateX(110%)}}
.acard .rl.now{background:color-mix(in srgb,var(--a) 12%,transparent);border:1px solid color-mix(in srgb,var(--a) 22%,transparent);border-radius:9px}
.sum{border-radius:12px;border-left-width:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--a) 11%,transparent),transparent 50%),linear-gradient(180deg,var(--glass-hi),transparent 42%),var(--glass)}
.av{background:color-mix(in srgb,var(--a) 20%,transparent);border:1px solid color-mix(in srgb,var(--a) 35%,transparent)}
.pill,.chip{background-color:color-mix(in srgb,var(--card) 40%,transparent)}
/* the agent is alive: an orb that floats, blinks and glances at its work when it takes a step */
.aorb{position:relative;width:28px;height:28px;border-radius:50%;flex:none;
 background:radial-gradient(circle at 34% 28%,color-mix(in srgb,#fff 60%,var(--a)),var(--a) 72%);border:1px solid color-mix(in srgb,var(--a) 55%,transparent);animation:alive 3.4s ease-in-out infinite}
.aorb .eyes{position:absolute;inset:0;animation:look 7s ease-in-out infinite}
.aorb .eye{position:absolute;top:10px;width:4px;height:7px;border-radius:2px;background:#fff;animation:blinkeye 4.6s infinite}
.aorb .eye.l{left:8.5px}.aorb .eye.r{right:8.5px}
.acard.go .aorb .eyes{animation:glance 1s ease-out}
.acard.go .aorb{animation:nod .45s ease-out,alive 3.4s .45s ease-in-out infinite}
@keyframes alive{50%{transform:translateY(-1.5px)}}
@keyframes blinkeye{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.12)}}
@keyframes look{0%,28%{transform:translate(0,0)}38%,58%{transform:translate(1.5px,.5px)}68%,100%{transform:translate(-1px,0)}}
@keyframes glance{30%,70%{transform:translate(2.5px,2.5px)}}
/* what it is doing, drawn: reading scans lines, searching moves a magnifier, writing draws ink, running prints output */
.rl .ic:has(svg){width:30px;height:20px}
.scene{width:30px;height:20px;display:block;color:var(--a);fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.scene .pg{fill:color-mix(in srgb,var(--a) 10%,transparent)}
.scene .ln{opacity:.55}
.scene .hl{fill:var(--a);stroke:none;opacity:.28;animation:scanl 2.4s ease-in-out infinite}
.scene .mg{animation:hunt 2.6s ease-in-out infinite}
.scene .ink{stroke-dasharray:15;stroke-dashoffset:15;animation:ink 1.8s linear infinite}
.scene .pen{fill:var(--a);stroke:none;animation:pen 1.8s linear infinite}
.scene .o1{animation:out1 2s steps(1) infinite}.scene .o2{animation:out2 2s steps(1) infinite}.scene .cur{fill:var(--a);stroke:none;animation:blink 1s step-end infinite}
@keyframes scanl{0%,100%{transform:translateY(0)}33%{transform:translateY(3.5px)}66%{transform:translateY(7px)}}
@keyframes hunt{0%,100%{transform:translate(-7px,0)}50%{transform:translate(2px,3px)}}
@keyframes ink{to{stroke-dashoffset:0}}
@keyframes pen{from{transform:translateX(-14px)}to{transform:translateX(0)}}
@keyframes out1{0%{opacity:0}25%,100%{opacity:1}}
@keyframes out2{0%,50%{opacity:0}75%,100%{opacity:1}}
.rl .typing::after,.pnow .typing::after{display:none}
/* the agent's plan: a pill on its card opens a glass panel that updates live */
.planb{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;padding:1px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;flex:none;
 color:color-mix(in srgb,var(--a) 80%,var(--text));background:color-mix(in srgb,var(--a) 10%,transparent);border:1px solid color-mix(in srgb,var(--a) 30%,transparent)}
.planb b{font-weight:500}.planb:hover{background:color-mix(in srgb,var(--a) 18%,transparent)}
.planb[aria-expanded=true]{background:color-mix(in srgb,var(--a) 22%,transparent)}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(410px,calc(100vw - 24px));z-index:20;display:flex;flex-direction:column;border-radius:18px;
 border:1px solid color-mix(in srgb,var(--a) 32%,var(--glass-line));
 background:linear-gradient(160deg,color-mix(in srgb,var(--a) 15%,transparent),transparent 45%),linear-gradient(180deg,var(--glass-hi),transparent 30%),color-mix(in srgb,var(--card) 88%,transparent);
 -webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);animation:slidein .35s cubic-bezier(.2,.8,.3,1)}
.drawer[hidden]{display:none}
@keyframes slidein{from{transform:translateX(28px);opacity:0}}
@keyframes slideup{from{transform:translateY(28px);opacity:0}}
.dr-h{display:flex;gap:10px;align-items:center;padding:14px 14px 4px 16px}
.dr-h b{font-weight:500;font-size:14px}
.dr-x{margin-left:auto;border:0;background:transparent;font-size:18px;line-height:1;cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:50%}
.dr-x:hover{background:color-mix(in srgb,var(--text) 7%,transparent)}
.dr-sub{padding:0 16px;color:var(--muted);font-size:12px}
.pl{list-style:none;margin:0;padding:6px 10px 16px;overflow:auto;flex:1}
.pl>li{border-radius:11px;padding:6px 8px;margin:2px 0;border:1px solid transparent}
.pi{display:flex;gap:9px;align-items:flex-start;width:100%;border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit}
button.pi{cursor:pointer}
.pn{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:1px solid var(--glass-line);color:var(--faint);margin-top:1px}
.pt{flex:1;min-width:0}
.pw{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:2px}
.pl>li.d .pn{background:var(--a);border-color:var(--a);color:#fff}
.pl>li.d .pt{color:var(--muted)}
.pl>li.c{background:color-mix(in srgb,var(--a) 12%,transparent);border-color:color-mix(in srgb,var(--a) 28%,transparent)}
.pl>li.c .pt{font-weight:500}
.pl>li.c .pn{border-color:var(--a);color:var(--a)}
.pl>li.u{opacity:.62}
.pl>li.just{animation:justdone 1.4s ease-out}
@keyframes justdone{from{background:color-mix(in srgb,var(--test) 24%,transparent)}}
.ps{list-style:none;margin:4px 0 2px 29px;padding:0;font-size:12px;color:var(--muted)}
.ps li{padding:1px 0}
.ps li::before{content:"\2713  ";color:var(--test)}
.pnow{display:flex;gap:8px;align-items:center;margin:4px 0 0 29px;font-size:12.5px;color:var(--text)}
.dr-ft{padding:8px 16px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--glass-line)}
@media (max-width:620px){.drawer{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:82vh;animation:slideup .35s cubic-bezier(.2,.8,.3,1)}}
.sum-top{display:flex;gap:8px;align-items:center;min-width:0}.sum-top .sum-h{flex:1}
.upn[hidden],.agrid:empty,.fin:empty{display:none}
@media (max-width:620px){.sum-top{align-items:flex-start}}
/* plan progress: a small ring next to the title */
.ring{display:inline-flex;gap:5px;align-items:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ring svg{width:15px;height:15px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:2.6}
.ring .tr{stroke:color-mix(in srgb,var(--a) 20%,transparent)}
.ring .fg{stroke:var(--a);stroke-linecap:round}
@media (max-width:620px){.tm{white-space:normal;text-align:right}.stats{grid-template-columns:repeat(3,1fr)}.stat:nth-child(n+4){display:none}.top{flex-wrap:wrap}.meta{flex-direction:row;align-items:center;flex-basis:100%;flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body data-ov="idle">
<div class="field" aria-hidden="true"><i></i><i></i><i></i></div>
<aside id="pdr" class="drawer" role="dialog" aria-label="Plan" hidden></aside>
<div class="wrap">
  <div id="idle" class="idle">
    <div class="orbw"><div class="orb"></div><div class="spark">&#10022;</div></div>
    <div style="font-size:14px;font-weight:500;color:var(--text)">No task is running</div>
    <p>Start a change with <code>/sdlc</code> or a new product with <code>/factory</code>, in Claude Code or Cursor; this page wakes up by itself.</p>
    <button class="btn" type="button" id="demoBtn" style="--cur:var(--spec)">Watch a demo run</button>
  </div>
  <div id="app" hidden>
    <header class="top">
      <div class="kb" id="kb" aria-hidden="true"></div>
      <div class="who">
        <div class="l1"><b id="tid"></b><span class="tt" id="ttl"></span><span class="risk" id="risk" hidden></span><span class="demo" id="demoTag" hidden>demo</span></div>
        <div class="l2"><span id="doing" aria-hidden="true"></span><span class="caret" aria-hidden="true"></span><span class="sr" id="doingSr" aria-live="polite"></span></div>
      </div>
      <div class="meta">
        <div class="row1"><span class="pill" id="mode" hidden></span><span class="pill" id="code" hidden></span><span class="pill" id="size"></span><span class="pill" id="tool"></span><span class="pill" id="state"></span><button type="button" class="pill thm" id="thm" title="Light, or follow the computer's light/dark setting"></button></div>
        <span class="sub beat" id="upd"></span>
      </div>
    </header>
    <section class="stats" aria-label="Progress">
      <div class="stat"><span class="sub">Total time</span><b id="total">-</b></div>
      <div class="stat"><span class="sub">This stage</span><b id="stagetime">-</b></div>
      <div class="stat"><span class="sub">Files read</span><b id="c-read">0</b></div>
      <div class="stat"><span class="sub">Edits</span><b id="c-edit">0</b></div>
      <div class="stat"><span class="sub">Commands</span><b id="c-run">0</b></div>
    </section>
    <section id="gate" hidden></section>
    <section class="crew" id="crew" hidden aria-label="Team"></section>
    <ol class="tl" id="tl" aria-label="Stages"></ol>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <dialog class="fv" id="fv" aria-labelledby="fvp"><div class="fv-h"><span class="fv-p" id="fvp"></span><button type="button" id="fvcp">Copy path</button><button type="button" id="fvx" autofocus>Close</button></div><div class="fv-b" id="fvb"></div></dialog>
</div>
<script>
"use strict";
const PROJ=window.__PROJECT__||{name:"",ticket:""};
/* stages come from the data (task or product mode); these names and defaults cover both modes */
const TASK=[["spec","Spec"],["design","Design"],["build","Build"],["review","Review"],["test","Test"],["verify","Verify"],["release","Release"],["wrap","Wrap-up"]];
const NAMES=Object.assign(Object.fromEntries(TASK),{intake:"Intake",base:"Base",requirements:"Requirements",product:"Product review",prototype:"Prototype",stories:"Stories",audit:"Audit"});
const ACTOR={spec:"spec-analyst",design:"solution-architect",build:"main session",review:"code-reviewer",test:"qa-engineer",verify:"verifier",release:"release-manager",wrap:"commit-msg",
  intake:"main session",base:"base-builder",requirements:"spec-analyst",product:"product-critic",prototype:"ux-designer",stories:"story-sizer",audit:"audit-expert"};
const ASKS={spec:"to confirm what it understood",design:"to review and approve the design",build:"for an answer before building",review:"for a decision on the review",test:"for a decision on the tests",verify:"for an answer to finish the check",release:"for a go-live decision",wrap:"for a last answer",
  intake:"to agree the plan",base:"for an answer on the base",requirements:"to confirm the spec",product:"to answer the gaps and issues",prototype:"to pick an option",stories:"to agree the scope and the MVP",audit:"for a decision on the audit"};
/* the main session shows as the Tech Lead; status.json, events and hooks keep "main session" */
const DN=a=>String(a==null?"":a).replace(/\bmain session\b/g,"Tech Lead");
function waiters(g){const st=D.stages.find(s=>s.k===g.stage)||{};return (g.by||st.actor||ACTOR[g.stage]||"main session").split(", ")}
function whoWaits(g){const w=waiters(g).map(DN);return w.join(" and ")+(w.length>1?" are":" is")+" waiting for you "+(ASKS[g.stage]||"")}
function gname(g){return (g.gid?g.gid+" ":"")+(NAMES[g.stage]||g.stage)}
const VERB={spec:"is writing the spec",design:"is designing the change",build:"is building it",review:"is reviewing the diff",test:"is running the tests",verify:"is checking it live",release:"is checking the release",wrap:"is wrapping up",
  intake:"is reading the requirement",base:"is building the base",requirements:"is writing the spec",product:"is reviewing the product",prototype:"is building the prototype",stories:"is sizing the stories",audit:"is auditing the product"};
const TAG={block:"blocked",flag:"fixed",fail:"must fix",must:"must fix",gate:"your turn",ok:"approved",changes:"changes",ask:"question",start:"started",done:"done",note:"note",agent:"agent",read:"read",edit:"edit",run:"run",search:"search",skill:"skill",plan:"team"};
/* the core teams, for the demo and for data written before teams were stored; real tasks carry D.teams */
const CORE_TEAMS=[["lead","Lead",["main session"]],["product","Product",["spec-analyst","product-critic","story-sizer"]],["design","Design",["ux-designer"]],
  ["architecture","Architecture",["solution-architect","data-architect","security-architect"]],["engineering","Engineering",["base-builder","backend-developer","frontend-developer","integration-engineer"]],
  ["domain","Domain experts",["sf-expert","ai-engineer","n8n-expert"]],["quality","Quality",["code-reviewer","qa-engineer","verifier","performance-engineer","bug-investigator"]],
  ["audit","Audit",["audit-expert"]],["operations","Operations",["devops-engineer","release-manager"]],["helpers","Helpers",["explorer"]]].map(([id,name,agents])=>({id,name,agents}));
if(PROJ.name)document.title=PROJ.name+" - Live status";
const REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D=null,seen=0,rows={},gateKey=null,demo=null,lastChange=Date.now();

function ms(a,b){return (b?Date.parse(b):Date.now())-Date.parse(a)}
function fmt(m){const s=Math.max(0,Math.floor(m/1000));if(s<60)return s+"s";const mi=Math.floor(s/60);if(mi<60)return mi+"m "+String(s%60).padStart(2,"0")+"s";return Math.floor(mi/60)+"h "+String(mi%60).padStart(2,"0")+"m"}
function hm(t){const d=new Date(t);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function cur(d){for(const st of ["wait","live","fail"]){const h=d.stages.filter(s=>s.state===st);if(h.length)return h[h.length-1]}
  const started=d.stages.filter(s=>s.start);return started.length?started[started.length-1]:d.stages.find(s=>s.state!=="skip")}
function overall(d){if(d.gate||d.stages.some(s=>s.state==="wait"))return "wait";
  if(d.stages.every(s=>s.state==="done"||s.state==="skip"))return "done";
  if(d.stages.some(s=>s.state==="fail")&&!d.stages.some(s=>s.state==="live"))return "fail";
  return ms(d.updated)>180000?"idle":"live"}

const MEM={};
function store(k){if(!MEM[k]){let v=null;try{v=JSON.parse(localStorage.getItem("lsc:"+k))}catch(e){}MEM[k]=v||{lines:{},general:""}}return JSON.parse(JSON.stringify(MEM[k]))}
function keep(k,v){MEM[k]=v;try{localStorage.setItem("lsc:"+k,JSON.stringify(v))}catch(e){}}

function buildRows(d){
  const ol=$("#tl");ol.innerHTML="";rows={};
  d.stages.forEach(({k,name:n})=>{const li=document.createElement("li");li.className="row s-"+k+" todo";
    li.innerHTML='<div class="rail"><span class="mk"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8.5l2.6 2.6L12 5.5"/></svg></span></div>'+
      '<div class="main"><button class="h" type="button" aria-expanded="false"><span class="nm">'+esc(n)+'</span><span class="gid" hidden></span><span class="whoa"></span><span class="bud" hidden></span><span class="tm"></span></button>'+
      '<div class="out"></div><div class="body"></div><ul class="feed"></ul><div class="chips"></div></div>';
    const h=li.querySelector(".h");h.onclick=()=>{li.classList.toggle("open");h.setAttribute("aria-expanded",li.classList.contains("open"));feed(k,false)};
    ol.appendChild(li);rows[k]=li});
}
function line(e){const li=document.createElement("li");li.dataset.n=e.n;li.className="k-"+e.kind;
  li.innerHTML='<span class="when">'+hm(e.t)+'</span><span><span class="tag">'+esc(TAG[e.kind]||e.kind)+'</span><span class="tx"></span>'+
    (e.actor&&e.actor!=="main session"&&e.actor!=="you"&&e.actor!=="guard"&&e.actor!=="rules check"?' '+tag(e.actor,acol(e.actor)):"")+'</span>';
  li.querySelector(".tx").textContent=e.text;
  if(e.answer){const a=document.createElement("div");a.className="ans";a.textContent="A: "+e.answer;li.lastElementChild.appendChild(a)}
  return li}
function type(el,text){if(REDUCE){el.textContent=text;return}
  let i=0;const step=Math.max(1,Math.round(text.length/45));el.textContent="";el.classList.add("typing");
  const iv=setInterval(()=>{i+=step;el.textContent=text.slice(0,i);if(i>=text.length){clearInterval(iv);el.classList.remove("typing");el.textContent=text}},18)}
/* a failed stage keeps every MUST of its latest round in view, plus the last 5 events */
function musts(all,sk){const last=all.slice(-5);if(!sk||sk.state!=="fail")return last;
  const i=all.map(e=>e.kind).lastIndexOf("start"),m=all.slice(i+1).filter(e=>e.kind==="must");
  return [...new Set([...m,...last])].sort((a,b)=>a.n-b.n)}
function feed(k,animate){
  const ul=rows[k].querySelector(".feed"),all=D.events.filter(e=>e.stage===k&&NOTE.includes(e.kind)),sk=D.stages.find(s=>s.k===k),want=musts(all,sk),have=new Set([...ul.children].map(li=>+li.dataset.n));
  want.forEach(e=>{if(have.has(e.n))return;const li=line(e);ul.appendChild(li);if(animate&&e.n>seen){li.classList.add("new");type(li.querySelector(".tx"),e.text);setTimeout(()=>li.classList.remove("new"),2600)}});
  const ok=new Set(want.map(e=>e.n));[...ul.children].forEach(li=>{if(!ok.has(+li.dataset.n))li.remove()});
  const chips=rows[k].querySelector(".chips"),byP=new Map();
  D.events.forEach(e=>{if(e.stage!==k||e.kind!=="edit"||!e.file)return;const m=/^(?:Wrote|Edited) (.+)$/.exec(e.text||""),p=e.path||(m?m[1]:e.file);if(!byP.has(p))byP.set(p,e.file)});
  const files=[...byP].slice(-8),hc=new Set([...chips.children].map(c=>c.dataset.p));
  files.forEach(([p,f])=>{if(hc.has(p))return;const c=document.createElement("button");c.type="button";c.className="chip"+(animate?" pop":"");c.dataset.p=p;c.title="Open "+p;c.textContent=f;chips.appendChild(c)});
}
function count(id,v){const el=$(id),old=+el.textContent||0;if(old===v)return;el.textContent=v;el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}

function apply(d){
  const first=!D||D.id!==d.id||D.stages.length!==d.stages.length,prev=first?null:D;
  if(first){buildRows(d);seen=0;gateKey=null;bodyKey={};LAST={}}
  D=d;$("#idle").hidden=true;$("#app").hidden=false;$("#demoTag").hidden=!(demo||d.demo);
  const c=cur(d),ov=overall(d);document.body.dataset.ov=ov;
  document.documentElement.style.setProperty("--cur","var(--"+c.k+")");
  $("#tid").textContent=d.id;$("#ttl").textContent=d.title;
  const rk=$("#risk"),rv=["low","medium","high"].includes(d.risk)?d.risk:"";rk.hidden=!rv;rk.className="risk "+rv;rk.textContent=rv+" risk";
  rk.title=rv?(d.riskWhy&&d.riskWhy.length?"Risk evidence: "+d.riskWhy.join("; "):"Risk "+rv):"";
  $("#size").textContent="Size "+d.size;$("#tool").textContent=d.tool==="cursor"?"Cursor":"Claude Code";
  const pm=d.mode==="product",mp=$("#mode"),cp=$("#code");mp.hidden=!pm;mp.textContent="Product";cp.hidden=!pm;
  cp.textContent="Code "+(d.codeOpen?"open":"closed");cp.title=d.root?"Product root: "+d.root:"";
  const pn=d.project||PROJ.name;document.title=(pn?pn+" - ":"")+d.id+" live status";
  const pill=$("#state");pill.className="pill st-"+ov;pill.textContent={live:"Live",wait:"Your turn",done:"Done",fail:"Fixing",idle:"Idle"}[ov];
  const ev=d.events.length?d.events[d.events.length-1]:null;
  const W=working(),par=ov==="live"&&W.length>1,pn2=W.map(r=>DN(r.expert)).join(", "),dn=runsOf(c.k).filter(r=>r.state!=="live").length;
  if(par)say(W.length+" agents working in parallel: "+pn2+(dn?" · "+dn+" done":""),!first,
    '<span class="n">'+W.length+" agents working in parallel</span>: "+esc(pn2)+(dn?' <span class="sub">· '+dn+" done</span>":""));
  else say(ov==="wait"?(d.gate?gname(d.gate)+": "+whoWaits(d.gate):"Waiting for you"):ov==="done"?"All stages done":ov==="idle"?"No activity for "+fmt(ms(d.updated)):ov==="fail"?NAMES[c.k]+" found problems":c.state==="done"?between(d,c):
    ev&&ms(ev.t)<90000&&ev.kind!=="gate"?(ev.actor&&ev.actor!=="you"?DN(ev.actor)+": ":"")+(TOOLK.includes(ev.kind)?ing(ev.text)+"\u2026":ev.text):DN(c.actor||ACTOR[c.k])+" "+(VERB[c.k]||"is working"),!first&&ov==="live");
  d.stages.forEach(s=>{const li=rows[s.k],was=prev?(prev.stages.find(x=>x.k===s.k)||{}).state:null;
    li.className="row s-"+s.k+" "+s.state+(li.classList.contains("open")?" open":"");
    if(was&&was!=="done"&&s.state==="done"){li.classList.add("just");setTimeout(()=>li.classList.remove("just"),1700)}
    const ex=((d.plan&&d.plan.rows)||[]).filter(r=>r.stage===s.k),lv=ex.filter(r=>r.state==="live");
    li.querySelector(".whoa").textContent=s.state==="live"?"":s.state==="skip"?"skipped for this size":ex.length?(lv.length?lv:ex).map(r=>DN(r.expert)).join(", "):DN(s.actor||ACTOR[s.k]);
    li.querySelector(".out").textContent=s.out||"";
    const gb=li.querySelector(".gid");gb.hidden=!s.gate;if(s.gate){const gs=((d.gates||{})[s.gate]||{}).state||"open";
      gb.className="gid "+gs;gb.textContent=s.gate+({approved:" approved",waiting:" waiting",changes:" changes"}[gs]||"")}
    if(["live","wait","fail"].includes(s.state)||li.classList.contains("open")||li.querySelector(".chips").children.length||d.events.some(e=>e.stage===s.k&&e.kind==="edit"))feed(s.k,!first)});
  const last=d.events.length?d.events[d.events.length-1].n:0;if(last>seen){lastChange=Date.now();beat()}seen=last;
  const n=d.counts||{};count("#c-read",n.read||0);count("#c-edit",n.edit||0);count("#c-run",n.run||0);
  gate();bodies();crew();tick();
}
/* agent runs (1.5.0): one card per run inside its stage (the live-rolling prototype, variant B). A step comes as a
   plain imperative ("Read context.md", a Bash call's own description) and reads as "Reading ..." while it runs and
   "Read ..." once done; finished runs fold into their summary for people */
const TCOL={lead:"wrap",product:"product",design:"design",architecture:"spec",engineering:"build",domain:"verify",quality:"review",audit:"stories",operations:"release",helpers:"base"};
const TOOLK=["read","edit","run","search","skill"],NOTE=["block","flag","fail","must","gate","ok","changes","ask","note"];
const V2={Read:["Reading","Read"],List:["Listing","Listed"],Show:["Showing","Showed"],Write:["Writing","Wrote"],Count:["Counting","Counted"],Grep:["Searching","Searched"],
Map:["Mapping","Mapped"],Inspect:["Inspecting","Inspected"],Check:["Checking","Checked"],Run:["Running","Ran"],Find:["Finding","Found"],Search:["Searching","Searched"],
Change:["Changing","Changed"],Compare:["Comparing","Compared"],Extract:["Extracting","Extracted"],Verify:["Verifying","Verified"],Print:["Printing","Printed"],Open:["Opening","Opened"],
Test:["Testing","Tested"],Look:["Looking","Looked"],Diff:["Comparing","Compared"],Confirm:["Confirming","Confirmed"],Locate:["Locating","Located"],Get:["Getting","Got"],
Apply:["Applying","Applied"],Copy:["Copying","Copied"],Create:["Creating","Created"],Measure:["Measuring","Measured"],Build:["Building","Built"],Validate:["Validating","Validated"],
Scan:["Scanning","Scanned"],Stamp:["Stamping","Stamped"],Trace:["Tracing","Traced"],Fetch:["Fetching","Fetched"],Update:["Updating","Updated"],Add:["Adding","Added"],
View:["Viewing","Viewed"],Save:["Saving","Saved"],Parse:["Parsing","Parsed"],Load:["Loading","Loaded"],Propose:["Proposing","Proposed"],Draft:["Drafting","Drafted"],Plan:["Planning","Planned"],
Note:["Noting","Noted"],Record:["Recording","Recorded"],Review:["Reviewing","Reviewed"],Design:["Designing","Designed"],Prepare:["Preparing","Prepared"],Edit:["Editing","Edited"],
Remove:["Removing","Removed"],Fix:["Fixing","Fixed"],Patch:["Patching","Patched"],Rerun:["Re-running","Re-ran"],Use:["Using","Used"],Delete:["Deleting","Deleted"],Append:["Appending","Appended"],
Summarize:["Summarizing","Summarized"],Tick:["Ticking","Ticked"],Drop:["Dropping","Dropped"],Restamp:["Restamping","Restamped"],Render:["Rendering","Rendered"],Ask:["Asking","Asked"],
Install:["Installing","Installed"],Compile:["Compiling","Compiled"],Start:["Starting","Started"],Stop:["Stopping","Stopped"],Move:["Moving","Moved"],Rename:["Renaming","Renamed"],
Merge:["Merging","Merged"],Sort:["Sorting","Sorted"],Split:["Splitting","Split"],Clean:["Cleaning","Cleaned"],Format:["Formatting","Formatted"],Lint:["Linting","Linted"],
Collect:["Collecting","Collected"],Explain:["Explaining","Explained"],Describe:["Describing","Described"],Wait:["Waiting","Waited"],Try:["Trying","Tried"]};
function verb(t,i){t=String(t==null?"":t);const m=t.match(/^([A-Z][a-z]+)\b([\s\S]*)$/);return m&&V2[m[1]]?V2[m[1]][i]+m[2]:t}
const ing=t=>verb(t,0),past=t=>verb(t,1),lc=s=>s?s.charAt(0).toLowerCase()+s.slice(1):"",uc=s=>s?s.charAt(0).toUpperCase()+s.slice(1):"";
const JOB={spec:"Write the spec",design:"Design the change",build:"Build the change",review:"Review the diff",test:"Run the tests",verify:"Check it in the running app",release:"Check the release",
  wrap:"Wrap up the task",intake:"Read the requirement",base:"Build the base",requirements:"Write the spec",product:"Review the product",prototype:"Build the prototype",stories:"Size the stories",audit:"Audit the product"};
const INI={"n8n-expert":"n8n","ai-engineer":"AI","ux-designer":"UX","sf-expert":"SF","qa-engineer":"QA","main session":"TL"};
let LAST={},OPEN=new Set(),bodyKey={};
function ini(a){const b=String(a).split(" (")[0];return INI[b]||b.split(/[-\s]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?"}
function acol(a,team){if(a==="main session")return "var(--wrap)";
  const R=(D.plan&&D.plan.rows)||[],r=R.find(x=>x.expert===a)||R.find(x=>x.agent===a);
  return "var(--"+(TCOL[team||(r&&r.team)||benchTeam(r?r.agent:a)]||"base")+")"}
function col(r){return acol(((D.plan&&D.plan.rows)||[]).some(x=>x.expert===r.expert)?r.expert:r.agent)}
function prow(k){return ((D.plan&&D.plan.rows)||[]).filter(r=>r.stage===k)}
function runsOf(k){return (D.runs||[]).filter(r=>r.stage===k)}
function ago(t){const s=Math.max(0,Math.round(ms(t)/1000));return s<60?s+"s ago":s<3600?Math.round(s/60)+" min ago":Math.round(s/3600)+" h ago"}
/* what the step is doing, drawn from its verb: reading, searching, writing or running */
const SCENE={
